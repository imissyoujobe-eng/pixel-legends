<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ramp Rally</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script src="../lib/three.min.js"></script>
<script>
// Ramp Rally: full 3D motocross. Two laps of a dirt stadium track with tabletops, doubles, whoops and a step-up.
// Hold GAS, steer with the joystick, bump the other riders off the track, and hit the TRICK button in the air:
// the joystick direction picks the trick, hold longer to keep spinning, let go before you land or you wreck.
K.theme({ bg: '#1a1020', ink: '#fff6ea', accent: '#ff7a1a', accentInk: '#1a0a00' });
K.hud(['heat', 'pos', 'time']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'TRICK' }, { id: 'a', label: 'GAS' }] });

const L = 220, R = 45, LEN = 2 * L + 2 * Math.PI * R, HW = 8, LAPS = 2, GRAV = 32, VMAX = 40;
const HEATS = [{ n: 'Valley', cpu: 0.9 }, { n: 'Canyon', cpu: 0.96 }, { n: 'Thunder Hill', cpu: 1.02 }];
const COLS = [0xff7a1a, 0x3fa9ff, 0x7cff6b, 0xff4fa3], NUMS = [7, 22, 41, 88];
// tricks by joystick direction while holding TRICK in the air
const TRICKS = {
  n: { name: 'SUPERMAN', grab: 1, pts: 300 },
  u: { name: 'BACKFLIP', pitch: 1, per: 0.75, pts: 900, names: ['BACKFLIP', 'DOUBLE BACKFLIP', 'TRIPLE BACKFLIP'] },
  d: { name: 'FRONT FLIP', pitch: -1, per: 0.85, pts: 1000, names: ['FRONT FLIP', 'DOUBLE FRONT FLIP'] },
  l: { name: '360', yaw: 1, per: 0.6, pts: 600, names: ['360', '720', '1080', '1440'] },
  r: { name: '360', yaw: -1, per: 0.6, pts: 600, names: ['360', '720', '1080', '1440'] },
  ul: { name: 'BAR SPIN', bar: 1, per: 0.32, pts: 350, names: ['BAR SPIN', 'DOUBLE BAR SPIN', 'TRIPLE BAR SPIN', 'QUAD BAR SPIN'] },
  ur: { name: 'HEEL CLICKER', grab: 2, pts: 350 },
  dl: { name: 'NAC NAC', grab: 3, pts: 350 },
  dr: { name: 'CAN-CAN', grab: 4, pts: 350 }
};

// ---------- the track: an oval with wiggly straights, sampled as a centre line ----------
function base(s) {
  s = ((s % LEN) + LEN) % LEN; let x, z, u = s, w = 0;

}
const NS = Math.ceil(LEN), CX = new Float32Array(NS + 1), CZ = new Float32Array(NS + 1), TX = new Float32Array(NS + 1), TZ = new Float32Array(NS + 1);
{ const raw = []; for (let i = 0; i <= NS; i++) raw.push(base(i * LEN / NS));
  for (let i = 0; i <= NS; i++) { const a = raw[(i + NS - 1) % NS], b = raw[(i + 1) % NS], tx = b.x - a.x, tz = b.z - a.z, m = Math.hypot(tx, tz); TX[i] = tx / m; TZ[i] = tz / m; }
  for (let i = 0; i <= NS; i++) { const r0 = raw[i]; CX[i] = r0.x - TZ[i] * r0.w; CZ[i] = r0.z + TX[i] * r0.w; } }
function cen(s) { s = ((s % LEN) + LEN) % LEN; const f = s / LEN * NS, i = Math.floor(f), k = f - i, j = (i + 1) % NS; const tx = TX[i] + (TX[j] - TX[i]) * k, tz = TZ[i] + (TZ[j] - TZ[i]) * k, m = Math.hypot(tx, tz); return { x: CX[i] + (CX[j] - CX[i]) * k, z: CZ[i] + (CZ[j] - CZ[i]) * k, tx: tx / m, tz: tz / m }; }
// jumps: tabletops, doubles, whoops and a step-up placed on the straights
const FEATS = [
  { s: 45, k: 'table', H: 4, T: 12 }, { s: 105, k: 'double', H: 4.5 }, { s: 168, k: 'table', H: 5, T: 10 },
  { s: L + Math.PI * R + 12, k: 'whoops', n: 8 }, { s: L + Math.PI * R + 78, k: 'table', H: 6, T: 16 }, { s: L + Math.PI * R + 142, k: 'step', H: 3.2 }
];
function featH(f, u) {
  if (f.k === 'table') { const up = 11, dn = 11; if (u < 0 || u > up + f.T + dn) return 0; if (u < up) return f.H * u / up; if (u < up + f.T) return f.H; return f.H * (1 - (u - up - f.T) / dn); }
  if (f.k === 'double') { if (u < 0 || u > 40) return 0; if (u < 9) return f.H * u / 9; if (u < 11) return f.H * (1 - (u - 9) / 2); if (u < 26) return 0; if (u < 29) return f.H * (u - 26) / 3; return f.H * (1 - (u - 29) / 11); }
  if (f.k === 'whoops') { if (u < 0 || u > f.n * 5.5) return 0; return 1.1 * Math.sin(Math.PI * (u % 5.5) / 5.5); }
  if (f.k === 'step') { if (u < 0 || u > 50) return 0; if (u < 9) return f.H * u / 9; if (u < 10) return f.H * (1 - (u - 9)); if (u < 20) return 0; if (u < 24) return 5.2 * (u - 20) / 4; if (u < 38) return 5.2; return 5.2 * (1 - (u - 38) / 12); }
  return 0;
}
function hAt(s) { s = ((s % LEN) + LEN) % LEN; let h = 0; for (const f of FEATS) h = Math.max(h, featH(f, s - f.s)); return h; }
const slopeAt = s => (hAt(s + 0.4) - hAt(s - 0.4)) / 0.8;
// banked turns: the outside edge lifts on the corners
function bank(s) { s = ((s % LEN) + LEN) % LEN; const inTurn = (s > L && s < L + Math.PI * R) || s > 2 * L + Math.PI * R; return inTurn ? 1 : 0; }

// ---------- game state ----------
let state = 'title', heat, riders, me, time, finished, msg, msgT, best = K.best('ramprally3d'), trickPts, popups = [];
let renderer, scene, camera, stageEl, hudC, hx, camPos, camLook, dust = [], dustPool = [];
function title() { K.card({ title: 'RAMP RALLY', text: 'Two laps of a 3D motocross track. Hold GAS, steer with the joystick, and bump the other riders off the track to make them wreck. In the air hold TRICK: the joystick direction picks it (▲ backflip, ▼ front flip, ◀ ▶ 360s, diagonals for bar spins, can-cans, nac-nacs and heel clickers, no direction for a superman). Hold longer to keep spinning, and let go before you land or you wipe out! Landed tricks give you a speed boost. Finish in the top 2 to move on.', best: best ? 'BEST ' + (best / 100).toFixed(2) + 's' : '', button: 'Start engine', onStart: () => { if (!renderer) setup(); heat = 0; startHeat(); } }); }
function newRider(i) { return { i, s: -6 - (i >> 1) * 7, d: (i % 2 ? 1 : -1) * 3 + (i > 1 ? 0.5 : -0.5), v: 0, vd: 0, y: 0, vy: 0, air: false, cpu: i > 0, col: COLS[i], num: NUMS[i], lap: 0, done: false, t: 0, crash: 0, trick: null, tricksAir: [], pitch: 0, yaw: 0, bar: 0, grab: 0, boost: 0, skill: 1, lane: (i % 2 ? 1 : -1) * 3, think: 0, m: null, wheel: 0, tilt: 0, lean: 0, ai: 0 }; }
function startHeat() {
  if (riders) riders.forEach(r => scene.remove(r.m));
  riders = [0, 1, 2, 3].map(newRider); me = riders[0]; [me.s, riders[3].s] = [riders[3].s, me.s]; [me.d, riders[3].d] = [riders[3].d, me.d];
  riders.forEach((r, k) => { r.skill = HEATS[heat].cpu * (0.95 + k * 0.025); r.m = bikeModel(r); scene.add(r.m); r.y = hAt(r.s); });
  time = -3; finished = []; trickPts = 0; popups = []; state = 'play'; msg = 'HEAT ' + (heat + 1) + ': ' + HEATS[heat].n.toUpperCase(); msgT = 2.4; hud();
}
function place(r) { return 1 + riders.filter(o => o !== r && (o.done ? (!r.done || o.t < r.t) : (!r.done && o.s > r.s))).length; }
function hud() { K.set('heat', 'HEAT ' + (heat + 1) + '/3'); K.set('pos', ['1ST', '2ND', '3RD', '4TH'][place(me) - 1]); K.set('time', Math.max(0, time).toFixed(1) + 's'); }
function say(t, d) { msg = t; msgT = d || 1.2; }

// ---------- riding ----------
function wreck(r, why) {
  if (r.crash > 0) return; r.crash = 2; r.trick = null; r.air = r.y > hAt(r.s) + 0.5; r.spinR = (Math.random() - 0.5) * 12; r.tumble = 0;
  for (let k = 0; k < 14; k++) puff(r, 1.2);
  if (r === me) { say(why || 'WIPEOUT!', 1.4); K.noise(0.6, 0.4); } else if (Math.abs(r.s - me.s) < 40) { popups.push({ txt: '#' + r.num + ' WRECKED!', t: 1.4, col: '#ffd23f' }); K.noise(0.3, 0.2); }
}
function stickDir() { const u = K.down('up'), dn = K.down('down'), l = K.down('left'), rr = K.down('right'); return (u ? 'u' : dn ? 'd' : '') + (l ? 'l' : rr ? 'r' : '') || 'n'; }

  const tr = r.trick, T = TRICKS[tr.k]; r.trick = null;
  if (T.grab) { if (tr.t < 0.2) return; const pts = Math.round(T.pts + tr.t * 400); r.tricksAir.push([T.name, pts]); return; }
  const n = Math.max(1, Math.round(tr.target / T.per)); const pts = T.pts * n + (n > 1 ? n * 200 : 0); r.tricksAir.push([T.names[Math.min(n, T.names.length) - 1], pts]);
}
function land(r) {
  const tr = r.trick;
  if (tr && (tr.held || (!TRICKS[tr.k].grab && tr.t < tr.target - 0.02))) { r.y = hAt(r.s); r.air = false; return wreck(r, tr.held ? 'STILL TRICKING! WIPEOUT!' : 'UNDER-ROTATED!'); }

  r.air = false; r.y = hAt(r.s); r.vy = 0; r.pitch = 0; r.yaw = 0; r.bar = 0; r.grab = 0;
  if (r.tricksAir.length) { const tot = r.tricksAir.reduce((a, t) => a + t[1], 0); r.boost = 1 + r.tricksAir.length * 0.6; if (r === me) { trickPts += tot; popups.push({ txt: r.tricksAir.map(t => t[0]).join(' + ') + '  +' + tot, t: 1.8, col: '#ffd23f' }); K.tune([660, 880, 1100], 0.06); } r.tricksAir = []; }

function step(r, dt, gas, steer, trickBtn, dir) {

    return;

  if (r.boost > 0) r.boost -= dt;
  const top = (VMAX + (r.boost > 0 ? 10 : 0)) * (r.cpu ? r.skill : 1) * (off ? 0.55 : 1);

    if (gas) r.v += (r.v < top ? 22 : -30) * dt; else r.v -= 12 * dt;
    r.v -= slopeAt(r.s) * 14 * dt; r.v = K.clamp(r.v, 0, top + 4);

    if (r.trick) {
      const tr = r.trick, T = TRICKS[tr.k];

      const prev = tr.t; tr.t = tr.held ? tr.t + dt : Math.min(tr.target, tr.t + dt * (T.grab ? 1 : 2.2)); const dd = tr.t - prev;
      if (T.pitch) r.pitch += T.pitch * Math.PI * 2 / T.per * dd;
      if (T.yaw) r.yaw += T.yaw * Math.PI * 2 / T.per * dd;
      if (T.bar) r.bar += Math.PI * 2 / T.per * dd;
      r.grab = T.grab && tr.held ? T.grab : 0;
      if (tr.held && !T.grab && r === me && Math.floor(tr.t / T.per) !== Math.floor(prev / T.per)) K.beep(500 + Math.floor(tr.t / T.per) * 150, 0.05, { vol: 0.04 });

function cpuThink(r, dt) {

// riders side by side push each other; shove someone hard and they go down
function bumps() {
  for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) {
    const a = riders[i], b = riders[j]; if (a.crash > 0 || b.crash > 0 || a.done || b.done) continue;
    const ds = b.s - a.s, dd = b.d - a.d; if (Math.abs(ds) > 2.6 || Math.abs(dd) > 2 || Math.abs(a.y - b.y) > 1.6) continue;

function update(dt) {
  if (!renderer) return;
  if (state === 'play') {
    if (msgT > 0) msgT -= dt; popups.forEach(p => p.t -= dt); popups = popups.filter(p => p.t > 0);
    if (time < 0) { const b = Math.ceil(time); time += dt; if (Math.ceil(time) !== b) K.beep(b === 0 ? 880 : 440, b === 0 ? 0.35 : 0.12, { vol: 0.07 }); }
    else {
      time += dt;
      const steer = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0), btn = K.hit('b') ? 'hit' : K.down('b') ? 'down' : null;
      step(me, dt, K.down('a'), steer, btn, stickDir());
      if (K.down('a') && me.crash <= 0 && Math.random() < 0.5) K.beep(60 + me.v * 4, 0.04, { type: 'sawtooth', vol: 0.02 });

function endHeat() {

  K.tune(ok ? [523, 659, 784, 1047] : [392, 330, 262], 0.1);
  setTimeout(() => {
    const extra = ' Trick points: ' + trickPts + '.';
    if (ok && heat < 2) K.card({ title: (pos === 1 ? '1ST' : '2ND') + ' PLACE!', text: 'Heat ' + (heat + 1) + ' done in ' + me.t.toFixed(2) + ' seconds.' + extra + ' Next up: ' + HEATS[heat + 1].n + '.', best: best ? 'BEST ' + (best / 100).toFixed(2) + 's' : '', button: 'Next heat', onStart: () => { heat++; startHeat(); } });
    else if (ok) K.card({ title: 'CHAMPION!', text: 'You won through all three heats! Final heat ' + me.t.toFixed(2) + ' seconds.' + extra, best: 'BEST ' + (best / 100).toFixed(2) + 's', button: 'Race again', onStart: () => { heat = 0; startHeat(); } });
    else K.card({ title: ['', '', '', '3RD PLACE', '4TH PLACE'][pos], text: 'You need the top 2 to move on.' + extra + ' Try heat ' + (heat + 1) + ' again!', best: best ? 'BEST ' + (best / 100).toFixed(2) + 's' : '', button: 'Retry heat', onStart: startHeat });
  }, 1500);
}

// ---------- 3D world ----------
function mat(c, o) { return new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {})); }
function tex(w, h, paint, rep) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; paint(cv.getContext('2d'), w, h); const t = new THREE.CanvasTexture(cv); if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
function setup() {

  renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  renderer.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block'; stageEl.style.position = 'relative'; stageEl.insertBefore(renderer.domElement, stageEl.firstChild);
  hudC = document.createElement('canvas'); hudC.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1'; stageEl.insertBefore(hudC, renderer.domElement.nextSibling); hx = hudC.getContext('2d');
  camera = new THREE.PerspectiveCamera(62, 1, 0.3, 2500); addEventListener('resize', fit); fit(); build();
}
function fit() { const r = stageEl.getBoundingClientRect(), w = Math.max(100, r.width), h = Math.max(100, r.height); renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 72 : 58; camera.updateProjectionMatrix(); const d = Math.min(devicePixelRatio || 1, 2); hudC.width = w * d; hudC.height = h * d; hx.setTransform(d, 0, 0, d, 0, 0); hudC._w = w; hudC._h = h; }
function build() {
  scene = new THREE.Scene();
  scene.background = tex(4, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#3a5ad8'); gr.addColorStop(0.55, '#ff9a6a'); gr.addColorStop(0.85, '#ffd8a0'); gr.addColorStop(1, '#ffe8c0'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });

  popups.forEach((p, i) => txt(p.txt, w / 2, h * 0.42 + i * 24 - (1.8 - p.t) * 10, 15, p.col));
  if (time < 0) { const n = Math.ceil(-time); for (let k = 0; k < 3; k++) { hx.fillStyle = k < 3 - n ? '#ff3b3b' : '#333'; hx.beginPath(); hx.arc(w / 2 - 34 + k * 34, 90, 12, 0, 7); hx.fill(); } }
  else if (time < 0.8) { for (let k = 0; k < 3; k++) { hx.fillStyle = '#3df07a'; hx.beginPath(); hx.arc(w / 2 - 34 + k * 34, 90, 12, 0, 7); hx.fill(); } txt('GO!', w / 2, 130, 30, '#3df07a'); }
  if (msgT > 0) txt(msg, w / 2, h * 0.2, 22, '#fff');
}
function draw() {}
title();
K.run(update, draw);
</script>
