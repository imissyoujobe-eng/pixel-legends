<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fairway Nine</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Fairway Nine: nine long holes of top-down golf. Pick a club, hold SWING to charge the power meter and let go to hit. Mind the wind, the hills, sand, trees and water.
K.theme({ bg: '#123a1c', ink: '#f4fff0', accent: '#ffd23f', accentInk: '#2a1d00' });
const W = 240, H = 340, TOP = 26;
K.screen(W, H);
K.hud(['hole', 'strokes', 'total']);
K.pad({ dpad: 'lr', buttons: [{ id: 'b', label: 'CLUB' }, { id: 'a', label: 'SWING' }] });

// each hole is a tall strip (L units long) that the camera scrolls along.
// ellipses are [x, y, rx, ry]; trees are [x, y, r]; hills are [x, y, radius, height] (negative height = a dip)
const ROW = [500, 420, 340, 260, 180];
const HOLES = [
  { par: 4, L: 640, tee: [120, 610], cup: [130, 70], fair: [[120, 470, 50, 110], [140, 280, 55, 110], [130, 150, 40, 60]], green: [130, 70, 36, 28], sand: [[70, 340, 14, 10], [190, 250, 16, 10], [92, 96, 12, 9]], water: [], trees: [[40, 500, 11], [205, 470, 10], [30, 240, 10], [215, 150, 10]], hills: [[85, 420, 55, 12], [185, 320, 45, -9], [150, 75, 42, 4]] },
  { par: 3, L: 420, tee: [120, 390], cup: [118, 76], fair: [[120, 336, 30, 26]], green: [120, 82, 40, 30], sand: [[76, 112, 14, 10], [166, 102, 14, 9]], water: [[120, 222, 112, 52]], trees: [[30, 60, 10], [210, 70, 10], [40, 320, 10], [205, 330, 10]], hills: [[135, 90, 45, 5]] },
  { par: 5, L: 900, tee: [60, 870], cup: [180, 60], fair: [[60, 760, 38, 90], [110, 570, 70, 60], [170, 400, 45, 90], [150, 230, 55, 70], [180, 125, 30, 40]], green: [180, 60, 32, 26], sand: [[120, 650, 16, 10], [215, 480, 12, 12], [100, 250, 14, 10], [140, 92, 12, 9]], water: [[32, 420, 30, 70]], trees: [[150, 790, 12], [200, 700, 10], [40, 600, 10], [100, 380, 11], [60, 180, 10], [222, 300, 10]], hills: [[80, 650, 60, 12], [170, 300, 50, -10], [200, 90, 40, 6]] },
  { par: 4, L: 680, tee: [180, 650], cup: [60, 70], fair: [[170, 540, 40, 90], [110, 380, 70, 50], [60, 220, 40, 90]], green: [60, 70, 32, 26], sand: [[100, 86, 14, 10], [152, 362, 14, 10]], water: [[40, 452, 28, 60]], trees: [[222, 420, 11], [140, 240, 10], [200, 120, 10], [110, 520, 10]], hills: [[120, 300, 60, -10], [60, 82, 40, -5]] },
  { par: 4, L: 620, tee: [120, 590], cup: [120, 60], fair: [[120, 330, 28, 240]], green: [120, 60, 30, 24], sand: [[150, 82, 12, 9], [90, 150, 12, 9]], water: [], trees: ROW.flatMap(y => [[72, y, 10], [168, y + 20, 10]]), hills: [[120, 350, 40, 8], [120, 70, 34, 4]] },
  { par: 3, L: 380, tee: [120, 350], cup: [120, 110], fair: [[120, 330, 28, 22]], green: [120, 110, 34, 26], sand: [[150, 92, 9, 7]], water: [[120, 170, 116, 130]], trees: [[24, 40, 10], [214, 44, 10]], hills: [[105, 115, 30, 3]] },
  { par: 4, L: 700, tee: [60, 670], cup: [170, 70], fair: [[80, 560, 45, 90], [150, 330, 55, 110], [170, 160, 40, 60]], green: [170, 70, 30, 24], sand: [[210, 110, 12, 10], [122, 90, 12, 9], [110, 440, 14, 10]], water: [[120, 462, 130, 10]], trees: [[202, 580, 12], [20, 320, 10], [222, 300, 10]], hills: [[60, 600, 60, 10], [160, 260, 60, -12]] },
  { par: 5, L: 960, tee: [200, 930], cup: [52, 60], fair: [[190, 820, 35, 90], [130, 640, 70, 60], [80, 460, 45, 90], [110, 280, 60, 60], [60, 140, 35, 60]], green: [52, 60, 32, 24], sand: [[92, 70, 14, 10], [60, 520, 14, 10], [150, 700, 12, 10], [160, 300, 14, 10]], water: [[195, 470, 40, 50], [28, 300, 24, 40]], trees: [[110, 860, 11], [228, 640, 10], [20, 700, 10], [150, 420, 10], [200, 200, 10], [112, 140, 9]], hills: [[160, 700, 70, 12], [60, 380, 50, -10], [110, 180, 50, 8]] },
  { par: 4, L: 660, tee: [120, 630], cup: [120, 60], fair: [[100, 500, 45, 100], [140, 300, 50, 100], [120, 150, 40, 60]], green: [120, 60, 36, 26], sand: [[80, 92, 14, 10], [165, 86, 14, 10], [80, 300, 14, 10]], water: [[200, 420, 30, 40]], trees: [[30, 540, 10], [210, 560, 10], [40, 200, 10], [205, 200, 10]], hills: [[120, 200, 80, 14], [128, 62, 40, -4]] }
];
const PAR = HOLES.reduce((a, h) => a + h.par, 0);
const FRICT = { green: [0.5, 16], fair: [0.3, 30], rough: [0.12, 60], sand: [0.02, 140] };
// clubs: full-power carry distance, hang time and how much roll is left when the ball lands
const CLUBS = [
  { n: 'DRIVER', d: 250, T: 1.0, keep: 0.62 }, { n: '3 WOOD', d: 215, T: 1.05, keep: 0.55 }, { n: '5 WOOD', d: 190, T: 1.1, keep: 0.5 },
  { n: '5 IRON', d: 165, T: 1.15, keep: 0.42 }, { n: '7 IRON', d: 135, T: 1.22, keep: 0.36 }, { n: '9 IRON', d: 105, T: 1.3, keep: 0.28 },
  { n: 'WEDGE', d: 70, T: 1.4, keep: 0.18 }, { n: 'PUTTER', putt: true }
];
const PUTTER = CLUBS.length - 1, GRAV = 150;

let state = 'title', hole, hd, ball, last, aim, power, charging, dragging, strokes, cards, wind, msg, msgT, phase, best = K.best('fairway9'), splash, club, cam = { y: 0 }, deco, rollT, trail = [];
function bestLine() { return best ? 'BEST ' + fmtPar(best - 100) : ''; }
function fmtPar(n) { return n === 0 ? 'EVEN' : (n > 0 ? '+' : '') + n; }
function title() { K.card({ title: 'FAIRWAY NINE', text: 'Nine long holes. Turn with the arrows, tap CLUB to pick a club (driver, woods, irons, wedge; the putter comes out on the green), then hold SWING to build power and let go to hit. You can also drag back from the ball like a slingshot. Watch the wind and the hills, and stay out of the water!', best: bestLine(), button: 'Tee off', onStart: start }); }
function start() { cards = []; hole = 0; loadHole(); state = 'play'; }
function loadHole() {
  hd = HOLES[hole]; strokes = 0; splash = null; trail = [];
  ball = { x: hd.tee[0], y: hd.tee[1], vx: 0, vy: 0, z: 0, vz: 0 }; last = { x: ball.x, y: ball.y };
  power = 0; charging = false; dragging = false;
  const a = Math.random() * Math.PI * 2, s = Math.random() * (0.4 + hole * 0.06);
  wind = { x: Math.cos(a) * s, y: Math.sin(a) * s };
  deco = []; const n = Math.round(hd.L / 340 * 70); for (let i = 0; i < n; i++) { const x = A.hash(i, hole, 1) * W, y = A.hash(i, hole, 2) * hd.L; if (clearSpot(x, y)) deco.push([x, y, i]); } deco.sort((a, b) => a[1] - b[1]);
  readyShot(); cam.y = K.clamp(ball.y - H * 0.75, 0, hd.L - H);
  say('HOLE ' + (hole + 1) + ' · PAR ' + hd.par + ' · ' + Math.round(Math.hypot(hd.cup[0] - hd.tee[0], hd.cup[1] - hd.tee[1])) + ' YDS', 2); hud();
}
function clearSpot(x, y) { const inP = (e, pad) => ((x - e[0]) / (e[2] + pad)) ** 2 + ((y - e[1]) / (e[3] + pad)) ** 2 < 1; return !hd.fair.some(e => inP(e, 10)) && !hd.water.some(e => inP(e, 8)) && !hd.sand.some(e => inP(e, 8)) && !inP(hd.green, 12) && Math.hypot(x - hd.tee[0], y - hd.tee[1]) > 22 && !hd.trees.some(t => Math.hypot(x - t[0], y - t[1]) < t[2] + 8); }
// get ready for the next shot: aim at the cup and pick the club that reaches it
function readyShot() {
  phase = 'aim'; power = 0; rollT = 0;
  aim = Math.atan2(hd.cup[1] - ball.y, hd.cup[0] - ball.x);
  if (terrain(ball.x, ball.y) === 'green') club = PUTTER;
  else { const d = Math.hypot(hd.cup[0] - ball.x, hd.cup[1] - ball.y); club = 0; for (let i = 0; i < PUTTER; i++) if (CLUBS[i].d >= d * 0.95) club = i; if (strokes === 0 && hd.par > 3) club = 0; }
}
function say(t, d) { msg = t; msgT = d || 1.4; }
function totalRel() { return cards.reduce((a, c) => a + c.s - c.p, 0); }
function hud() { K.set('hole', 'HOLE ' + (hole + 1) + '/9'); K.set('strokes', 'SHOTS ' + strokes); K.set('total', fmtPar(totalRel())); }

const inE = (x, y, e) => ((x - e[0]) / e[2]) ** 2 + ((y - e[1]) / e[3]) ** 2 < 1;
function terrain(x, y) {
  if (inE(x, y, hd.green)) return 'green';
  for (const e of hd.sand) if (inE(x, y, e)) return 'sand';
  for (const e of hd.water) if (inE(x, y, e)) return 'water';
  for (const e of hd.fair) if (inE(x, y, e)) return 'fair';
  return 'rough';
}
// slope of the ground from the hills: the ball rolls downhill
function slope(x, y) { let gx = 0, gy = 0; for (const h of hd.hills) { const dx = x - h[0], dy = y - h[1], r2 = h[2] * h[2], e = h[3] * Math.exp(-(dx * dx + dy * dy) / r2); gx += e * -2 * dx / r2; gy += e * -2 * dy / r2; } return { x: gx, y: gy }; }
function lieFactor() { const t = terrain(ball.x, ball.y); return t === 'sand' ? (club === PUTTER - 1 ? 0.85 : 0.6) : t === 'rough' ? 0.85 : 1; }
// carry distance for the chosen club and power (before wind)
function carry(p) { return CLUBS[club].d * p * lieFactor(); }

function shoot(p) {
  if (p < 0.04) return;
  const t = terrain(ball.x, ball.y), C = CLUBS[club];
  strokes++; last = { x: ball.x, y: ball.y }; hud(); trail = [];
  if (C.putt) { const sp = 18 + p * 150; ball.vx = Math.cos(aim) * sp; ball.vy = Math.sin(aim) * sp; ball.vz = 0; K.beep(900, 0.05, { type: 'triangle', vol: 0.05 }); }
  else {
    const Tp = C.T * (0.6 + 0.4 * p), sp = carry(p) / Tp;
    ball.vx = Math.cos(aim) * sp; ball.vy = Math.sin(aim) * sp; ball.vz = GRAV / 2 * Tp; ball.keep = C.keep;
    K.noise(0.08, 0.2 + p * 0.1); K.beep(club < 3 ? 220 : 320, 0.08, { type: 'triangle', to: 700, vol: 0.05 });
    if (t === 'sand') say('SAND SHOT', 0.8);
  }
  phase = 'roll'; power = 0;
}
function penalty(why) {
  strokes++; hud(); say(why + ' +1', 1.4);
  ball.x = last.x; ball.y = last.y; ball.vx = ball.vy = ball.z = ball.vz = 0; readyShot();
}
function holed() {
  phase = 'holed'; const rel = strokes - hd.par;
  const names = { '-3': 'ALBATROSS!', '-2': 'EAGLE!', '-1': 'BIRDIE!', '0': 'PAR', '1': 'BOGEY', '2': 'DOUBLE BOGEY' };
  say(strokes === 1 ? 'HOLE IN ONE!' : names[rel] || ('+' + rel), 2);
  K.tune(rel <= -1 ? [523, 659, 784, 1047, 1319] : rel === 0 ? [523, 659, 784] : [392, 330], 0.1, { type: 'triangle' });
  cards.push({ p: hd.par, s: strokes }); hud();
  setTimeout(() => { if (state !== 'play') return; if (hole < 8) { hole++; loadHole(); } else finish(); }, 2200);
}
function finish() {
  state = 'over'; const rel = totalRel(), tot = cards.reduce((a, c) => a + c.s, 0);
  best = K.saveBest('fairway9', rel + 100, true);
  const rows = cards.map((c, i) => (i + 1) + ':' + c.s).join('  ');
  K.card({ title: rel < 0 ? 'UNDER PAR!' : rel === 0 ? 'EVEN PAR' : 'ROUND DONE', text: 'You shot ' + tot + ' on a par ' + PAR + ' course (' + fmtPar(rel) + '). ' + rows, best: bestLine(), button: 'Play again', onStart: start });
}

function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  if (splash) { splash.t -= dt; if (splash.t <= 0) splash = null; }
  if (phase === 'aim') {
    const turn = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0);
    if (turn && !dragging) aim += turn * (charging ? 0.5 : 1.3) * dt;
    // CLUB cycles through the clubs (the putter only on the green)
    if (K.hit('b') && !charging) { if (club === PUTTER) say('PUTTER ON THE GREEN', 0.9); else { club = (club + 1) % PUTTER; K.beep(700, 0.04, { vol: 0.04 }); } }
    // hold SWING: power climbs to full and stays there; let go to hit at that power
    if (K.down('a')) { if (!charging) { charging = true; power = 0; } power = Math.min(1, power + dt / 1.25); }
    else if (charging) { charging = false; shoot(power); }
    // or pull back from the ball like a slingshot
    if (K.ptr.down) {
      const px = K.ptr.x, py = K.ptr.y + cam.y, dx = ball.x - px, dy = ball.y - py, d = Math.hypot(dx, dy);
      if (K.ptr.tapped) { if (py - cam.y > H - 46 && px < 120) { /* tapping the club box cycles clubs */ if (club !== PUTTER) club = (club + 1) % PUTTER; } else dragging = true; }
      if (dragging && d > 6) { aim = Math.atan2(dy, dx); power = K.clamp((d - 6) / 90, 0, 1); }
      else if (dragging) power = 0;
    } else if (dragging) { dragging = false; shoot(power); }
  }
  if (phase === 'roll') {
    if (ball.z > 0 || ball.vz > 0) {
      ball.vx += wind.x * 40 * dt; ball.vy += wind.y * 40 * dt;
      ball.vz -= GRAV * dt; ball.z += ball.vz * dt;
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      trail.push({ x: ball.x, y: ball.y - ball.z * 0.5 }); if (trail.length > 24) trail.shift();
      if (ball.z <= 0) {
        ball.z = 0; ball.vz = 0; const t = terrain(ball.x, ball.y);
        const keep = (ball.keep || 0.5) * (t === 'sand' ? 0.2 : t === 'rough' ? 0.55 : t === 'green' ? 0.85 : 1);
        ball.vx *= keep; ball.vy *= keep; K.beep(160, 0.05, { vol: 0.04 });
      }
    } else {
      const t = terrain(ball.x, ball.y);
      if (t === 'water') { splash = { x: ball.x, y: ball.y, t: 0.8 }; K.noise(0.4, 0.3); return penalty('SPLASH'); }
      rollT += dt;
      const g = slope(ball.x, ball.y), roll = t === 'green' ? 120 : t === 'fair' ? 90 : 40;
      ball.vx -= g.x * roll * dt; ball.vy -= g.y * roll * dt;
      const [f, sub] = FRICT[t], sp = Math.hypot(ball.vx, ball.vy);
      const ns = Math.max(0, sp * Math.pow(f, dt) - sub * dt);
      if (sp > 0) { ball.vx *= ns / sp; ball.vy *= ns / sp; }
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      const cd = Math.hypot(ball.x - hd.cup[0], ball.y - hd.cup[1]);
      if (cd < 4) {
        if (ns < 130) { ball.x = hd.cup[0]; ball.y = hd.cup[1]; ball.vx = ball.vy = 0; return holed(); }
        ball.vx += (ball.x - hd.cup[0]) * 6; ball.vy += (ball.y - hd.cup[1]) * 6; K.beep(1200, 0.04, { vol: 0.04 });
      }
      if ((ns < 3 && Math.hypot(g.x, g.y) * roll < 14) || rollT > 10) {
        ball.vx = ball.vy = 0;
        if (strokes >= 10) { say('PICKED UP', 1.4); cards.push({ p: hd.par, s: 10 }); phase = 'holed'; hud(); setTimeout(() => { if (state !== 'play') return; if (hole < 8) { hole++; loadHole(); } else finish(); }, 1600); }
        else readyShot();
      }
    }
    for (const tr of hd.trees) {
      const dx = ball.x - tr[0], dy = ball.y - tr[1], d = Math.hypot(dx, dy);
      if (ball.z < 22 && d < tr[2] + 2) {
        const nx = dx / (d || 1), ny = dy / (d || 1), dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) { ball.vx = (ball.vx - 2 * dot * nx) * 0.45; ball.vy = (ball.vy - 2 * dot * ny) * 0.45; ball.x = tr[0] + nx * (tr[2] + 2); ball.y = tr[1] + ny * (tr[2] + 2); K.noise(0.1, 0.15); say('TREE!', 0.8); }
      }
    }
    if (ball.x < 3 || ball.x > W - 3 || ball.y < 6 || ball.y > hd.L - 3) penalty('OUT OF BOUNDS');
  }
  // camera: follows the ball in flight; while aiming it frames the ball and where the shot will land
  let fy;
  if (phase === 'aim') { const tgt = club === PUTTER ? 60 : carry(Math.max(power, 0.75)); const ty = ball.y + Math.sin(aim) * tgt; fy = Math.min(ball.y - H * 0.18, (ball.y + ty) / 2) - H * 0.5; fy = Math.max(fy, ball.y - H * 0.88); }
  else fy = ball.y - H * 0.55;
  fy = K.clamp(fy, 0, hd.L - H); cam.y += (fy - cam.y) * Math.min(1, dt * (phase === 'roll' ? 4 : 2.5));
}

function ell(c, e, col) { c.fillStyle = col; c.beginPath(); c.ellipse(e[0], e[1], e[2], e[3], 0, 0, 7); c.fill(); }
function draw(c, t) {
  c.fillStyle = '#3e8a36'; c.fillRect(0, 0, W, H);
  if (!hd) return;
  c.save(); c.translate(0, -Math.round(cam.y * 2) / 2);
  const y0 = Math.floor(cam.y / 16), y1 = Math.ceil((cam.y + H) / 16);
  for (let ty = y0; ty <= y1; ty++) for (let tx = 0; tx < W / 16 + 1; tx++) A.grassTD(c, tx * 16, ty * 16, tx, ty, { base: '#3e8a36', hi: '#58a84a', lo: '#2e6e2a' });
  // fairways with mowing stripes
  for (const e of hd.fair) ell(c, [e[0], e[1], e[2] + 3, e[3] + 3], '#5aae40');
  for (const e of hd.fair) ell(c, e, '#6cc24a');
  c.save(); c.beginPath(); for (const e of hd.fair) { c.moveTo(e[0] + e[2], e[1]); c.ellipse(e[0], e[1], e[2], e[3], 0, 0, 7); } c.clip();
  c.fillStyle = '#62b442'; for (let y = Math.floor(cam.y / 16) * 16; y < cam.y + H; y += 16) c.fillRect(0, y, W, 8); c.restore();
  // hills: light on the upper-left slope, shadow on the lower-right, faint contour rings
  for (const h of hd.hills) {
    if (h[1] + h[2] < cam.y || h[1] - h[2] > cam.y + H) continue;
    const up = h[3] > 0, k = Math.min(1, Math.abs(h[3]) / 12);
    let g = c.createRadialGradient(h[0] - h[2] * 0.35, h[1] - h[2] * 0.35, 0, h[0] - h[2] * 0.35, h[1] - h[2] * 0.35, h[2] * 1.1); g.addColorStop(0, up ? 'rgba(255,255,210,' + 0.22 * k + ')' : 'rgba(0,30,0,' + 0.18 * k + ')'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.beginPath(); c.arc(h[0], h[1], h[2] * 1.2, 0, 7); c.fill();
    g = c.createRadialGradient(h[0] + h[2] * 0.35, h[1] + h[2] * 0.35, 0, h[0] + h[2] * 0.35, h[1] + h[2] * 0.35, h[2] * 1.1); g.addColorStop(0, up ? 'rgba(0,30,0,' + 0.2 * k + ')' : 'rgba(255,255,210,' + 0.18 * k + ')'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.beginPath(); c.arc(h[0], h[1], h[2] * 1.2, 0, 7); c.fill();
    c.strokeStyle = 'rgba(0,40,0,.12)'; c.lineWidth = 0.6; for (let r = 0.35; r < 1.1; r += 0.25) { c.beginPath(); c.arc(h[0], h[1], h[2] * r, 0, 7); c.stroke(); }
  }
  // water
  for (const e of hd.water) { ell(c, [e[0], e[1], e[2] + 3, e[3] + 3], '#6a8a4a'); ell(c, [e[0], e[1], e[2] + 1.5, e[3] + 1.5], '#2a6aa8'); const g = c.createRadialGradient(e[0], e[1] - e[3] * 0.3, 2, e[0], e[1], Math.max(e[2], e[3])); g.addColorStop(0, '#5ab0f0'); g.addColorStop(1, '#2a7ac8'); c.fillStyle = g; c.beginPath(); c.ellipse(e[0], e[1], e[2], e[3], 0, 0, 7); c.fill(); }
  c.save(); c.beginPath(); for (const e of hd.water) { c.moveTo(e[0] + e[2], e[1]); c.ellipse(e[0], e[1], e[2], e[3], 0, 0, 7); } c.clip();
  c.fillStyle = 'rgba(255,255,255,.3)'; for (let i = 0; i < 60; i++) { const wy = (i * 53) % hd.L; if (wy < cam.y - 10 || wy > cam.y + H + 10) continue; c.fillRect((i * 37 + t / 40) % W, wy + Math.sin(t / 500 + i) * 2, 6, 1); } c.restore();
  // green with fringe and a checkered cut
  ell(c, [hd.green[0], hd.green[1], hd.green[2] + 5, hd.green[3] + 5], '#6cc24a'); ell(c, [hd.green[0], hd.green[1], hd.green[2] + 2, hd.green[3] + 2], '#7cd65a'); ell(c, hd.green, '#93e870');
  c.save(); c.beginPath(); c.ellipse(hd.green[0], hd.green[1], hd.green[2], hd.green[3], 0, 0, 7); c.clip(); c.fillStyle = 'rgba(255,255,255,.07)'; for (let x = hd.green[0] - hd.green[2]; x < hd.green[0] + hd.green[2]; x += 12) c.fillRect(x, hd.green[1] - hd.green[3], 6, hd.green[3] * 2); c.restore();
  // sand
