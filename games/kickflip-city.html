    const hanger = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.14, W * 0.9), metal); hanger.position.set(tx, -DECK_T / 2 - 0.2, 0); board.add(hanger);

    for (const z of [-1, 1]) { const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.2, 14), wheelM); wh.rotation.x = Math.PI / 2; wh.position.set(tx, -DECK_T / 2 - 0.24, z * W * 0.56); board.add(wh); const hb = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.21, 8), bear); hb.rotation.x = Math.PI / 2; hb.position.copy(wh.position); board.add(hb); }
  }
  board.position.y = DECK_Y; g.add(board); g.userData.board = board;
  return g;
}

// ---------- game state ----------
function start() {
  sk = { x: -FLAT + 2, y: 0, s: 0, vx: 0, vy: 0, air: false, vert: 0, dir: 1, face: 1, grind: null, trick: null, tricksAir: [], crash: 0, spin: 0, flip: 0, shove: 0, bodyFlip: 0, grabT: 0, landT: 0, pushT: 0, maxY: 0 };
  sk.y = surf(sk.x).h; sk.s = 14;
  timeLeft = SESSION; score = 0; combo = 0; comboPts = 0; comboList = []; groundT = 0; got = 0; sparks.forEach(s => scene.remove(s.m)); sparks = [];
  letters.forEach(l => { l.got = false; l.m.visible = true; });
  state = 'play'; say('DROP IN!', 1.2); hud();
}
function say(t, d) { msg = t; msgT = d || 1.1; }
function hud() { K.set('score', score); K.set('combo', combo > 0 ? comboPts + ' x' + combo : 'SKATE'.slice(0, got) + '·'.repeat(5 - got)); K.set('time', Math.max(0, Math.ceil(timeLeft)) + 's'); }
function bank() { if (combo > 0) { const pts = comboPts * combo; score += pts; if (combo > 1) say('COMBO ' + comboPts + ' x ' + combo + ' = ' + pts, 1.5); K.tune([660, 880], 0.06); } combo = 0; comboPts = 0; comboList = []; hud(); }
function addTrick(name, pts) { combo++; comboPts += pts; comboList.push(name); hud(); say(name, 0.9); K.beep(700 + combo * 40, 0.06, { type: 'triangle', vol: 0.04 }); }
function bail(why) { sk.crash = 1.5; sk.trick = null; sk.grind = null; combo = 0; comboPts = 0; comboList = []; say(why || 'BAIL!', 1.3); K.noise(0.5, 0.35); hud(); if (sk.air) { sk.vx *= 0.3; } else sk.s *= 0.2; }
function stickDir() { const u = K.down('up'), d = K.down('down'), l = K.down('left'), r = K.down('right'); return (u ? 'u' : d ? 'd' : '') + (l ? 'l' : r ? 'r' : '') || 'n'; }
// finishing a trick: count the completed turns and score it
function finishTrick(tr) {
  const T = TRICKS[tr.k];
  if (T.grab) { if (tr.t > 0.25) addTrick(T.name, 100 + Math.round(tr.t * 300)); return; }
  const n = Math.max(1, Math.round(tr.target / T.per));
  addTrick(T.names[Math.min(n, T.names.length) - 1], T.pts * n + (n > 1 ? n * 60 : 0));
}

function leaveGround(vx, vy) { sk.air = true; sk.vx = vx; sk.vy = vy; sk.grind = null; sk.tricksAir = 0; sk.launchY = sk.y; sk.spinBase = sk.spin; }
function land() {
  const sf = surf(sk.x);
  if (sk.trick && (sk.trick.held || sk.trick.t < sk.trick.target - 0.02)) { sk.y = sf.h; sk.air = false; sk.s = 0; return bail(sk.trick.held ? 'STILL TRICKING! BAIL!' : 'UNDER-ROTATED!'); }
  // land along the surface: keep the part of the velocity that runs along the slope
  const n = Math.hypot(1, sf.s), tx = 1 / n, ty = sf.s / n; sk.s = sk.vx * tx + sk.vy * ty; sk.air = false; sk.y = sf.h; sk.landT = 0.25; if (Math.round((sk.spin - (sk.spinBase || 0)) / Math.PI) % 2) sk.face = -sk.face; /* odd 180s land you switch */ sk.spin = sk.spinBase = 0; sk.flip = 0; sk.shove = Math.round(sk.shove / Math.PI) * Math.PI; sk.bodyFlip = 0;
  const air = sk.maxY - sk.launchY; if (air > 5) addTrick('BIG AIR ' + Math.round(air) + ' FT', Math.round(air * 25));
  K.noise(0.08, 0.15); sk.maxY = 0;
}
function update(dt) {
  if (!renderer) return;
  render(dt);
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  timeLeft -= dt; if (timeLeft <= 0) return end();
  if (Math.floor(timeLeft * 2) !== Math.floor((timeLeft + dt) * 2)) hud();
  for (const p of sparks) { p.l -= dt; p.v.y -= 30 * dt; p.m.position.addScaledVector(p.v, dt); p.m.material.opacity = Math.max(0, p.l * 3); } sparks = sparks.filter(p => { if (p.l <= 0) scene.remove(p.m); return p.l > 0; });
  if (sk.crash > 0) { sk.crash -= dt; if (sk.air) { sk.vy -= GRAV * dt; sk.x += sk.vx * dt; sk.y += sk.vy * dt; const sf = surf(sk.x); if (sk.y <= sf.h) { sk.y = sf.h; sk.air = false; sk.s = 0; } } else { sk.s *= Math.pow(0.1, dt); stepGround(dt); } if (sk.crash <= 0) { sk.spin = sk.dir > 0 ? 0 : Math.PI; sk.flip = sk.shove = sk.bodyFlip = 0; sk.face = 1; } return; }
  if (sk.grind) stepGrind(dt);
  else if (!sk.air) {
    const sf = surf(sk.x);
    // push in the direction you're rolling, or brake
    const want = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0), dirNow = Math.sign(sk.s) || sk.dir;
    if (want && Math.abs(sf.s) < 0.6) { if (want === dirNow || Math.abs(sk.s) < 1) { sk.s += want * 16 * dt; sk.pushT += dt; } else sk.s -= dirNow * 20 * dt; }
    else sk.pushT = 0;
    if (Math.abs(sk.s) > MAXV) sk.s = Math.sign(sk.s) * MAXV;
    stepGround(dt);
    if (K.hit('a') && !sk.air) { const n = Math.hypot(1, sf.s), tx = 1 / n, ty = sf.s / n; leaveGround(sk.s * tx - ty * 13, sk.s * ty + tx * 13); K.beep(500, 0.08, { to: 800, vol: 0.05 }); }
    groundT += dt; if (groundT > 0.6 && combo > 0) bank();
  } else {
    groundT = 0;
    sk.vy -= GRAV * dt; sk.x += sk.vx * dt; sk.y += sk.vy * dt; sk.maxY = Math.max(sk.maxY, sk.y);
    if (sk.x < -LIP + 0.15) { sk.x = -LIP + 0.15; sk.vx = 0; } if (sk.x > LIP - 0.15) { sk.x = LIP - 0.15; sk.vx = 0; }
    // tricks: hold TRICK; the direction you hold when you start picks the trick
    if (!sk.trick && K.hit('b')) { const k = stickDir(); sk.trick = { k, t: 0, held: true, target: 0 }; K.beep(800, 0.04, { type: 'triangle', vol: 0.04 }); }
    if (sk.trick) {
      const tr = sk.trick, T = TRICKS[tr.k];
      if (tr.held && !K.down('b')) { tr.held = false; tr.target = T.grab ? tr.t : Math.max(T.per, Math.ceil(tr.t / T.per - 0.15) * T.per); }
      const rate = tr.held || T.grab ? 1 : 2.4; const prev = tr.t; tr.t = tr.held ? tr.t + dt : Math.min(tr.target, tr.t + dt * rate);
      const dd = tr.t - prev;
      if (T.spin) sk.spin += T.spin * Math.PI / T.per * dd;
      if (T.flip) sk.flip += T.flip * Math.PI * 2 / T.per * dd;
      if (T.shove) sk.shove += T.shove * Math.PI / T.per * dd;
      if (T.body) sk.bodyFlip += Math.PI * 2 / T.per * dd;
      if (T.grab) sk.grabT = tr.held ? 1 : 0;
      if (tr.held && !T.grab && Math.floor(tr.t / T.per) !== Math.floor(prev / T.per)) K.beep(500 + Math.floor(tr.t / T.per) * 120, 0.05, { vol: 0.04 });
      if (!tr.held && tr.t >= tr.target - 1e-4) { finishTrick(tr); sk.trick = null; sk.grabT = 0; }
    }
    // ollie onto a handrail to grind it
    for (const r of RAILS) if (!sk.trick && sk.vy < 0 && sk.x > r.x0 && sk.x < r.x1) { const ry = railY(r, sk.x); if (sk.y <= ry + 0.4 && sk.y - sk.vy * dt >= ry - 0.2) { sk.grind = { r, t: 0 }; sk.y = ry; const sl = 0.4 * (r.x0 < 0 ? 1 : -1), n = Math.hypot(1, sl); sk.s = (sk.vx + sk.vy * sl) / n; sk.air = false; K.beep(1200, 0.05, { vol: 0.04 }); say('BOARDSLIDE', 0.8); break; } }
    if (sk.air && sk.vy < 0 && sk.y <= surf(sk.x).h) land();
  }
  // vert: reaching a lip launches you straight up; coming down you drop back in
  for (const L of letters) if (!L.got && Math.abs(L.x - sk.x) < 2.2 && Math.abs(L.y - (sk.y + 2.5)) < 2.6) { L.got = true; L.m.visible = false; got++; score += got === 5 ? 1500 : 150; say(got === 5 ? 'S-K-A-T-E! +1500' : 'LETTER ' + L.ch, 1.1); K.tune([784, 988, 1175], 0.06); hud(); }
}
function stepGround(dt) {
  let sf = surf(sk.x); const n = Math.hypot(1, sf.s);
  sk.s -= GRAV * (sf.s / n) * dt; sk.s *= Math.pow(0.93, dt);
  const nx = sk.x + sk.s / n * dt;
  // past the lip of a half-pipe: go vert into the air
  // near the top of the wall the ramp is almost vertical: launch straight up out of the half-pipe (vert air)
  const steepUp = Math.abs(sf.s) > 3.5 && Math.sign(sk.s) === Math.sign(sf.s) && Math.sign(sf.s) === Math.sign(sk.x);
  if (nx <= -LIP + 0.3 || nx >= LIP - 0.3 || steepUp) { sk.x = nx < 0 ? -LIP + 0.35 : LIP - 0.35; leaveGround(0, Math.abs(sk.s) * 1.35 + 3 + (K.down('a') ? 5 : 0)); sk.y = R - 0.2; sk.dir = nx < 0 ? 1 : -1; return; }
  sk.x = nx; sf = surf(sk.x); sk.y = sf.h; if (Math.abs(sk.s) > 0.5) sk.dir = Math.sign(sk.s);
}
function stepGrind(dt) {
  const g = sk.grind, r = g.r, sl = 0.4 * (r.x0 < 0 ? 1 : -1), n = Math.hypot(1, sl);
  g.t += dt; sk.s -= GRAV * (sl / n) * dt * 0.8; sk.x += sk.s / n * dt; sk.y = railY(r, sk.x);
  if (Math.random() < 0.8) spark(sk.x, sk.y, r.z);
  if (Math.floor(g.t * 4) !== Math.floor((g.t - dt) * 4)) { comboPts += 40; hud(); K.beep(1500, 0.02, { vol: 0.02 }); }
  const off = sk.x <= r.x0 || sk.x >= r.x1, pop = K.hit('a');
  if (off || pop || Math.abs(sk.s) < 1) { addTrick('BOARDSLIDE', 100 + Math.round(g.t * 200)); sk.grind = null; leaveGround(sk.s / n, sk.s * sl / n + (pop ? 11 : 1)); }
}
function spark(x, y, z) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), new THREE.MeshBasicMaterial({ color: Math.random() < 0.5 ? 0xffd23f : 0xffffff, transparent: true })); m.position.set(x, y + 0.2, z); scene.add(m); sparks.push({ m, l: 0.35, v: new THREE.Vector3(K.rnd(-6, 6) - sk.s * 0.3, K.rnd(2, 7), K.rnd(-3, 3)) }); }
function end() { bank(); state = 'over'; best = K.saveBest('kickflip3d', score); K.tune([523, 659, 784, 1047], 0.1); K.card({ title: 'SESSION OVER', text: 'You scored ' + score + ' points' + (got === 5 ? ' and spelled SKATE!' : ' and found ' + got + ' of 5 letters.'), best: 'BEST ' + best, button: 'Skate again', onStart: start }); }

// ---------- drawing ----------
function render(dt) {
  const t = performance.now();
  if (sk) {
    const sf = surf(sk.x), body = skM.userData.body, crash = sk.crash > 0;
    const laneZ = sk.grind ? sk.grind.r.z : 0; skM.position.set(sk.x, sk.y, (skM.position.z || 0) + (laneZ - (skM.position.z || 0)) * Math.min(1, dt * 10));
    // stand on the slope while rolling; ease upright in the air
    const tilt = sk.air ? (skM.rotation.z * Math.pow(0.02, dt)) : sk.grind ? Math.atan(0.4 * (sk.grind.r.x0 < 0 ? 1 : -1)) : Math.atan(sf.s);
    skM.rotation.set(0, 0, crash ? 0 : tilt);
    // which way you face: rolling direction, flipped when riding switch, plus spins (the camera never spins)
    // the skater stands sideways on the board facing the camera (riding switch faces away); spins turn the body and board together
    const spinD = sk.air ? sk.spin - (sk.spinBase || 0) : 0, boardYaw = (sk.dir > 0 ? 0 : Math.PI) + spinD;
    body.rotation.set(0, -Math.PI / 2 + (sk.face < 0 ? Math.PI : 0) + spinD, crash ? Math.PI / 2 * Math.min(1, (1.5 - sk.crash) * 4) : -sk.bodyFlip);
    body.position.y = crash ? 0.6 : 0;
    board.rotation.set(sk.flip, boardYaw + sk.shove, 0); board.position.y = crash ? 0.3 : DECK_Y + (sk.air ? 0.15 : 0);
    if (crash) { board.position.x = 2.5; board.rotation.set(0, 0, 0.3); } else board.position.x = 0;
    // crouch for landings, grabs and pushes
    const crouch = sk.grabT ? 0.9 : sk.landT > 0 ? sk.landT * 2.4 : sk.air ? 0.35 : sk.grind ? 0.45 : 0.15;
    if (sk.landT > 0) sk.landT -= dt;
    const legs = body.userData.legs, arms = body.userData.arms, push = sk.pushT > 0 && !sk.air ? Math.sin(t / 120) : 0;
    // skate stance: feet planted over the trucks, knees bent forward, hips sunk, arms out along the board for balance
    const bend = 0.45 + crouch, spread = 0.6, kin = 0.5, bob = (!sk.air && !crash) ? Math.sin(t / 260) * 0.04 : 0;
    legs.forEach((l, i) => {
      const sgn = i ? 1 : -1, a = bend * 0.75 + bob + (i ? push * 0.5 : 0), b = -bend * 1.45 - bob * 2;
      // knees bow out (A-frame stance) then the shins come back in to the trucks
      l.hip.rotation.set(sgn * -spread, 0, a); l.knee.rotation.set(sgn * kin, 0, b);
      l.ankle.rotation.set(sgn * (spread - kin), 0, -(a + b)); // shoes stay flat on the grip tape
    });
    // put the soles on the deck
    if (!crash) { body.position.y = 0; body.updateMatrixWorld(true); let low = 1e9; const v = new THREE.Vector3(); legs.forEach(l => { l.ankle.getWorldPosition(v); body.worldToLocal(v); low = Math.min(low, v.y); }); body.position.y = board.position.y + DECK_T / 2 + 0.35 - low; }
    const up = body.userData.upper; up.rotation.z = -(0.18 + crouch * 0.35);
    arms.forEach((a, i) => { const sgn = i ? -1 : 1; a.rotation.x = sgn * (sk.air ? 1.35 : 1.05 + Math.sin(t / 400 + i) * 0.08); a.rotation.z = sk.grabT && i ? 1.6 : 0.25; a.userData.el.rotation.z = sk.grabT && i ? 0.2 : -0.45; a.userData.el.rotation.x = sgn * -0.25; });
    letters.forEach((L, i) => { L.m.position.y = L.y + Math.sin(t / 300 + i) * 0.3; L.m.lookAt(camera.position); });
    // camera: beside you, about 10 ft up, looking down ~45 degrees, always from the same side; it rises a bit on big air
    const lift = Math.max(0, sk.y - 4) * 0.85, want = new THREE.Vector3(K.clamp(sk.x, -52, 52) + sk.vx * 0.05, 8.5 + lift, 11.5), look = new THREE.Vector3(sk.x + (sk.air ? 0 : (Math.sign(sk.s) * Math.min(3, Math.abs(sk.s) * 0.12))), sk.y + 1.2, 0);
    camPos.lerp(want, 1 - Math.pow(0.004, dt)); camLook.lerp(look, 1 - Math.pow(0.002, dt));
    camera.position.copy(camPos); camera.lookAt(camLook);
  }
  renderer.render(scene, camera);
  drawHud(t);
}
function txt(s, x, y, size, col, align) { hx.font = size + 'px Bungee, Impact, sans-serif'; hx.textAlign = align || 'center'; hx.textBaseline = 'middle'; hx.fillStyle = 'rgba(0,0,0,.6)'; hx.fillText(s, x + 1.5, y + 1.5); hx.fillStyle = col || '#fff'; hx.fillText(s, x, y); }
function drawHud(t) {
  const w = hudC._w, h = hudC._h; hx.clearRect(0, 0, w, h); if (state !== 'play') return;
  if (combo > 0) { txt(comboList.slice(-3).join(' + '), w / 2, 26, 12, '#fff'); txt(comboPts + ' x ' + combo, w / 2, 48, 18, '#ffd23f'); }
  if (sk.trick && sk.trick.held) { const T = TRICKS[sk.trick.k], n = T.grab ? 0 : Math.floor(sk.trick.t / T.per); txt(T.grab ? T.name : T.names[Math.min(Math.max(1, n), T.names.length) - 1] + (n < 1 ? '…' : ''), w / 2, h * 0.28, 22, '#ff4fa3'); txt('LET GO BEFORE YOU LAND!', w / 2, h * 0.28 + 24, 10, '#fff'); }
  if (msgT > 0) txt(msg, w / 2, h * 0.2, 20, '#ffd23f');
  txt('SKATE'.split('').map((ch, i) => i < got ? ch : '_').join(' '), w - 16, 20, 13, '#ffd23f', 'right');
  if (timeLeft < 10) txt(Math.ceil(timeLeft), w / 2, h * 0.12, 30, '#ff6a4a');
}
function draw() {}
title();
K.run(update, draw);
</script>
