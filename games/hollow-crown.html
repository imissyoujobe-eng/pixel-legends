  if (crown) { hx.fillStyle = '#ffd23f'; hx.fillRect(mx + (crown.x - p.x + MW / 2) * S - 3, my + (crown.y - p.y + MH / 2) * S - 3, 6, 6); }
  hx.translate(mx + mw / 2, my + mh / 2); hx.rotate(-p.yaw); hx.fillStyle = '#ffe94a'; hx.strokeStyle = '#000'; hx.lineWidth = 1.5; hx.beginPath(); hx.moveTo(0, -7); hx.lineTo(5, 5); hx.lineTo(0, 2); hx.lineTo(-5, 5); hx.closePath(); hx.stroke(); hx.fill();
  hx.restore(); txt(wn === 'dung' ? 'DUNGEON' : 'WILDS', mx + mw / 2, my + mh + 12, 9, '#cfe8c8');
  // crosshair
  hx.fillStyle = 'rgba(255,255,255,.7)'; hx.fillRect(W / 2 - 1, H / 2 - 6, 2, 4); hx.fillRect(W / 2 - 1, H / 2 + 2, 2, 4); hx.fillRect(W / 2 - 6, H / 2 - 1, 4, 2); hx.fillRect(W / 2 + 2, H / 2 - 1, 4, 2);
  // boss health
  const boss = ents.find(e => e.kind === 'wyrm' && e.alive && e.room === roomKey(p.x, p.y));
  if (boss) { const bw = W * 0.7, bx = (W - bw) / 2, by = my + mh + 30; txt('CINDER WYRM', W / 2, by - 8, 11, '#ffb070'); rr(bx, by, bw, 10, 5); hx.fillStyle = 'rgba(0,0,0,.6)'; hx.fill(); rr(bx + 2, by + 2, (bw - 4) * Math.max(0, boss.hp) / 14, 6, 3); hx.fillStyle = '#ff5a36'; hx.fill(); }
  if (msgT > 0 && !talk) { hx.globalAlpha = Math.min(1, msgT * 2); txt(msg, W / 2, H * 0.3, Math.min(15, W / 26), '#fff'); hx.globalAlpha = 1; }
  if (!hasSword && !talk && time < 40) txt('Find the cave to the north', W / 2, H - 24, 11, 'rgba(255,255,255,.8)');

}
function dialog(text, who) {
  const W = fitW, H = fitH, fs = Math.max(14, Math.min(17, W / 24)), pad = 14, bw = W - 20; hx.font = fs + 'px Rubik, system-ui, sans-serif';
  const lines = [], words = text.split(' '); let line = ''; for (const w of words) { const tt = line ? line + ' ' + w : w; if (hx.measureText(tt).width > bw - pad * 2) { lines.push(line); line = w; } else line = tt; } lines.push(line);
  const bh = lines.length * (fs + 6) + pad * 2 + (who ? fs + 4 : 0), by = H - bh - 14;
  rr(10, by, bw, bh, 12); hx.fillStyle = 'rgba(10,8,20,.9)'; hx.fill(); hx.strokeStyle = 'rgba(255,255,255,.8)'; hx.lineWidth = 2; hx.stroke();
  let y = by + pad + fs * 0.5; hx.textAlign = 'left'; hx.textBaseline = 'middle';
  if (who) { hx.font = (fs - 2) + 'px Bungee, Impact, sans-serif'; hx.fillStyle = '#ffd23f'; hx.fillText(who, 10 + pad, y); y += fs + 4; }
  hx.font = fs + 'px Rubik, system-ui, sans-serif'; hx.fillStyle = '#fff'; for (const l of lines) { hx.fillText(l, 10 + pad, y); y += fs + 6; }
  if (Math.floor(performance.now() / 400) % 2) { hx.fillStyle = '#ffd23f'; hx.font = '12px Rubik, sans-serif'; hx.textAlign = 'right'; hx.fillText('TAP ▼', 10 + bw - 12, by + bh - 12); }
}
title();
K.run(update, draw);
