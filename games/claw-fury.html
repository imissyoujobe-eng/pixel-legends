<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claw Fury</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Claw Fury: a side-scrolling claw brawler. Rook, an ex-ranger in a green field jacket and red bandana, carves through
// three robot armies with the steel claws in her bracers. Combos, uppercuts, lunges, RAGE mode and three big bosses.
K.theme({ bg: '#0c0e14', ink: '#f3f1ea', accent: '#e8452c', accentInk: '#fff' });
let VW = 170; const VH = 232, GY = 200, FLOOR = 188, GRAV = 900;
K.screen(VW, VH, { smooth: true });
K.flex(170, VH, w => { VW = w; }, { smooth: true }); // phone on its side: wider view that fills the screen
K.hud(['score', 'stage', 'lives']);
K.pad({ dpad: '4', buttons: [{ id: 'y', label: 'RAGE' }, { id: 'x', label: 'LUNGE' }, { id: 'b', label: 'JUMP' }, { id: 'a', label: 'ATTACK' }] });
(function () {
  const s = document.createElement('style');
  s.textContent = '#kp .kb{display:grid;grid-template-columns:repeat(2,64px);gap:8px 10px}#kp .big{width:64px;height:64px;font-size:11px}' +
    '#kp button[aria-label=y]{background:rgba(232,69,44,.22)}#kp button[aria-label=y].ready{background:#e8452c;color:#fff;animation:rg .45s infinite alternate}' +
    '@keyframes rg{to{box-shadow:0 0 18px 5px #ff8a2a,0 4px 0 rgba(0,0,0,.35)}}';
  document.head.appendChild(s);
})();
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === 'c' || k === 'l') K.press('x'); if (k === 'v' || k === 'u') K.press('y'); });
addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k === 'c' || k === 'l') K.release('x'); if (k === 'v' || k === 'u') K.release('y'); });

const INK = '#140c08', rnd = K.rnd, clamp = K.clamp, PI = Math.PI;
const lerp = (a, b, k) => a + (b - a) * k, sgn = v => v < 0 ? -1 : 1;
let OVR = null; const C = h => OVR || h;
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
function ln(c, pts, w, col, iw) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); if (iw !== 0) { c.strokeStyle = INK; c.lineWidth = w + (iw || 1.5); c.stroke(); } c.strokeStyle = col; c.lineWidth = w; c.stroke(); }
function ik(A, B, l1, l2, s) { const dx = B[0] - A[0], dy = B[1] - A[1]; let d = Math.hypot(dx, dy); d = clamp(d, 0.01, l1 + l2 - 0.01); const th = Math.atan2(dy, dx), off = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1)); return [A[0] + Math.cos(th - s * off) * l1, A[1] + Math.sin(th - s * off) * l1]; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function fillInk(c, col, lw) { c.fillStyle = col; c.fill(); c.strokeStyle = INK; c.lineWidth = lw || 0.9; c.stroke(); }
function circ(c, x, y, r, col, lw) { c.beginPath(); c.arc(x, y, r, 0, 7); fillInk(c, col, lw); }
function grad(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), C(s))); return g; }
const ov = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];

// ---------------- stages ----------------
const STAGES = [
  { name: 'FROSTLINE LAB', theme: 'snow', len: 2050, dm: 1, boss: 'tank', crates: [170, 520, 880, 1240, 1600, 1790],
    waves: [{ x: 250, l: ['sol', 'sol'] }, { x: 620, l: ['sol', 'rif', 'sol'] }, { x: 1000, l: ['shd', 'sol', 'sol', 'rif'] }, { x: 1400, l: ['rif', 'shd', 'sol', 'sol', 'rif'] }] },
  { name: 'IRON BASE', theme: 'base', len: 2250, dm: 1.2, boss: 'jet', crates: [180, 560, 940, 1330, 1700, 1960],
    waves: [{ x: 250, l: ['sol', 'nin', 'sol'] }, { x: 650, l: ['rif', 'dro', 'shd', 'sol'] }, { x: 1060, l: ['nin', 'nin', 'rif', 'dro', 'sol'] }, { x: 1480, l: ['shd', 'shd', 'rif', 'nin', 'dro', 'sol'] }] },
  { name: 'SKYLINE', theme: 'roof', len: 2400, dm: 1.4, boss: 'titan', crates: [190, 600, 1000, 1400, 1800, 2100],
    waves: [{ x: 250, l: ['nin', 'sol', 'dro', 'sol'] }, { x: 660, l: ['shd', 'rif', 'nin', 'dro', 'sol'] }, { x: 1080, l: ['nin', 'nin', 'shd', 'rif', 'dro', 'dro'] }, { x: 1500, l: ['shd', 'rif', 'rif', 'nin', 'sol', 'dro', 'nin'] }, { x: 1900, l: ['shd', 'shd', 'nin', 'nin', 'dro', 'rif'] }] },
];
const FT = { sol: { hp: 30, spd: 40, w: 14, h: 42 }, shd: { hp: 44, spd: 27, w: 16, h: 44 }, rif: { hp: 24, spd: 36, w: 14, h: 42 }, nin: { hp: 26, spd: 64, w: 12, h: 40 }, dro: { hp: 14, spd: 55, w: 16, h: 14, fly: true } };
const KILLPTS = { sol: 100, shd: 200, rif: 150, nin: 200, dro: 120 };
// attack boxes are [x0,y0,x1,y1] for a hero facing right, relative to the feet
const ATK = {
  c1: { dur: 0.25, a0: 0.05, a1: 0.14, box: [0, -42, 32, -8], dmg: 10, kb: 55, lift: 0, stun: 0.45, step: 45, arc: [-1.5, 0.9], r: 15 },
  c2: { dur: 0.25, a0: 0.05, a1: 0.14, box: [0, -44, 32, -6], dmg: 10, kb: 65, lift: 0, stun: 0.45, step: 45, arc: [1.1, -1.2], r: 15 },
  c3: { dur: 0.42, a0: 0.1, a1: 0.22, box: [-2, -48, 38, -2], dmg: 20, kb: 220, lift: 150, stun: 0.9, step: 110, heavy: 1, arc: [-2.2, 1.3], r: 20 },
  up: { dur: 0.44, a0: 0.08, a1: 0.22, box: [-2, -66, 28, 0], dmg: 14, kb: 30, lift: 340, stun: 1.15, heavy: 1, arc: [1.6, -1.9], r: 18 },
  air: { dur: 0.6, a0: 0.02, a1: 0.6, box: [-8, -44, 28, 14], dmg: 13, kb: 70, lift: -1, stun: 0.55, arc: [-1.0, 2.0], r: 17 },
  lunge: { dur: 0.25, a0: 0, a1: 0.25, box: [-16, -42, 24, -2], dmg: 16, kb: 150, lift: 110, stun: 0.75 },
};
const RAGE_T = 6;

let state = 'title', si = 0, st, hero, foes = [], shots = [], debris = [], fx = [], crates = [], pickups = [], cam = { x: 0 }, lock = null, wi = 0, pending = [], spawnT = 0, goT = 0,
  boss = null, bossStarted = false, introT = 0, score = 0, lives = 3, shake = 0, hitstop = 0, msg = '', msg2 = '', msgT = 0, clearT = 0, uid = 0, T = 0, hitsN = 0, hitsT = 0,
  best = K.best('clawfury');
const rageBtn = document.querySelector('#kp button[aria-label=y]');

// ---------------- particles ----------------
function spark(x, y, n, col, spd) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = (spd || 130) * (0.35 + Math.random()); fx.push({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, t: 0, life: 0.2 + Math.random() * 0.3, c: col || '255,214,110' }); } }
function smoke(x, y, n, col) { for (let i = 0; i < n; i++) fx.push({ k: 'smoke', x: x + rnd(-4, 4), y: y + rnd(-3, 3), vx: rnd(-12, 12), vy: rnd(-28, -8), t: 0, life: 0.6 + Math.random() * 0.6, r: 2 + Math.random() * 3, c: col || '70,70,80' }); }
function ring(x, y, r, col) { fx.push({ k: 'ring', x, y, r, t: 0, life: 0.28, c: col || '255,255,255' }); }
function flash(x, y, r) { fx.push({ k: 'flash', x, y, r, t: 0, life: 0.12 }); }
function ftext(x, y, s, col, size) { fx.push({ k: 'text', x, y, s, vy: -28, t: 0, life: 0.9, c: col || '#fff', size: size || 8 }); }
function boom(x, y, s) { flash(x, y, 18 * s); ring(x, y, 14 * s, '255,190,90'); spark(x, y, 10 * s | 0, '255,190,80', 160 * s); smoke(x, y, 5 * s | 0, '60,56,60'); fx.push({ k: 'fire', x, y, r: 9 * s, t: 0, life: 0.35 }); }
function stepFx(dt) {
  for (const p of fx) {
    p.t += dt;
    if (p.k === 'spark') { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt; if (p.y > GY + 2) { p.y = GY + 2; p.vy *= -0.4; p.vx *= 0.6; } }
    else if (p.k === 'smoke') { p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 6; }
    else if (p.k === 'text') p.y += p.vy * dt;
  }
  fx = fx.filter(p => p.t < p.life);
}
function drawFx(c) {
  for (const p of fx) {
    const k = p.t / p.life;
    if (p.k === 'spark') { c.strokeStyle = 'rgba(' + p.c + ',' + (1 - k) + ')'; c.lineWidth = 1.1; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.025, p.y - p.vy * 0.025); c.stroke(); }
    else if (p.k === 'smoke') { c.fillStyle = 'rgba(' + p.c + ',' + 0.45 * (1 - k) + ')'; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
    else if (p.k === 'ring') { c.strokeStyle = 'rgba(' + p.c + ',' + (1 - k) + ')'; c.lineWidth = 2 * (1 - k) + 0.4; c.beginPath(); c.arc(p.x, p.y, p.r * (0.3 + k), 0, 7); c.stroke(); }
    else if (p.k === 'flash') { A.glow(c, p.x, p.y, p.r * (1 + k), '255,250,220', 0.9 * (1 - k)); c.fillStyle = 'rgba(255,255,255,' + (1 - k) + ')'; c.save(); c.translate(p.x, p.y); c.rotate(p.x); for (let i = 0; i < 4; i++) { c.rotate(PI / 2); c.beginPath(); c.moveTo(0, -1.2); c.lineTo(p.r * 0.7 * (1 - k * 0.5), 0); c.lineTo(0, 1.2); c.fill(); } c.restore(); }
    else if (p.k === 'fire') { A.glow(c, p.x, p.y, p.r * 2.2, '255,140,40', 0.7 * (1 - k)); c.fillStyle = 'rgba(255,220,120,' + (1 - k) + ')'; c.beginPath(); c.arc(p.x, p.y, p.r * (0.6 + k * 0.6), 0, 7); c.fill(); }
    else if (p.k === 'text') { c.globalAlpha = Math.min(1, (1 - k) * 2); K.text(c, p.s, p.x, p.y, p.size, p.c); c.globalAlpha = 1; }
  }
}

// ---------------- debris: robots fall apart ----------------
function breakApart(f) {
  const pal = RP[f.t] || RP.sol, s = f.sc || 1, n = f.t === 'dro' ? 4 : 7;
  for (let i = 0; i < n; i++) {
    const kind = i === 0 ? 'head' : i < 3 ? 'plate' : 'rod';
    debris.push({ x: f.x + rnd(-5, 5), y: f.y - (f.t === 'dro' ? 0 : rnd(8, 38) * s), vx: rnd(-90, 90) + (f.vx || 0) * 0.4, vy: rnd(-220, -60), rot: rnd(0, 6), vr: rnd(-14, 14), kind, w: kind === 'rod' ? 9 : 6, col: i % 2 ? pal.d : pal.b, v: pal.v, t: 0 });
  }
  spark(f.x, f.y - 20 * s, 14, '255,220,120', 170); smoke(f.x, f.y - 18 * s, 5); flash(f.x, f.y - 22 * s, 14);
}
function stepDebris(dt) {
  for (const d of debris) {
    d.t += dt; d.vy += GRAV * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
    if (d.y > GY + 1) { d.y = GY + 1; d.vy *= -0.35; d.vx *= 0.6; d.vr *= 0.6; if (Math.abs(d.vy) < 20) d.vy = 0; }
    if (d.t < 0.7 && Math.random() < 0.15) spark(d.x, d.y, 1, '255,200,90', 50);
  }
  debris = debris.filter(d => d.t < 2.2);
}
function drawDebris(c) {
  for (const d of debris) {
    c.save(); c.globalAlpha = d.t > 1.7 ? (2.2 - d.t) / 0.5 : 1; c.translate(d.x, d.y - 2); c.rotate(d.rot);
    if (d.kind === 'head') { rr(c, -4, -4, 8, 7, 2); fillInk(c, d.col); c.fillStyle = d.t < 0.8 ? d.v : '#333'; c.fillRect(0.5, -2, 3, 2); }
    else if (d.kind === 'plate') { c.beginPath(); c.moveTo(-4, -3); c.lineTo(4, -2); c.lineTo(3, 3); c.lineTo(-3, 2.5); c.closePath(); fillInk(c, d.col); c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(-3, -2.4, 5, 1); }
    else { ln(c, [[-d.w / 2, 0], [d.w / 2, 0]], 2.6, d.col); circ(c, d.w / 2, 0, 1.6, '#2a2e36', 0.6); }
    c.restore();
  }
}

// ---------------- the hero: Rook ----------------
const HP = { jacket: '#41603a', jd: '#2c4427', jl: '#6b8f58', pants: '#3a3c46', pd: '#26272e', boot: '#53331f', skin: '#d9a37c', skd: '#a9765a', hair: '#2e211a', band: '#cf2c27', bandd: '#8c1a17', steel: '#8f9aaa', stl: '#e0e8f2', claw: '#eef3fa' };
function newHero(x) { return { x, y: GY, vx: 0, vy: 0, face: 1, ground: true, hp: 100, rage: 0, rageT: 0, lungeCD: 0, atk: null, combo: 0, comboT: 0, inv: 0, hurtT: 0, noHit: 10, dead: 0, run: 0, trail: [], trailT: 0, jumpHeld: false, blink: 2 }; }
function heroPose(h) {
  const P = { rot: 0, lean: 0.08, htilt: 0 }; let hipY = -18, fF = [6, 0], fB = [-5, 0], hF, hB, cF = null, cB = null;
  const a = h.atk, br = Math.sin(T * 3.2);
  if (h.dead > 0) {
    const k = clamp((2 - h.dead) * 3, 0, 1); P.rot = -k * 1.45; P.lean = -0.2; hF = [-6, 4]; hB = [-8, 6]; fF = [5, -2 * k]; fB = [-3, 0];
  } else if (h.hurtT > 0) { P.lean = -0.32; P.htilt = -0.25; hF = [-3, -5]; hB = [-8, 2]; fF = [4, h.ground ? 0 : -4]; fB = [-7, h.ground ? 0 : -2]; }
  else if (a) {
    const d = ATK[a.k], k = clamp((a.t - d.a0) / (d.a1 - d.a0), 0, 1), w = a.t < d.a0;
    if (a.k === 'c1') { P.lean = 0.25; fF = [9, 0]; fB = [-6, 0]; hF = w ? [-2, -8] : [lerp(2, 14, k), lerp(-10, 5, k)]; hB = [3, 8]; }
    else if (a.k === 'c2') { P.lean = 0.22; fF = [8, 0]; fB = [-7, 0]; hB = w ? [-2, 10] : [lerp(0, 15, k), lerp(10, -8, k)]; hF = [3, 8]; }
    else if (a.k === 'c3') { P.lean = 0.38; hipY = -15.5; fF = [11, 0]; fB = [-9, 0]; hF = w ? [-7, -2] : [lerp(-6, 17, k), lerp(-2, 1, k)]; hB = w ? [-9, 3] : [lerp(-8, 15, k), 5]; }
    else if (a.k === 'up') { hipY = w ? -13.5 : -19; P.lean = w ? 0.3 : -0.08; fF = [7, 0]; fB = [-6, 0]; hF = w ? [7, 12] : [lerp(9, 5, k), lerp(10, -15, k)]; hB = [-3, 7]; if (!h.ground) { fF = [5, -5]; fB = [-4, -2]; } }
    else if (a.k === 'air') { P.lean = 0.32; fF = [6, -8]; fB = [-3, -4]; hF = [11, 12]; hB = [7, 13]; cF = 1.25; cB = 1.35; }
    else if (a.k === 'lunge') { P.lean = 0.6; hipY = -15; fF = [9, -2]; fB = [-12, -1]; hF = [17, 1]; hB = [-10, 5]; cF = 0.05; }
  } else if (!h.ground) {
    if (h.vy < 0) { fF = [6, -6]; fB = [-2, -3]; hF = [8, -3]; hB = [-5, 2]; } else { fF = [5, -2]; fB = [-4, 0]; hF = [9, 1]; hB = [-6, 4]; }
    P.lean = 0.05;
  } else if (Math.abs(h.vx) > 12) {
    const p = h.run; P.lean = 0.24; hipY = -17.3 - Math.abs(Math.cos(p)) * 1.4;
    fF = [Math.sin(p) * 8, -Math.max(0, -Math.cos(p)) * 5]; fB = [Math.sin(p + PI) * 8, -Math.max(0, -Math.cos(p + PI)) * 5];
    hF = [4 + Math.sin(p + PI) * 6, 9]; hB = [2 + Math.sin(p) * 6, 9];
  } else { hipY = -17.6 + br * 0.3; hF = [9, 6 + br * 0.3]; hB = [4, 8 + br * 0.3]; cF = -0.35; cB = -0.25; }
  const hip = [0, hipY], sh = [P.lean * 15, hipY - 15 + (h.dead > 0 ? 0 : 0)];
  P.hip = hip; P.sh = sh; P.hipF = [1, hipY]; P.hipB = [-1, hipY];
  P.sF = add(sh, [1.6, 0]); P.sB = add(sh, [-2.2, 0.6]);
  P.hF = add(sh, hF); P.hB = add(sh, hB); P.fF = fF; P.fB = fB;
  P.kF = ik(P.hipF, fF, 9.6, 9.6, 1); P.kB = ik(P.hipB, fB, 9.6, 9.6, 1);
  P.eF = ik(P.sF, P.hF, 7.6, 7.6, -1); P.eB = ik(P.sB, P.hB, 7.6, 7.6, -1);
  P.cF = cF; P.cB = cB; P.head = add(sh, [1.6 + P.lean * 2, -7]);
  P.wind = clamp(-Math.abs(h.vx) * 0.04, -4, 0) + (h.ground ? 0 : -1); P.flap = Math.sin(T * 9) * 0.6 - Math.abs(h.vx) * 0.02;
  P.blink = h.blink < 0.12; P.rage = h.rageT > 0;
  return P;
}
function heroLeg(c, H, Kn, F, back) {
  ln(c, [H, Kn, F], 5, C(back ? HP.pd : HP.pants));
  if (!OVR) { c.strokeStyle = 'rgba(255,255,255,.1)'; c.lineWidth = 1.3; c.beginPath(); c.moveTo(H[0] - 1, H[1]); c.lineTo(Kn[0] - 1, Kn[1]); c.stroke(); }
  c.save(); c.translate(F[0], F[1]);
  c.beginPath(); c.moveTo(-2.8, -4.2); c.lineTo(2, -4.2); c.quadraticCurveTo(5.8, -3.2, 5.9, -0.6); c.lineTo(5.9, 0.5); c.lineTo(-3.2, 0.5); c.closePath();
  fillInk(c, C(back ? '#3d2516' : HP.boot)); c.fillStyle = C('#1d1410'); c.fillRect(-3.2, -0.6, 9.1, 1.1);
  if (!OVR) { c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(-1.6, -3.6, 3.4, 0.8); }
  c.restore();
}
function heroArm(c, S, E, Hd, back, cang, rage) {
  const jc = C(back ? HP.jd : HP.jacket);
  ln(c, [S, E], 4.5, jc);
  const m = [lerp(E[0], Hd[0], 0.3), lerp(E[1], Hd[1], 0.3)];
  ln(c, [E, m], 4.1, jc);
  ln(c, [m, Hd], 4.6, C(back ? '#687282' : HP.steel));
  if (!OVR) { c.strokeStyle = HP.stl; c.lineWidth = 0.7; c.beginPath(); c.moveTo(m[0], m[1] - 1.1); c.lineTo(Hd[0], Hd[1] - 1.1); c.stroke(); }
  const a = cang != null ? cang : Math.atan2(Hd[1] - E[1], Hd[0] - E[0]);
  if (rage && !OVR) A.glow(c, Hd[0] + Math.cos(a) * 7, Hd[1] + Math.sin(a) * 7, 12, '255,110,40', 0.5);
  for (let k = -1; k <= 1; k++) {
    c.save(); c.translate(Hd[0], Hd[1]); c.rotate(a + k * 0.15); c.translate(1.4, k * 0.9);
    c.beginPath(); c.moveTo(0, -0.75); c.quadraticCurveTo(8, -1.3, 12.2, 0.3); c.lineTo(0, 0.75); c.closePath();
    fillInk(c, C(rage ? '#ffd2b0' : back ? '#b8c2ce' : HP.claw), 0.5);
    if (!OVR) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 0.35; c.beginPath(); c.moveTo(1, -0.5); c.quadraticCurveTo(7, -0.9, 11, 0.1); c.stroke(); }
    c.restore();
  }
  circ(c, Hd[0], Hd[1], 2.3, C(back ? HP.skd : HP.skin), 0.8);
}
function heroTorso(c, P) {
  const h = P.hip, s = P.sh;
  c.beginPath(); c.moveTo(h[0] - 5.5, h[1] + 3); c.lineTo(s[0] - 5, s[1] + 1); c.quadraticCurveTo(s[0], s[1] - 2.4, s[0] + 5.6, s[1] + 0.6);

  if (!blink) drawHero(c, h.x, h.y, h.face, heroPose(h));
  drawSwipe(c, h);
  if (h.atk && h.atk.k === 'lunge') { c.strokeStyle = 'rgba(200,240,255,.7)'; c.lineWidth = 0.8; for (let i = 0; i < 5; i++) { const yy = h.y - 8 - i * 7; c.beginPath(); c.moveTo(h.x - h.face * (8 + i * 3), yy); c.lineTo(h.x - h.face * (30 + i * 5), yy); c.stroke(); } }
  drawShots(c); drawFx(c);
  c.restore();
  drawFG(c, cam.x);
  A.vignette(c, VW, VH, st.theme === 'base' ? 0.55 : 0.35);
  if (h.rageT > 0) { c.fillStyle = 'rgba(255,60,20,' + (0.08 + Math.sin(T * 10) * 0.03) + ')'; c.fillRect(0, 0, VW, VH); }
  if (h.dead > 0 && h.dead < 1.6) { c.fillStyle = 'rgba(120,0,0,.25)'; c.fillRect(0, 0, VW, VH); }
  c.restore();
  if (state === 'play') drawUI(c);
}
loadStage(); state = 'title'; title();
K.run(update, draw);
</script>
