<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Three Day Tide</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/td.js"></script>
<script src="../lib/art.js"></script>
<script>
// Three Day Tide: in three days a great flood will swallow the town. Help the townsfolk to earn four tide charms and seal the sea wall. If time runs out, the clock rewinds, but your charms stay with you.
K.theme({ bg: '#0a1020', ink: '#f0f6ff', accent: '#46d0ff', accentInk: '#002a3a' });
// tall portrait view, zoomed in Z times on the world; the camera follows the hero smoothly
let VW = 240; const VH = 330, Z = 1.6, T = 16, HOUR = 4; // seconds per game hour
K.screen(VW, VH);
K.flex(240, VH, w => { VW = w; }); // phone on its side: wider view that fills the screen
K.hud(['day', 'clock', 'charms']);
K.pad({ dpad: '4', buttons: [{ id: 'a', label: 'TALK' }] });
const MAP = ["################################", "#..............#...............#", "#.HHHH....HHHH.#....HHHHHH.....#", "#.HHHH....HHHH......HHHHHH.....#", "#.HdHH....HHdH......HHdHHH.....#", "#......................B.......#", "#..B......,,,,,,,,,,,,.....B...#", "#.........,..CC......,.........#", "#.........,..CC..O...,.........#", "#.........,,,,,,,,,,,,.........#", "#..............................#", "#..HHHH........................#", "#..HHHH..........B.......HHHH..#", "#..HdHH..................HHdH..#", "#..............................#", "#.............................L#", ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,", ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,", ",,,,,,,,,,,,,A,,,,,,,,,,,,,,,,,,", "################WWWW====WWWWWWWW", "WWWWWWWWWWWWWWWWWWWW====WWWWWWWW", "WWWWWWWWWWWWWWWWWWWW====WWWWWWWW", "WWWWWWWWWWWWWWWWWWWW====WWWWWWWW", "WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW"];
const CHARMS = { lamp: 'Lamp Charm', hook: 'Hook Charm', shell: 'Shell Charm', seal: 'Seal Charm' };
const BUSHES = [[23, 5], [3, 6], [27, 6], [17, 12]];

let state = 'title', w, p, cam, trans, day, hour, charms, inv, talk, loops, playT, flood, npcs, best = K.best('threeday');
function title() { K.card({ title: 'THREE DAY TIDE', text: 'A great flood hits the town at dawn after the third day. Walk around and TALK to people (face them and press TALK). Their lives follow the clock, so visit at the right time! Earn four tide charms and set them on the sea wall altar. If the flood comes, time rewinds to day one, but you keep your charms.', best: best ? 'BEST ' + best + ' MIN' : '', button: 'Day 1, 6 AM', onStart: start }); }
function start() { w = D.world(MAP); D.SOLID = '#HWCOBLd'; charms = {}; loops = 0; playT = 0; resetLoop(); state = 'play'; talk = { who: '', lines: ['Dawn of the first day. The sea looks restless...', 'Old tales say four tide charms on the sea wall altar can hold back the water. Ask around town!'] }; }
function resetLoop() { day = 1; hour = 6; inv = {}; flood = 0; p = { x: 15 * T + 2, y: 10 * T + 2, w: 12, h: 12, face: 'd', inv: 0 }; cam = camTarget(); trans = null; hud(); }
function camTarget() { const vw = VW / Z, vh = VH / Z, ww = w.cols * T, wh = w.rows * T; return { x: K.clamp(p.x + 6 - vw / 2, 0, ww - vw), y: K.clamp(p.y + 6 - vh * 0.52, 0, wh - vh) }; }
function fmtH(h) { const hh = Math.floor(h) % 24, m = Math.floor((h % 1) * 60 / 10) * 10; return ((hh + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (hh < 12 ? ' AM' : ' PM'); }
function hud() { K.set('day', 'DAY ' + day); K.set('clock', fmtH(hour)); K.set('charms', '◆ ' + Object.keys(charms).length + '/4'); }
const night = () => hour >= 20;
const hideSpot = () => BUSHES[(day + loops) % BUSHES.length];

// where people are right now
function people() {
  const list = [];
  const h = hour, isNight = h >= 20;
  list.push({ id: 'kid', x: 17, y: 10, show: !(h >= 12 && h < 18), col: '#ffb02e' });
  list.push({ id: 'keeper', x: 29, y: 15, show: true, col: '#c8a050', asleep: !isNight });
  list.push({ id: 'fisher', x: 22, y: 18, show: day === 2 && h < 18, col: '#3a8a6a' });
  list.push({ id: 'mayor', x: 22, y: 5, show: h >= 18 && h < 23, col: '#8a4ad8' });
  list.push({ id: 'shop', x: 3, y: 5, show: h >= 9 && h < 18, col: '#e63946' });
  return list.filter(n => n.show);
}
function talkTo(id) {
  const has = k => !!charms[k];
  if (id === 'kid') talk = { who: 'PIP (KID)', lines: has('shell') ? ['You found me fair and square! Keep that charm safe.'] : ['Wanna play hide and seek? I hide every afternoon, from noon till 6!', 'I pick a different bush every day. Bet you can\'t find me!'] };
  if (id === 'keeper') {
    if (has('lamp')) talk = { who: 'LIGHTHOUSE KEEPER', lines: ['The light burns bright thanks to you.'] };
    else if (p.asleepNpc) talk = { who: 'LIGHTHOUSE KEEPER', lines: ['Zzz... (He only wakes up after 8 at night.)'] };
    else if (inv.oil) { delete inv.oil; charms.lamp = 1; got('lamp'); talk = { who: 'LIGHTHOUSE KEEPER', lines: ['Lamp oil! Now the ships can see the reef again.', 'Take this. It has hung in the tower for a hundred years.', 'You got the LAMP CHARM!'] }; }
    else talk = { who: 'LIGHTHOUSE KEEPER', lines: ['My lamp ran dry. The shop sells oil, but it closes at 6 in the evening and I sleep all day...', 'If you brought me some oil tonight, I would be grateful.'] };
  }
  if (id === 'shop') { if (!inv.oil) { inv.oil = 1; talk = { who: 'SHOPKEEPER', lines: ['Lamp oil? For the lighthouse? Take it, free of charge. That old keeper saved my boat once.', 'You got LAMP OIL.'] }; } else talk = { who: 'SHOPKEEPER', lines: ['Open nine to six. Mind the weather out there.'] }; }
  if (id === 'fisher') {
    if (has('hook')) talk = { who: 'FISHER', lines: ['Biting like crazy today!'] };
    else if (inv.hook) { delete inv.hook; charms.hook = 1; got('hook'); talk = { who: 'FISHER', lines: ['My lucky hook! The tide must have washed it up.', 'Here, this charm is luckier still. You got the HOOK CHARM!'] }; }
    else talk = { who: 'FISHER', lines: ['Lost my lucky hook yesterday off the west beach. The tide was out this morning... maybe it\'s still on the sand?'] };
  }
  if (id === 'mayor') {
    if (has('seal')) talk = { who: 'MAYOR', lines: ['Hurry to the altar on the sea wall!'] };
    else if (has('lamp') && has('hook') && has('shell')) { charms.seal = 1; got('seal'); talk = { who: 'MAYOR', lines: ['Three charms! Then the old story is true.', 'This is the town\'s own seal. Place all four on the sea wall altar. You got the SEAL CHARM!'] }; }
    else talk = { who: 'MAYOR', lines: ['A flood? Nonsense... though the old sea wall altar does need four charms.', 'Bring me three of them and I will add the town seal. I\'m in my hall every evening, 6 to 11.'] };
  }
}
function got(k) { K.tune([523, 659, 784, 1047, 1319], 0.1); hud(); }

function update(dt) {
  if (state !== 'play') return;
  if (talk) { if (K.hit('a') || K.ptr.tapped) { talk.lines.shift(); K.beep(700, 0.03, { vol: 0.03 }); if (!talk.lines.length) { const d = talk.done; talk = null; if (d) d(); } } return; }
  if (flood > 0) { flood += dt; if (flood > 3.5) { loops++; resetLoop(); talk = { who: '', lines: ['...The water swallows everything. Then, a strange silence.', 'You wake at dawn on the first day again. The charms are still in your pocket.'] }; } return; }
  playT += dt;
  const was = Math.floor(hour);
  hour += dt / HOUR;
  if (Math.floor(hour) !== was) { hud(); if (Math.floor(hour) === 12) K.beep(880, 0.2, { type: 'sine', vol: 0.04 }); }
  if (hour >= 30) { if (day < 3) { day++; hour = 6; hud(); K.tune([523, 659, 784], 0.12, { type: 'triangle' }); talk = { who: '', lines: ['Dawn of day ' + day + '. ' + (day === 3 ? 'The final day. The waves are huge.' : 'The tide is creeping closer.')] }; } else { flood = 0.01; K.noise(2.5, 0.4); } }
  const d = D.input(p);
  p.moving = !!(d[0] || d[1]);
  if (d[0] || d[1]) { D.move(w, p, d[0] * 76 * dt, 0); D.move(w, p, 0, d[1] * 76 * dt); p.walk = (p.walk || 0) + dt; }
  // the hook lies on the west beach only on the morning of day 2
  if (day === 2 && hour < 12 && !inv.hook && !charms.hook && Math.abs(p.x + 6 - (5 * T + 8)) < 10 && Math.abs(p.y + 6 - (17 * T + 8)) < 10) { inv.hook = 1; K.tune([784, 988], 0.07); talk = { who: '', lines: ['Something glints in the wet sand... a fishing hook!'] }; }
  if (K.hit('a')) interact();
  const ct = camTarget(), ck = 1 - Math.pow(0.002, dt); cam.x += (ct.x - cam.x) * ck; cam.y += (ct.y - cam.y) * ck;
}
function interact() {
  const v = D.faceVec(p.face), fx = p.x + 6 + v[0] * 14, fy = p.y + 6 + v[1] * 14;
  for (const n of people()) if (Math.abs(n.x * T + 8 - fx) < 13 && Math.abs(n.y * T + 8 - fy) < 13) { p.asleepNpc = n.asleep; talkTo(n.id); return; }
  const tx = Math.floor(fx / T), ty = Math.floor(fy / T), ch = D.tile(w, fx, fy);
  if (ch === 'B') { const hs = hideSpot(); if (hour >= 12 && hour < 18 && hs[0] === tx && hs[1] === ty && !charms.shell) { charms.shell = 1; got('shell'); talk = { who: 'PIP (KID)', lines: ['Aww, you found me! Okay, okay, you win.', 'Here\'s my treasure. You got the SHELL CHARM!'] }; } else talk = { who: '', lines: ['Just a bush.' + (hour >= 12 && hour < 18 && !charms.shell ? ' You hear giggling somewhere else...' : '')] }; return; }
  if (ch === 'd') { const shop = tx < 8 && ty < 8, inn = tx > 8 && tx < 16 && ty < 8, hall = tx > 16 && ty < 8; if (shop) { if (hour >= 9 && hour < 18) talkTo('shop'); else talk = { who: '', lines: ['SHOP: open 9 AM to 6 PM.'] }; } else if (inn) talk = { who: 'INNKEEPER', lines: ['Need a rest? Sleep until the next morning or evening.'], done: () => { hour = hour < 18 ? 18 : 30; if (hour >= 30 && day < 3) { day++; hour = 6; } else if (hour >= 30) hour = 29.9; hud(); } }; else if (hall) talk = { who: '', lines: hour >= 18 && hour < 23 ? ['The mayor is standing right outside tonight.'] : ['MAYOR\'S HALL: the mayor meets visitors 6 to 11 PM.'] }; else talk = { who: '', lines: ['Nobody answers.'] }; return; }
  if (ch === 'C') { talk = { who: 'CLOCK TOWER', lines: ['The great clock hums. You could wind it back to the dawn of the first day. (Your charms stay with you.)'], done: () => { loops++; resetLoop(); } }; return; }
  if (ch === 'O') { talk = { who: '', lines: ['An old well. The water level rises and falls with the sea.'] }; return; }
  if (ch === 'L') { talk = { who: '', lines: ['The lighthouse.' + (night() ? ' A light is on inside.' : ' The keeper sleeps during the day.')] }; return; }
  if (ch === 'A' || D.tile(w, p.x + 6, p.y + 6) === 'A' || D.tile(w, fx, fy + 8) === 'A') { const n = Object.keys(charms).length; if (n >= 4) { talk = { who: '', lines: ['You set the four tide charms into the altar. They begin to glow...', 'A wall of light rises from the stones. The sea falls quiet.'], done: win }; } else talk = { who: 'SEA WALL ALTAR', lines: ['Four hollows are carved into the stone. You have ' + n + ' charm' + (n === 1 ? '' : 's') + '.'] }; return; }
}
function win() { state = 'over'; const m = Math.max(1, Math.round(playT / 60)); best = K.saveBest('threeday', m, true); K.tune([392, 523, 659, 784, 1047, 1319, 1568], 0.12); K.card({ title: 'THE TOWN IS SAVED', text: 'You sealed the sea wall after ' + loops + ' rewind' + (loops === 1 ? '' : 's') + ', in about ' + m + ' minute' + (m === 1 ? '' : 's') + ' of play.', best: 'BEST ' + best + ' MIN', button: 'Play again', onStart: start }); }

function drawTile(c, ch, x, y, tx, ty, t) {
  c.fillStyle = (tx + ty) % 2 ? '#8ac86a' : '#84c264'; c.fillRect(x, y, T, T);
  if (ch === ',') { c.fillStyle = ty >= 16 ? '#e8d6a0' : '#c8b08a'; c.fillRect(x, y, T, T); if (ty >= 16 && (tx * 7 + ty) % 5 === 0) { c.fillStyle = '#d8c690'; c.fillRect(x + 4, y + 6, 3, 2); } }
  else if (ch === '#') { c.fillStyle = ty >= 19 ? '#7a7a8a' : '#5a7a4a'; c.fillRect(x, y, T, T); c.fillStyle = 'rgba(0,0,0,.2)'; c.fillRect(x, y + 7, T, 1); c.fillRect(x + (ty % 2 ? 4 : 11), y, 1, T); }
  else if (ch === 'W') { const lvl = flood > 0 ? 1 : 0; c.fillStyle = '#2a6ad8'; c.fillRect(x, y, T, T); c.fillStyle = '#7ac8ff'; c.fillRect(x + (t / 70 + tx * 3) % 12, y + 6 + Math.sin(t / 300 + tx) * 2, 4, 1); }
  else if (ch === '=') { c.fillStyle = '#9a6a3a'; c.fillRect(x, y, T, T); c.fillStyle = '#6a4a2a'; for (let k = 0; k < T; k += 4) c.fillRect(x + k, y, 1, T); }
  else if (ch === 'H' || ch === 'd') { const roof = D.tile(w, x + cam.x, y + cam.y - T) !== 'H' && D.tile(w, x + cam.x, y + cam.y - T) !== 'd'; c.fillStyle = '#e8d6b0'; c.fillRect(x, y, T, T); if (roof) { c.fillStyle = ['#c8402c', '#2a6fdb', '#8a4ad8', '#3a8a6a'][(tx >> 3) % 4]; c.fillRect(x, y, T, 9); } if (ch === 'd') { c.fillStyle = '#6a3a1a'; c.fillRect(x + 4, y + 3, 8, 13); c.fillStyle = '#ffd23f'; c.fillRect(x + 10, y + 9, 1, 2); } else if (!roof) { c.fillStyle = night() ? '#ffd86b' : '#9ad8ff'; c.fillRect(x + 4, y + 5, 7, 6); } }
  else if (ch === 'C') { c.fillStyle = '#9a8a7a'; c.fillRect(x, y, T, T); if (D.tile(w, x + cam.x, y + cam.y - T) !== 'C') { c.fillStyle = '#fff'; c.beginPath(); c.arc(x + (D.tile(w, x + cam.x - T, y + cam.y) === 'C' ? 0 : 16), y + 10, 9, 0, 7); c.fill(); c.strokeStyle = '#000'; c.lineWidth = 1.5; const cx = x + (D.tile(w, x + cam.x - T, y + cam.y) === 'C' ? 0 : 16), a = (hour % 12) / 12 * Math.PI * 2 - Math.PI / 2; c.beginPath(); c.moveTo(cx, y + 10); c.lineTo(cx + Math.cos(a) * 5, y + 10 + Math.sin(a) * 5); c.stroke(); } }
  else if (ch === 'O') { c.fillStyle = '#7a7a8a'; c.beginPath(); c.arc(x + 8, y + 8, 7, 0, 7); c.fill(); c.fillStyle = '#1a3a6a'; c.beginPath(); c.arc(x + 8, y + 8, 4, 0, 7); c.fill(); }
  else if (ch === 'B') { c.fillStyle = '#3fa34d'; c.beginPath(); c.arc(x + 5, y + 9, 5, 0, 7); c.arc(x + 11, y + 9, 5, 0, 7); c.arc(x + 8, y + 5, 5, 0, 7); c.fill(); const hs = hideSpot(); if (hour >= 12 && hour < 18 && hs[0] === tx && hs[1] === ty && !charms.shell && Math.floor(t / 900) % 3 === 0) { c.fillStyle = '#ffb02e'; c.fillRect(x + 6, y + 1, 4, 3); } }
  else if (ch === 'L') { c.fillStyle = '#f2f2f2'; c.fillRect(x + 3, y - 20, 10, 36); c.fillStyle = '#e63946'; c.fillRect(x + 3, y - 12, 10, 4); c.fillRect(x + 3, y, 10, 4); c.fillStyle = night() && charms.lamp ? '#ffe86b' : '#555'; c.fillRect(x + 4, y - 26, 8, 6); }
  else if (ch === 'A') { c.fillStyle = '#e8d6a0'; c.fillRect(x, y, T, T); c.fillStyle = '#9a8a7a'; c.fillRect(x + 1, y + 2, 14, 12); for (let k = 0; k < 4; k++) { c.fillStyle = k < Object.keys(charms).length ? '#46d0ff' : '#5a4a3a'; c.fillRect(x + 2 + k * 3.5, y + 6, 2, 3); } }
}
// ---------- big detailed sprites ----------
const INK = 'rgba(22,14,10,.92)';
function shape(c, col, fn) { c.fillStyle = INK; c.save(); c.lineWidth = 1.1; c.strokeStyle = INK; fn(); c.stroke(); c.restore(); c.fillStyle = col; fn(); c.fill(); }
function rr(c, x, y, wd, ht, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, wd, ht, r); else c.rect(x, y, wd, ht); }
// a townsperson standing with feet at (x, y). o: { face, walk, shirt, pants, skin, hair, hat, small, beard, apron, robe, rod, bag }
function person(c, x, y, o, t) {
  const f = o.face || 'd', k = o.small ? 0.82 : 1, moving = o.walk != null && o.moving, ph = moving ? o.walk * 12 : 0;
  const lift = moving ? Math.sin(ph) * 1.6 : 0, bob = moving ? Math.abs(Math.cos(ph)) * 0.7 : Math.sin(t / 600 + x) * 0.25;
  c.save(); c.translate(x, y); c.scale(k, k);
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(0, 0, 6.5, 2.4, 0, 0, 7); c.fill();
  // legs + boots
  const side = f === 'l' || f === 'r', dir = f === 'l' ? -1 : 1;
  if (!o.robe) {
    if (side) { shape(c, o.pants, () => rr(c, -2.2 + lift * dir * 0.8, -7, 3, 6.5, 1)); shape(c, o.pants, () => rr(c, -0.8 - lift * dir * 0.8, -7, 3, 6.5, 1)); shape(c, '#3a2416', () => rr(c, -2.6 + lift * dir * 0.8 + dir, -1.8, 4, 2.2, 1)); shape(c, '#3a2416', () => rr(c, -1.2 - lift * dir * 0.8 + dir, -1.8, 4, 2.2, 1)); }
    else { shape(c, o.pants, () => rr(c, -3.6, -7 - Math.max(0, lift), 3, 6.5 , 1)); shape(c, o.pants, () => rr(c, 0.6, -7 - Math.max(0, -lift), 3, 6.5, 1)); shape(c, '#3a2416', () => rr(c, -4, -1.8 - Math.max(0, lift), 3.8, 2.2, 1)); shape(c, '#3a2416', () => rr(c, 0.2, -1.8 - Math.max(0, -lift), 3.8, 2.2, 1)); }
  }
  c.translate(0, -bob);
  // fishing rod over the shoulder
  if (o.rod) { c.strokeStyle = '#6a4a2a'; c.lineWidth = 1; c.beginPath(); c.moveTo(4, -10); c.lineTo(11, -30); c.stroke(); c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 0.4; c.beginPath(); c.moveTo(11, -30); c.quadraticCurveTo(13, -20, 12.5, -14); c.stroke(); }
  // arms (behind body when seen from the side)
  const sw = moving ? Math.sin(ph) * 2 : 0;
  const arm = (ax, ay) => { shape(c, o.shirt, () => rr(c, ax - 1.5, ay, 3, 7, 1.4)); shape(c, o.skin, () => { c.beginPath(); c.arc(ax, ay + 7.6, 1.6, 0, 7); }); };
  if (side) arm(-dir * 1 - sw * dir * 0.5, -15 + 0.3);
  // body
  if (o.robe) shape(c, o.shirt, () => { c.beginPath(); c.moveTo(-5, -15); c.lineTo(5, -15); c.lineTo(7, -0.5); c.lineTo(-7, -0.5); c.closePath(); });
  else shape(c, o.shirt, () => rr(c, -5, -15.5, 10, 9.5, 3));
  c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(-4, -14.5, 2, 7);
  if (o.apron && f !== 'u') { c.fillStyle = '#f4f0e6'; rr(c, -3.5, -12.5, 7, 10, 1); c.fill(); c.fillStyle = 'rgba(0,0,0,.1)'; c.fillRect(-2, -8, 4, 2); }
  if (o.robe && f !== 'u') { c.fillStyle = '#ffd23f'; c.fillRect(-0.6, -14, 1.2, 13); c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(0, -11, 1.5, 0, 7); c.fill(); }
  if (!o.robe) { c.fillStyle = '#5a3a1e'; c.fillRect(-5, -8, 10, 1.6); if (f !== 'u') { c.fillStyle = '#e8c040'; c.fillRect(-1, -8.2, 2, 2); } }
  if (o.bag) { c.strokeStyle = '#7a4a24'; c.lineWidth = 1; c.beginPath(); c.moveTo(-4, -15); c.lineTo(4, -8); c.stroke(); }
  if (!side) { arm(-6.2, -15 + (moving ? sw * 0.4 : 0)); arm(6.2, -15 - (moving ? sw * 0.4 : 0)); }
  else arm(dir * 1 + sw * dir * 0.5, -15);
  // head
  const hy = -20.5;
  shape(c, o.skin, () => { c.beginPath(); c.ellipse(0, hy, 5.4, 5.2, 0, 0, 7); });
  if (f === 'd' || side) { c.fillStyle = 'rgba(255,120,120,.35)'; if (f === 'd') { c.beginPath(); c.arc(-3, hy + 1.8, 1.1, 0, 7); c.arc(3, hy + 1.8, 1.1, 0, 7); c.fill(); } else { c.beginPath(); c.arc(dir * 2.6, hy + 1.8, 1.1, 0, 7); c.fill(); } }
  // hair
  c.fillStyle = o.hair;
  if (f === 'u') { c.beginPath(); c.ellipse(0, hy - 0.4, 5.6, 5.2, 0, 0, 7); c.fill(); }
  else if (side) { c.beginPath(); c.ellipse(-dir * 1.4, hy - 1.6, 5, 4.2, 0, Math.PI, 0); c.fill(); c.fillRect(-dir * 5.4 - (dir > 0 ? 0 : 3), hy - 2, 3, 4.5); }
  else { c.beginPath(); c.ellipse(0, hy - 1.8, 5.6, 4, 0, Math.PI, 0); c.fill(); c.fillRect(-5.6, hy - 2, 2, 4); c.fillRect(3.6, hy - 2, 2, 4); }
  // face
  if (f !== 'u') {
    c.fillStyle = '#1a1010';
    if (o.sleep) { c.fillRect(-3, hy + 0.2, 2, 0.6); c.fillRect(1, hy + 0.2, 2, 0.6); }
    else if (f === 'd') { c.fillRect(-2.6, hy - 0.6, 1.4, 2); c.fillRect(1.2, hy - 0.6, 1.4, 2); c.fillStyle = '#fff'; c.fillRect(-2.3, hy - 0.4, 0.5, 0.5); c.fillRect(1.5, hy - 0.4, 0.5, 0.5); c.fillStyle = '#8a3a2a'; c.fillRect(-1, hy + 2.6, 2, 0.6); }
    else { c.fillRect(dir * 2.4 - 0.7, hy - 0.6, 1.4, 2); c.fillStyle = o.skin; c.beginPath(); c.arc(dir * 5.2, hy + 0.8, 1.1, 0, 7); c.fill(); c.fillStyle = '#8a3a2a'; c.fillRect(dir * 2.6 - 0.6, hy + 2.6, 1.6, 0.6); }
