    if (ch === '#') { c.fillStyle = '#4a5a7a'; c.fillRect(X, Y, ms, ms); if (ms > 4) { c.fillStyle = '#5e7096'; c.fillRect(X, Y, ms, 1); } }
    else if (ch === 'D' || ch === 'K') { const d = doors[x + ',' + y]; c.fillStyle = ch === 'K' ? '#e63946' : '#c88a3a'; if (d && d.open >= 0.9) { c.globalAlpha = 0.35; } c.fillRect(X, Y, ms, ms); c.globalAlpha = 1; }
    else if (ch === 'E') { c.fillStyle = Math.floor(t / 300) % 2 ? '#3df07a' : '#1f9a4a'; c.fillRect(X, Y, ms, ms); }
  }
  for (const s of sprites) {
    const X = ox + s.x * ms, Y = oy + s.y * ms, r = Math.max(1.2, ms * 0.32);
    if (s.k === 'd') { c.fillStyle = Math.floor(t / 250) % 2 ? '#46d0ff' : '#a8ecff'; c.fillRect(X - r, Y - r, r * 2, r * 2); }
    else if (s.k === 'k') { c.fillStyle = '#ffd23f'; c.fillRect(X - r, Y - r * 0.7, r * 2, r * 1.4); }
    else if (big && (s.k === 'h' || s.k === 'a')) { c.fillStyle = s.k === 'h' ? '#f4f4f4' : '#c8a050'; c.fillRect(X - r * 0.7, Y - r * 0.7, r * 1.4, r * 1.4); }
    else if (s.k === 'guard' && s.hp > 0 && (Math.hypot(s.x - pl.x, s.y - pl.y) < 3 || los(pl.x, pl.y, s.x, s.y))) { c.fillStyle = s.st === 'alert' ? '#ff3b5c' : '#ff9a6a'; c.beginPath(); c.arc(X, Y, r, 0, 7); c.fill(); }
  }
  // you: view cone + arrow
  const px = ox + pl.x * ms, py = oy + pl.y * ms, L = ms * (big ? 3 : 4);
  c.fillStyle = 'rgba(255,210,63,.18)'; c.beginPath(); c.moveTo(px, py); c.arc(px, py, L, pl.a - FOV / 2, pl.a + FOV / 2); c.closePath(); c.fill();
  const ar = Math.max(2.5, ms * 0.6); c.fillStyle = '#ffd23f'; c.beginPath(); c.moveTo(px + Math.cos(pl.a) * ar * 1.4, py + Math.sin(pl.a) * ar * 1.4); c.lineTo(px + Math.cos(pl.a + 2.5) * ar, py + Math.sin(pl.a + 2.5) * ar); c.lineTo(px + Math.cos(pl.a - 2.5) * ar, py + Math.sin(pl.a - 2.5) * ar); c.fill();
  c.restore();
}
