// ---------- terrain: a height grid you can blow craters into ----------
const cell = SIZE / N;
function hAt(x, z) {
  const gx = (x + SIZE / 2) / cell, gz = (z + SIZE / 2) / cell;

}
function makeTerrain() {

    const x = i * cell - SIZE / 2, z = j * cell - SIZE / 2, d = Math.hypot(x / (SIZE * 0.47), z / (SIZE * 0.47));
    let h = 8 + 9 * Math.sin(x / 34 + p[0]) * Math.cos(z / 41 + p[1]) + 5 * Math.sin((x + z) / 19 + p[2]) + 4 * Math.cos(x / 13 - z / 23);
    h += 10 * Math.exp(-((x + 80) ** 2 + z * z) / 1800) + 10 * Math.exp(-((x - 80) ** 2 + z * z) / 1800); // a hill for each team's base
    h -= 14 * Math.exp(-(x * x + (z - 10) ** 2) / 900); // a pond in the middle
    h = h * (1 - Math.max(0, d - 0.82) * 4) - Math.max(0, d - 0.85) * 60; // the island edge drops into the water
    heights[j * (N + 1) + i] = h;

  colors = new Float32Array((N + 1) * (N + 1) * 3); geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  terrain = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true })); scene.add(terrain); refreshTerrain(true);
}
const scorch = new Float32Array((N + 1) * (N + 1));
function refreshTerrain(first) {
  const pos = terrain.geometry.attributes.position;
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const k = j * (N + 1) + i, h = heights[k]; pos.setY(k, h);
    const n = A.hash(i, j, 3) * 0.06, sc = scorch[k];
    let r, g, b;

    else if (h > 20) { r = 0.42 + n; g = 0.62 + n; b = 0.3; }
    else { r = 0.33 + n; g = 0.6 + n + (i + j) % 2 * 0.02; b = 0.24; }
    r = r * (1 - sc) + 0.36 * sc; g = g * (1 - sc) + 0.24 * sc; b = b * (1 - sc) + 0.14 * sc;
    colors[k * 3] = r; colors[k * 3 + 1] = g; colors[k * 3 + 2] = b;
  }

}
function crater(cx, cz, r, depth) {
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const x = i * cell - SIZE / 2, z = j * cell - SIZE / 2, d = Math.hypot(x - cx, z - cz); if (d > r * 1.3) continue;

// ---------- the farm ----------

  // target reticle on the ground

  const ring = new THREE.Mesh(new THREE.RingGeometry(8, 10.5, 40), rm); ring.rotation.x = -Math.PI / 2; reticle.add(ring);
  const ring2 = new THREE.Mesh(new THREE.RingGeometry(10.5, 11.6, 40), rk); ring2.rotation.x = -Math.PI / 2; reticle.add(ring2);

// ---------- soldiers ----------
// camo cloth: a small painted texture of blotches, woodland green for your pigs, desert tan for the goats
const CAMO = {};
function camoMat(kind) {
  if (!CAMO[kind]) {
    const cols = kind === 'wood' ? ['#4a5a2a', '#2f3a1c', '#6b6a3a', '#1e2414'] : ['#c8b07a', '#9a7a4a', '#e0cfa0', '#6e5634'];
    const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
    x.fillStyle = cols[0]; x.fillRect(0, 0, 64, 64);

}
function add(g, geo, m, x, y, z, rx, ry, rz) { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.rotation.set(rx || 0, ry || 0, rz || 0); g.add(o); return o; }
// steel helmet with a camo cover, chin strap and a team-colored stripe
function helmet(g, kind, team, x, y, r) {
  add(g, new THREE.SphereGeometry(r, 14, 8, 0, 6.3, 0, 1.45), camoMat(kind), x, y, 0);
  add(g, new THREE.CylinderGeometry(r * 1.08, r * 1.12, 0.3, 16), mat(kind === 'wood' ? 0x2f3a1c : 0x7a5e38), x, y + 0.1, 0);
  add(g, new THREE.TorusGeometry(r * 1.0, 0.16, 4, 18, Math.PI), mat(0x3a2a1a), x + 0.2, y - 0.4, 0, 0, Math.PI / 2, 0);
  add(g, new THREE.CylinderGeometry(r * 1.02, r * 1.04, 0.5, 18, 1, true), mat(team ? 0xd83a2a : 0x2a7ad8, { side: THREE.DoubleSide }), x, y + 0.55, 0);
}

// ammo belt / vest straps across the chest
function straps(g, kind, x, y, rx, ry) {

function pig() {
