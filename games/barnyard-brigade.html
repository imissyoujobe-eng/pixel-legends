<script>
// Barnyard Brigade: strictly turn-based squad battle on a 3D farm you can blow apart. Your helmeted goats take on the computer's rooster regiment.

  { n: 'BAZOOKA', r: 22, dmg: 45, ammo: 99, elev: 0.6, cam: true },
  { n: 'GRENADE', r: 24, dmg: 50, ammo: 3, elev: 0.95, fuse: 3, cam: true },
  { n: 'MISSILE', r: 30, dmg: 60, ammo: 1, cam: true, missile: true }

function title() { K.card({ title: 'BARNYARD BRIGADE', text: 'Goats versus roosters, one move at a time. On your turn walk your soldier with the joystick (a short way), then press AIM or tap the field to place the target, pick a gun with GUN and press FIRE. The rifle shoots straight; the bazooka, grenade and missile fly in and the camera rides along (tap to skip). Watch the wind. Knock every rooster out or into the pond to win.', best: wins ? 'WINS ' + wins : '', button: 'Battle!', onStart: () => { if (!renderer) setup(); start(); } }); }

function fit() { const r = stageEl.getBoundingClientRect(), w = Math.max(100, r.width), h = Math.max(100, r.height); renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 62 : 42; camera.updateProjectionMatrix(); const d = Math.min(devicePixelRatio || 1, 2); hudC.width = w * d; hudC.height = h * d; hx.setTransform(d, 0, 0, d, 0, 0); hudC._w = w; hudC._h = h; }

// ---------- terrain: a height grid you can blow craters into ----------
const cell = SIZE / N;
function hAt(x, z) {

function makeTerrain() {

    h += 10 * Math.exp(-((x + 80) ** 2 + z * z) / 1800) + 10 * Math.exp(-((x - 80) ** 2 + z * z) / 1800); // a hill for each team's base
    h -= 14 * Math.exp(-(x * x + (z - 10) ** 2) / 900); // a pond in the middle
    h = h * (1 - Math.max(0, d - 0.82) * 4) - Math.max(0, d - 0.85) * 60; // the island edge drops into the water

const scorch = new Float32Array((N + 1) * (N + 1));
function refreshTerrain(first) {

  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {

    const n = A.hash(i, j, 3) * 0.06, sc = scorch[k];

    else { r = 0.33 + n; g = 0.6 + n + (i + j) % 2 * 0.02; b = 0.24; }

}
function crater(cx, cz, r, depth) {
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const x = i * cell - SIZE / 2, z = j * cell - SIZE / 2, d = Math.hypot(x - cx, z - cz); if (d > r * 1.3) continue;
    const k = j * (N + 1) + i; if (d < r) heights[k] -= depth * (1 - (d / r) ** 2); scorch[k] = Math.min(1, scorch[k] + (1 - d / (r * 1.3)) * 0.9);

}

// ---------- the farm ----------

  for (let i = 0; i < 26; i++) { const a = A.hash(i, 1, 1) * 6.28, r = 60 + A.hash(i, 2, 1) * 70, x = Math.cos(a) * r, z = Math.sin(a) * r; if (hAt(x, z) < 2 || Math.abs(x) > 60 && Math.abs(z) < 40) continue; const tr = new THREE.Group(); const tk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.1, 6, 6), mat(0x6a4422)); tk.position.y = 3; tr.add(tk); const lf = new THREE.Mesh(new THREE.IcosahedronGeometry(5 + A.hash(i, 3) * 2, 0), mat(i % 3 ? 0x3a8a3a : 0x2f7a32, { flatShading: true })); lf.position.y = 9; tr.add(lf); tr.position.set(x, hAt(x, z) - 0.5, z); scene.add(tr); }
  for (let i = 0; i < 10; i++) { const x = -40 + i * 9, z = -95; const post = new THREE.Mesh(new THREE.BoxGeometry(0.8, 4, 0.8), mat(0xe8d8c0)); post.position.set(x, hAt(x, z) + 2, z); scene.add(post); if (i) { const rail = new THREE.Mesh(new THREE.BoxGeometry(9, 0.6, 0.4), mat(0xe8d8c0)); rail.position.set(x - 4.5, hAt(x, z) + 3, z); scene.add(rail); } }
  for (let i = 0; i < 6; i++) { const x = -30 + A.hash(i, 9) * 60, z = 80 + A.hash(i, 8) * 30; if (hAt(x, z) < 2) continue; const hay = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 4, 12), mat(0xe8c060)); hay.rotation.z = Math.PI / 2; hay.position.set(x, hAt(x, z) + 2.4, z); scene.add(hay); }

}
// ---------- soldiers ----------
function goat() {

  const body = new THREE.Mesh(new THREE.SphereGeometry(3, 12, 10), fur); body.scale.set(1.35, 1, 0.95); body.position.y = 4.4; g.add(body);
  [[-2.2, -1.4], [-2.2, 1.4], [2.2, -1.4], [2.2, 1.4]].forEach(([x, z]) => { const l = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.45, 3.2, 6), dark); l.position.set(x, 1.6, z); g.add(l); });
  const head = new THREE.Mesh(new THREE.SphereGeometry(1.9, 12, 10), fur); head.scale.set(1.2, 1, 0.9); head.position.set(4.2, 6.6, 0); g.add(head);
  const beard = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.8, 6), mat(0xb8a888)); beard.position.set(5, 4.9, 0); beard.rotation.z = Math.PI; g.add(beard);
  [-0.8, 0.8].forEach(z => { const horn = new THREE.Mesh(new THREE.ConeGeometry(0.45, 2.4, 6), mat(0x8a7a5a)); horn.position.set(3.6, 8.6, z); horn.rotation.z = 0.6; g.add(horn); const eye = new THREE.Mesh(new THREE.SphereGeometry(0.3, 6, 6), mat(0x111111)); eye.position.set(5.6, 7.1, z * 0.9); g.add(eye); });
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(2.05, 12, 6, 0, 6.3, 0, 1.4), mat(0x3a6ad8)); helmet.position.set(4.1, 7.1, 0); g.add(helmet);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.4, 6), fur); tail.position.set(-4, 5.4, 0); tail.rotation.z = 0.9; g.add(tail);
  return g;
}
function rooster() {
  const g = new THREE.Group(), red = mat(0xc8502c);
  const body = new THREE.Mesh(new THREE.SphereGeometry(3, 12, 10), red); body.scale.set(1.15, 1.05, 0.95); body.position.y = 4.6; g.add(body);
  [-1, 1].forEach(z => { const l = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2.6, 6), mat(0xffb02e)); l.position.set(0, 1.3, z); g.add(l); const foot = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 0.8), mat(0xffb02e)); foot.position.set(0.5, 0.15, z); g.add(foot); });
  for (let k = 0; k < 4; k++) { const f = new THREE.Mesh(new THREE.ConeGeometry(0.9, 5, 5), mat(k % 2 ? 0x2a6a3a : 0x1a4a8a)); f.position.set(-3.6, 6.8 + k * 0.4, -0.8 + k * 0.5); f.rotation.z = 0.9 + k * 0.2; g.add(f); }
  const head = new THREE.Mesh(new THREE.SphereGeometry(1.7, 12, 10), mat(0xe8e2d6)); head.position.set(2.8, 8, 0); g.add(head);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.6, 1.6, 6), mat(0xffb02e)); beak.rotation.z = -Math.PI / 2; beak.position.set(4.7, 7.9, 0); g.add(beak);
  const wattle = new THREE.Mesh(new THREE.SphereGeometry(0.55, 6, 6), mat(0xd83a3a)); wattle.position.set(4, 6.8, 0); g.add(wattle);
  for (let k = 0; k < 3; k++) { const cmb = new THREE.Mesh(new THREE.SphereGeometry(0.7, 6, 6), mat(0xd83a3a)); cmb.position.set(2.2 + k * 0.8, 9.7 + (k === 1 ? 0.3 : 0), 0); g.add(cmb); }
  [-0.7, 0.7].forEach(z => { const eye = new THREE.Mesh(new THREE.SphereGeometry(0.28, 6, 6), mat(0x111111)); eye.position.set(3.9, 8.4, z); g.add(eye); });
  const helmet = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 1.9, 0.5, 12), mat(0x5a6a3a)); helmet.position.set(2.7, 9.2, 0); g.add(helmet);

function start() {
  if (scene) { scene.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  scorch.fill(0); build();

  [0, 1].forEach(team => { for (let i = 0; i < n; i++) { const x = (team ? 1 : -1) * (75 + (i % 2) * 22) + K.rnd(-6, 6), z = -45 + i * 32 + K.rnd(-6, 6), m = team ? rooster() : goat(); m.scale.setScalar(2.2); scene.add(m); units.push({ team, name: NAMES[team][i], x, z, y: hAt(x, z), vx: 0, vy: 0, vz: 0, hp: 100, alive: true, yaw: team ? Math.PI : 0, onG: true, m }); } });

  shots = []; fx = []; turnTeam = 1; idx = [-1, -1]; state = 'play'; killCam = null; slowT = 0;
  nextTurn();

function alive(team) { return units.filter(u => u.alive && u.team === team); }
function cur() { return units.filter(u => u.team === turnTeam)[idx[turnTeam]]; }
function hud() { const hp = t => alive(t).reduce((a, u) => a + u.hp, 0); K.set('you', 'GOATS ' + hp(0)); K.set('turn', turnTeam === 0 ? 'YOUR TURN' : 'CPU TURN'); K.set('cpu', 'ROOSTERS ' + hp(1)); }
function say(t, d) { msg = t; msgT = d || 1.4; }
function nextTurn() {

  const team = units.filter(u => u.team === turnTeam);
  do { idx[turnTeam] = (idx[turnTeam] + 1) % team.length; } while (!team[idx[turnTeam]].alive);
  const u = cur(); turnT = TURN_T; walkLeft = WALK; aiming = false; weapon = turnTeam === 0 ? (weapon && ammo[0][weapon] > 0 ? weapon : 0) : 0;
  const foe = alive(1 - turnTeam).sort((a, b) => Math.hypot(a.x - u.x, a.z - u.z) - Math.hypot(b.x - u.x, b.z - u.z))[0]; reticle.position.set(foe.x, 0, foe.z); { const dx = foe.x - u.x, dz = foe.z - u.z, d = Math.hypot(dx, dz) || 1; turnDir = { x: dx / d, z: dz / d }; }

  phase = turnTeam === 0 ? 'move' : 'cpu'; thinkT = 1.2; cpuPlan = null;
  say((turnTeam === 0 ? 'YOUR TURN: ' : 'CPU: ') + u.name.toUpperCase(), 1.4); hud();

function endGame() {
  if (state !== 'play') return; state = 'over'; const win = alive(0).length > 0;
  if (win) { wins++; level++; try { localStorage.setItem('pa-barnyard-wins', wins); } catch (e) {} K.tune([523, 659, 784, 1047, 1319], 0.1); }
  else K.tune([392, 330, 262, 196], 0.15);
  setTimeout(() => K.card({ title: win ? 'GOATS WIN!' : 'ROOSTERS WIN', text: win ? 'The barnyard is yours! ' + alive(0).length + ' goat' + (alive(0).length === 1 ? '' : 's') + ' still standing. The roosters will aim better next time.' : 'Your squad got plucked. Regroup and try again!', best: 'WINS ' + wins, button: win ? 'Next battle' : 'Rematch', onStart: start }), 900);
}

// ---------- shooting ----------
// launch velocity to land on the target with a given elevation angle (no wind)
function ballistic(sx, sy, sz, tx, ty, tz, elev) {
  const dx = tx - sx, dz = tz - sz, d = Math.max(4, Math.hypot(dx, dz)), dy = ty - sy, tan = Math.tan(elev), den = 2 * Math.cos(elev) ** 2 * (d * tan - dy);
  const v = den > 0 ? Math.sqrt(GRAV * d * d / den) : 120, vh = v * Math.cos(elev);
  return { x: dx / d * vh, y: v * Math.sin(elev), z: dz / d * vh };
}
function fire(u, tx, tz, wi) {
  const w = WEAPONS[wi]; if (ammo[u.team][wi] <= 0) return false;
  ammo[u.team][wi]--; aiming = false;
  u.yaw = Math.atan2(-(tz - u.z), tx - u.x);
  const sx = u.x + Math.cos(u.yaw) * 11, sz = u.z - Math.sin(u.yaw) * 11, sy = u.y + 14;
  if (wi === 0) { // rifle: straight and fast, three-round burst
    const ty = hAt(tx, tz) + 8, d = Math.hypot(tx - sx, ty - sy, tz - sz) || 1;
    for (let k = 0; k < 3; k++) shots.push({ x: sx, y: sy, z: sz, vx: (tx - sx) / d * 360 + K.rnd(-8, 8), vy: (ty - sy) / d * 360 + K.rnd(-4, 4), vz: (tz - sz) / d * 360 + K.rnd(-8, 8), w: 0, t: -k * 0.12, life: w.range / 360, team: u.team });
    K.beep(900, 0.05, { type: 'square', to: 200, vol: 0.05 });
  } else if (w.missile) { // missile: comes down from the sky onto the target
    shots.push({ x: tx - 80, y: 160, z: tz + 40, tx, tz, w: wi, t: 0, missile: true, team: u.team, m: rocketMesh(0xd0d0dc) });
    K.beep(1200, 0.5, { type: 'sine', to: 400, vol: 0.05 });
  } else {
    const v = ballistic(sx, sy, sz, tx, hAt(tx, tz) + 2, tz, w.elev);
    shots.push({ x: sx, y: sy, z: sz, vx: v.x, vy: v.y, vz: v.z, w: wi, t: 0, fuse: w.fuse || 0, team: u.team, m: wi === 1 ? rocketMesh(0x4a5a3a) : grenadeMesh() });
    K.beep(220, 0.15, { type: 'square', to: 500, vol: 0.06 }); K.noise(0.15, 0.2);
  }
  phase = 'fly'; if (w.cam) killCam = { follow: shots[shots.length - 1], hit: null, t: 0, ox: w.missile ? tx - 80 : u.x, oz: w.missile ? tz + 40 : u.z }; return true;

  for (const f of fx) if (f.txt) { const p = proj(f.x, f.y + (1.3 - f.l) * 8, f.z); txt(f.txt, p.x, p.y, 13, f.col); }
  // top-left panel: weapon, timer, walk left; top-right: wind
  // weapon panel with a big picture of the current weapon
  hx.fillStyle = 'rgba(0,0,0,.5)'; hx.beginPath(); hx.roundRect(8, 8, 190, 74, 10); hx.fill();
  const wpn = turnTeam === 0 ? weapon : (cpuPlan ? cpuPlan.wi : 1);
  hx.fillStyle = 'rgba(255,255,255,.12)'; hx.beginPath(); hx.roundRect(14, 14, 74, 62, 8); hx.fill();
  weaponPic(wpn, 51, 45, 62);
  txt(WEAPONS[wpn].n, 96, 26, 12, '#ffd23f', 'left');
  txt(ammo[turnTeam][wpn] < 50 ? 'AMMO x' + ammo[turnTeam][wpn] : 'AMMO ∞', 96, 43, 8, '#fff', 'left');
  if (phase === 'move' || phase === 'cpu') { txt(Math.ceil(turnT) + 's', 190, 26, 11, turnT < 6 ? '#ff6a4a' : '#fff', 'right'); hx.fillStyle = '#333'; hx.fillRect(96, 58, 94, 6); hx.fillStyle = '#7cd65a'; hx.fillRect(96, 58, 94 * Math.max(0, walkLeft) / WALK, 6); txt('WALK', 96, 70, 7, '#cfe8c8', 'left'); }
  // weapon menu beside the active goat's name tag (tap a tile to switch)
  menuRects = [];
  if (turnTeam === 0 && phase === 'move' && u && u.alive) {
    const p = proj(u.x, u.y + 27, u.z), S = 40, G = 6, cols = 2, mw = cols * S + (cols - 1) * G, mh = 2 * S + G;
    let mx0 = p.x + 34; if (mx0 + mw > w - 8) mx0 = p.x - 34 - mw; mx0 = K.clamp(mx0, 8, w - mw - 8);
    const my0 = K.clamp(p.y - mh / 2 - 6, 90, h - mh - 30);
    WEAPONS.forEach((W2, i) => {
      const x = mx0 + (i % cols) * (S + G), y = my0 + Math.floor(i / cols) * (S + G), sel = i === weapon, out = ammo[0][i] <= 0;
      hx.fillStyle = sel ? 'rgba(255,210,63,.95)' : 'rgba(0,0,0,.6)'; hx.beginPath(); hx.roundRect(x, y, S, S, 8); hx.fill();
      hx.strokeStyle = sel ? '#fff' : 'rgba(255,255,255,.35)'; hx.lineWidth = sel ? 2 : 1; hx.stroke();
      hx.globalAlpha = out ? 0.3 : 1; weaponPic(i, x + S / 2, y + S / 2 - 3, S * 0.78); hx.globalAlpha = 1;
      if (W2.ammo < 50) txt('x' + ammo[0][i], x + S - 4, y + S - 7, 8, sel ? '#2a1d00' : '#ffd23f', 'right');
      menuRects.push({ x, y, w: S, h: S, i });
    });
  }
  hx.fillStyle = 'rgba(0,0,0,.5)'; hx.beginPath(); hx.roundRect(w - 92, 8, 84, 46, 8); hx.fill(); txt('WIND', w - 50, 18, 9, '#fff');
  const ws = Math.hypot(wind.x, wind.z); hx.save(); hx.translate(w - 50, 37); const sp = proj(0, 0, 0), ep = proj(wind.x * 30, 0, wind.z * 30); hx.rotate(Math.atan2(ep.y - sp.y, ep.x - sp.x)); hx.fillStyle = '#9fd6ff'; const L = 6 + ws * 18; hx.fillRect(-L / 2, -2, L, 4); hx.beginPath(); hx.moveTo(L / 2 + 5, 0); hx.lineTo(L / 2 - 1, -5); hx.lineTo(L / 2 - 1, 5); hx.fill(); hx.restore();
  if (turnTeam === 0 && phase === 'move') txt(aiming ? 'MOVE TARGET · FIRE TO SHOOT' : 'WALK · AIM OR TAP THE FIELD TO TARGET', w / 2, h - 16, 10, '#fff');
  if (killCam && (phase === 'fly' || phase === 'settle')) txt('TAP TO SKIP', w / 2, h - 16, 10, 'rgba(255,255,255,.8)');
  if (msgT > 0) txt(msg, w / 2, h * 0.22, 20, '#fff');
}
function draw() {}
title();
K.run(update, draw);
</script>
