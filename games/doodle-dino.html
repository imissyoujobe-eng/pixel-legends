  c.fillStyle = INK; c.beginPath(); c.ellipse(141, 9.5, 4.6, 5, 0, 0, 7); c.fill(); c.fillStyle = '#ffcf3a'; c.beginPath(); c.ellipse(141, 9.5, 3.7, 4.1, 0, 0, 7); c.fill();
  htext(c, '' + coins, 156, 10, 6.5, '#5a2f1a');
  // boss bar
  if (boss) { const w = 100, x = (VW - w) / 2, y = 24; c.fillStyle = INK; c.beginPath(); c.roundRect(x - 1.5, y - 1.5, w + 3, 8, 3); c.fill(); c.fillStyle = '#4a4070'; c.fillRect(x, y, w, 5); c.fillStyle = boss.ph === 3 ? '#ff4d5e' : boss.ph === 2 ? '#a06ae8' : '#6a5ad6'; c.fillRect(x, y, w * Math.max(0, boss.hp) / 9, 5); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x, y, w * Math.max(0, boss.hp) / 9, 1.5); for (let i = 1; i < 3; i++) { c.fillStyle = INK; c.fillRect(x + w * i / 3 - 0.5, y, 1, 5); } htext(c, 'INK BLOT', VW / 2, y + 11, 5, '#2a1a3a'); }
  // banner messages
  if (msgT > 0 && msg) {
    const a = Math.min(1, msgT * 3), y = 70; c.globalAlpha = a;
    c.save(); c.translate(VW / 2, y); c.rotate(-0.03);
    c.fillStyle = 'rgba(40,20,30,.25)'; c.fillRect(-72, -11, 148, sub ? 30 : 22);
    c.fillStyle = INK; c.fillRect(-75, -14, 150, sub ? 30 : 22); c.fillStyle = '#fff4dc'; c.fillRect(-74, -13, 148, sub ? 28 : 20);
    c.fillStyle = '#ff9a3c'; c.fillRect(-74, -13, 4, sub ? 28 : 20); c.fillStyle = '#26b5a8'; c.fillRect(70, -13, 4, sub ? 28 : 20);
    c.restore();
    htext(c, msg, VW / 2, y - 3, msg.length > 16 ? 7 : 9, '#d0601c');
    if (sub) htext(c, sub, VW / 2, y + 9, 6, '#5a2f1a');
    c.globalAlpha = 1;
  }
  // hint about controls early in chapter 1
  if (lvl === 0 && state === 'play' && p.x < 200 && msgT <= 0) { c.globalAlpha = 0.85; htext(c, 'JUMP · GULP · THROW', VW / 2, VH - 8, 5.5, '#5a2f1a'); c.globalAlpha = 1; }
}

loadLevel(0);
title();
K.run(update, draw);
</script>
