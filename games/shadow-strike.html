<body>
<script src="../lib/kit.js"></script>

<script>
// Shadow Strike: a ninja rescue mission. Throw stars, slash up close, free every hostage, and save your ninja magic for a crowd.
K.theme({ bg: '#0a0a14', ink: '#f0f0ff', accent: '#ff3a4a', accentInk: '#fff' });
// tall portrait view for phones: you see much more above and around the ninja
const VW = 240, VH = 330, T = 16;
// 2.5D: play stays side-to-side, but the world is drawn 1.6x bigger with 3D blocks and buildings that recede into the distance
const Z = 1.6, ZW = VW / Z, ZH = VH / Z, DEPTH = 0.8;
K.screen(VW, VH);
K.hud(['score', 'hostages', 'lives']);
K.pad({ dpad: '4', buttons: [{ id: 'c', label: 'MAGIC' }, { id: 'b', label: 'STAR' }, { id: 'a', label: 'JUMP' }] });
{ const st = document.createElement('style'); st.textContent = '#kp .kj{flex:none;width:112px;height:112px}#kp .kj i{width:50px;height:50px;margin:-25px 0 0 -25px}#kp .big{width:62px;height:62px;font-size:12px}#kp .kb{gap:8px}'; document.head.appendChild(st); }
addEventListener('keydown', e => { if ('cClL'.includes(e.key)) K.press('c'); });
addEventListener('keyup', e => { if ('cClL'.includes(e.key)) K.release('c'); });

const E = '................', G = '################';
const CH = {
  start: [E, E, E, E, E, E, E, E, E, E, E, E, '.S..............', G, G],
  docks: [E, E, E, E, E, E, E, E, '......=====.....', E, E, '..g.........u...', '.......h........', G, G],
  crates: [E, E, E, E, E, E, '.........u......', '........====....', E, '...HH...........', '...HH...........', '..HHH.....s.....', '..HHH.....h.....', G, G],
  roof: [E, E, E, E, E, '.....h..........', '....=====.......', E, '..........j.....', '.........=====..', E, '..g.........g...', E, G, G],
  gap: [E, E, E, E, E, E, E, E, E, '.......u........', '.....====.......', E, E, '###.......######', '###.......######'],
  wall: [E, E, E, E, E, E, E, '..j.............', '.====...........', '.......u........', '......=====..h..', '..s.........HHH.', '............HHH.', G, G],
  exit: [E, E, E, E, E, E, E, E, E, E, E, '..g........E....', '...........E....', G, G],
  boss: ['........................', '........................', '........................', '........................', '........................', '........................', '........................', '........................', '........................', '........................', '........................', '..........K.............', '........................', '########################', '########################'],
};
const STAGES = [
  { n: 'Harbor', sky: ['#0a1a3a', '#3a3a6a'], g: '#3a3a4a', top: '#6a6a7a', chunks: ['start', 'docks', 'crates', 'roof', 'gap', 'docks', 'exit'] },
  { n: 'City Rooftops', sky: ['#1a0a2a', '#8a3a4a'], g: '#4a3a3a', top: '#8a6a5a', chunks: ['start', 'roof', 'wall', 'gap', 'crates', 'roof', 'wall', 'exit'] },
  { n: 'Shadow Temple', sky: ['#0a0a0a', '#4a1a1a'], g: '#3a2a2a', top: '#a03a3a', chunks: ['start', 'wall', 'crates', 'gap', 'roof', 'wall', 'boss'] },
];
let state = 'title', si, w, p, cam, foes, stars, eshots, fx, score, lives, magic, hostages, saved, deadT, msg, msgT, slashT, boss, best = K.best('shadowstrike');
function newGame() { si = 0; score = 0; lives = 5; load(); state = 'play'; }
function title() { K.card({ title: 'SHADOW STRIKE', text: 'Free every hostage (kneeling, in yellow) and reach the exit. STAR throws a shuriken, or slashes when an enemy is close. Shield guards block stars from the front, so jump over them or slash. MAGIC wipes the screen once per stage. One hit costs a life! Keyboard: Z jump, X star, C magic.', best: best ? 'BEST ' + best : '', button: 'Begin Mission', onStart: newGame }); }
function load() {
  const S = STAGES[si]; w = P.world(P.join(S.chunks.map(k => CH[k]))); P.SOLID = '#H'; P.ONEWAY = '=';
  foes = []; stars = []; eshots = []; fx = []; hostages = 0; saved = 0; magic = 1; boss = null; cam = { x: 0, y: 0 }; msg = 'MISSION ' + (si + 1) + ': ' + S.n.toUpperCase(); msgT = 2;
  for (let y = 0; y < w.rows; y++) for (let x = 0; x < w.cols; x++) { const ch = w.g[y][x], X = x * T, Y = y * T; let k = null;
    if (ch === 'S') w.start = { x: X, y: Y };
    else if (ch === 'h') { foes.push({ k: 'host', x: X + 2, y: Y + 4, w: 12, h: 12, alive: true }); hostages++; }
    else if (ch === 'g') foes.push(P.walker(X, Y, { k: 'guard', w: 10, h: 18, vx: -30, hp: 1, smart: true }));
    else if (ch === 'u') foes.push({ k: 'gun', x: X, y: Y - 2, w: 10, h: 18, vx: 0, vy: 0, hp: 1, cd: K.rnd(1, 2.5), alive: true });
    else if (ch === 's') foes.push(P.walker(X, Y, { k: 'shield', w: 12, h: 18, vx: -22, hp: 1, smart: true }));
    else if (ch === 'j') foes.push({ k: 'ninja', x: X, y: Y - 2, w: 10, h: 18, vx: 0, vy: 0, hp: 1, cd: K.rnd(0.5, 1.5), alive: true });
    else if (ch === 'K') { boss = { k: 'boss', x: X, y: Y - 16, w: 22, h: 34, vx: 0, vy: 0, hp: 16, cd: 1.5, alive: true, inv: 0 }; foes.push(boss); }
    else continue;
    if (ch !== 'E') w.g[y][x] = '.'; }
  respawn(true);
}
P.onJump = pl => { if (pl === p) pl.flip = 0.0001; };
function respawn(first) { p = P.player(first ? w.start.x : Math.max(w.start.x, cam.x + 30), first ? w.start.y : 20, { w: 10, h: 18, run: 92, sprint: 120, jump: 360, gravity: 900 }); p.inv = first ? 0 : 2; deadT = 0; slashT = 0; }
function die() { if (p.inv > 0 || deadT > 0) return; deadT = 1.5; lives--; K.beep(400, 0.6, { to: 60, type: 'sawtooth' }); for (let i = 0; i < 16; i++) fx.push({ x: p.x + 5, y: p.y + 8, vx: K.rnd(-80, 80), vy: K.rnd(-120, 0), t: 0.8, c: '#ddd' }); }
function kill(f) { f.alive = false; score += f.k === 'boss' ? 5000 : 200; K.noise(0.15, 0.3); for (let i = 0; i < 8; i++) fx.push({ x: f.x + f.w / 2, y: f.y + 8, vx: K.rnd(-60, 60), vy: K.rnd(-90, 0), t: 0.5, c: '#ff3a4a' }); }
function update(dt) {

    if (deadT <= 0) { if (lives <= 0) { state = 'over'; best = K.saveBest('shadowstrike', score); K.card({ title: 'MISSION FAILED', text: 'You freed ' + saved + ' hostages on mission ' + (si + 1) + '. Score ' + score + '.', best: 'BEST ' + best, button: 'Again', onStart: newGame }); return; } respawn(false); } return; }
  P.control(w, p, dt, { run: false });
  // every jump is a somersault: the ninja tucks into a spinning ball until he lands
  if (p.ground) p.flip = 0; else if (p.flip) p.flip += dt;
  if (p.fell) { p.fell = false; p.inv = 0; die(); return; }
  if (slashT > 0) slashT -= dt;
  if (p.throwT > 0) p.throwT -= dt;
  if (K.hit('b')) {
    const near = foes.find(f => f.alive && f.k !== 'host' && Math.abs(f.y - p.y) < 22 && (f.x - p.x) * p.face > -6 && (f.x - p.x) * p.face < 28);
    if (near) { slashT = 0.18; K.beep(900, 0.06, { to: 200 }); if (near.k === 'boss') { if (near.inv <= 0) { near.hp -= 2; near.inv = 0.3; if (near.hp <= 0) kill(near); } } else kill(near); }
    else if (stars.length < 3) { p.throwT = 0.16; stars.push({ x: p.x + 5, y: p.y + 6, vx: p.face * 260 }); K.beep(1400, 0.04, { to: 800 }); }
  }
  if (K.hit('c') && magic > 0) { magic = 0; K.noise(1, 0.5); K.tune([200, 300, 450, 700], 0.08, { type: 'sawtooth' }); fx.push({ magic: 1, t: 1 }); foes.forEach(f => { if (f.alive && f.k !== 'host' && f.x > cam.x - 10 && f.x < cam.x + ZW + 10) { if (f.k === 'boss') f.hp -= 5; else kill(f); } }); if (boss && boss.hp <= 0 && boss.alive) kill(boss); }
  stars.forEach(s => { s.x += s.vx * dt; if (P.isSolid(P.tile(w, s.x, s.y))) s.dead = true;
    for (const f of foes) { if (!f.alive || f.k === 'host') continue; if (s.x > f.x - 2 && s.x < f.x + f.w + 2 && s.y > f.y && s.y < f.y + f.h) { s.dead = true;
      if (f.k === 'shield' && Math.sign(s.vx) === -Math.sign(f.vx || 1)) { K.beep(2000, 0.03); fx.push({ x: s.x, y: s.y, vx: -s.vx * 0.2, vy: -60, t: 0.3, c: '#ccc' }); }
      else if (f.k === 'boss') { if (f.inv <= 0) { f.hp--; f.inv = 0.2; K.beep(300, 0.05); if (f.hp <= 0) kill(f); } } else kill(f); break; } } });
  stars = stars.filter(s => !s.dead && Math.abs(s.x - p.x) < 340);
  foes.forEach(f => { if (!f.alive) return;
    if (f.k === 'host') { if (P.overlap(p, f)) { f.alive = false; f.freed = 1; saved++; score += 500; K.tune([660, 880, 1100], 0.06); msg = 'HOSTAGE FREED'; msgT = 1; } return; }
    if (f.x < cam.x - 60 || f.x > cam.x + ZW + 60) return;
    if (f.k === 'guard' || f.k === 'shield') { if (f.k === 'guard' && Math.abs(f.x - p.x) < 120 && Math.abs(f.y - p.y) < 20) f.vx = Math.sign(p.x - f.x) * 40; P.stepWalker(w, f, dt); }
    f.anim = (f.anim || 0) + dt;
    if (f.k === 'gun') { f.vy = Math.min(300, f.vy + 800 * dt); P.move(w, f, dt); f.cd -= dt; if (f.cd <= 0 && Math.abs(f.x - p.x) < 220) { f.cd = K.rnd(1.8, 3); eshots.push({ x: f.x + 5, y: f.y + 6, vx: Math.sign(p.x - f.x) * 120, vy: 0 }); K.beep(600, 0.04); } }
    if (f.k === 'ninja') { f.vy = Math.min(300, f.vy + 800 * dt); P.move(w, f, dt); f.cd -= dt; if (f.ground) f.vx = 0; if (f.cd <= 0 && f.ground && Math.abs(f.x - p.x) < 160) { f.vy = -300; f.vx = Math.sign(p.x - f.x) * 90; f.cd = K.rnd(1.2, 2); } }
    if (f.k === 'boss') { if (f.inv > 0) f.inv -= dt; f.vy = Math.min(300, f.vy + 800 * dt); P.move(w, f, dt); f.cd -= dt; if (f.ground) f.vx *= 0.9;
      if (f.cd <= 0) { f.cd = f.hp < 8 ? 1 : 1.6; if (Math.random() < 0.5) { for (let i = -1; i <= 1; i++) eshots.push({ x: f.x + 11, y: f.y + 10, vx: Math.sign(p.x - f.x) * 110, vy: i * 50, fire: 1 }); K.beep(200, 0.2, { to: 400 }); } else { f.vy = -320; f.vx = Math.sign(p.x - f.x) * 110; } } }
    if (p.inv <= 0 && P.overlap(p, f)) die();
  });
  eshots.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; if (P.isSolid(P.tile(w, s.x, s.y))) s.dead = true; if (p.inv <= 0 && s.x > p.x && s.x < p.x + p.w && s.y > p.y && s.y < p.y + p.h) { s.dead = true; die(); } });
  eshots = eshots.filter(s => !s.dead && Math.abs(s.x - p.x) < 360);
  fx.forEach(e => { e.t -= dt; if (!e.magic) { e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 300 * dt; } }); fx = fx.filter(e => e.t > 0);
  const ex = P.touches(w, p, 'E');
  if (ex && saved < hostages && msgT <= 0) { msg = 'RESCUE ALL HOSTAGES (' + saved + '/' + hostages + ')'; msgT = 1.5; }
  const cleared = (ex && saved >= hostages) || (boss && !boss.alive && saved >= hostages);
  if (cleared) { score += 2000 + magic * 1000; K.tune([523, 659, 784, 1046], 0.12); si++;
    if (si >= STAGES.length) { state = 'over'; best = K.saveBest('shadowstrike', score + lives * 1000); K.card({ title: 'MISSION COMPLETE', text: 'Every hostage is safe. Final score ' + (score + lives * 1000) + '.', best: 'BEST ' + best, button: 'Again', onStart: newGame }); return; }
    load(); }
  follow();
  K.set('score', score); K.set('hostages', '☺ ' + saved + '/' + hostages + (magic ? ' ✦' : '')); K.set('lives', '♥'.repeat(Math.max(0, lives)));
}
// camera: the ninja sits about 40% from the left, a little more room ahead of him
function follow() {
  const tx = p.x + p.w / 2 - ZW * 0.4 + p.face * 6;
  cam.x += (tx - cam.x) * 0.12; cam.x = Math.max(0, Math.min(w.px - ZW, cam.x));
  const ty = p.y + p.h - ZH * 0.62; cam.y += (ty - cam.y) * 0.1; cam.y = Math.max(0, Math.min(w.py - ZH, cam.y));
}
// ---- characters, drawn 1.25x their hit boxes with shading ----
const OUTFIT = { me: ['#1a1a3a', '#2a2a5a', '#ff3a4a'], guard: ['#6a4a3a', '#8a6248', '#c8a050'], gun: ['#3a5a3a', '#4e7a4e', '#c8a050'], shield: ['#4a4a6a', '#6a6a8e', '#9aa0b0'], ninja: ['#1e1e22', '#34343a', '#7a2a2a'] };
function ninja(c, x, y, face, t, kind, slash, moving, air) {
  const o = OUTFIT[kind] || OUTFIT.me, st = moving ? Math.sin(t / 60) : 0;
  const SC = kind === 'me' ? 1.4 : 1.25; c.save(); c.translate(x + 5, y + 18); c.scale(SC * face, SC);
  c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(0, 0, 5, 1.2, 0, 0, 7); c.fill();
  const limb = (px, py, len, ang, wd, col) => { c.save(); c.translate(px, py); c.rotate(ang); c.fillStyle = col; c.beginPath(); c.roundRect(-wd / 2, 0, wd, len, wd / 2); c.fill(); c.restore(); };
  // back leg, back arm
  limb(-0.8, -7, 7, air ? 0.7 : -st * 0.7, 2.6, o[0]); limb(-1.6, -13, 5.5, air ? -2 : 0.4 + st * 0.6, 2.2, o[0]);
  // sword on the back
  if (kind === 'me' || kind === 'ninja') { c.save(); c.translate(-2, -12); c.rotate(-0.9); c.fillStyle = '#3a2a1a'; c.fillRect(-0.6, -1, 1.2, 4); c.fillStyle = '#c8ccd8'; c.fillRect(-0.4, -9, 0.8, 8); c.fillStyle = '#c8a050'; c.fillRect(-1.4, -1.4, 2.8, 0.8); c.restore(); }
  // body with sash
  const g = c.createLinearGradient(-3, -15, 3, -7); g.addColorStop(0, o[1]); g.addColorStop(1, o[0]); c.fillStyle = g; c.beginPath(); c.roundRect(-3.2, -15, 6.4, 8.5, 1.8); c.fill();
  c.fillStyle = o[2]; c.fillRect(-3.2, -9, 6.4, 1.6); if (kind === 'me') { c.beginPath(); c.moveTo(-3, -8.6); c.lineTo(-6 - Math.abs(st) * 2, -6.5 + Math.sin(t / 90)); c.lineTo(-5.6, -5.4); c.lineTo(-3, -7.6); c.fill(); }
  c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 0.5; c.beginPath(); c.moveTo(-1, -15); c.lineTo(1.5, -9.2); c.stroke();
  // front leg with wrapped shin
  limb(1, -7, 7, air ? -0.4 : st * 0.7, 2.8, o[1]); c.save(); c.translate(1, -7); c.rotate(air ? -0.4 : st * 0.7); c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(-1.4, 3, 2.8, 0.6); c.fillRect(-1.4, 4.6, 2.8, 0.6); c.fillStyle = '#111'; c.fillRect(-1.6, 6, 3.6, 1.3); c.restore();
  // head: hood with an eye slit and a headband tail
  c.fillStyle = o[1]; c.beginPath(); c.arc(0.6, -17.6, 3, 0, 7); c.fill();
  c.fillStyle = '#e0b088'; c.beginPath(); c.roundRect(0.4, -18.6, 3.4, 1.8, 0.8); c.fill(); c.fillStyle = '#111'; c.fillRect(2.2, -18.2, 0.9, 0.9); c.fillStyle = '#fff'; c.fillRect(2.4, -18.2, 0.3, 0.3);
  c.fillStyle = o[2]; c.fillRect(-2.4, -20, 5.8, 1.1); if (kind === 'me') { c.beginPath(); c.moveTo(-2.4, -19.8); c.lineTo(-6.5 - Math.abs(st) * 2, -21 + Math.sin(t / 70) * 1.2); c.lineTo(-6, -19.4 + Math.sin(t / 70)); c.lineTo(-2.4, -18.9); c.fill(); }
  // front arm, holding a star or slashing
  if (slash) { limb(1.6, -13, 5.5, -1.7, 2.3, o[1]); c.save(); c.translate(7, -12.5); c.rotate(-0.4); c.fillStyle = '#e8ecf4'; c.fillRect(0, -0.6, 11, 1.2); c.restore(); }
  else limb(1.6, -13, 5.5, air ? -2.4 : -0.3 - st * 0.6, 2.3, o[1]);
  if (kind === 'gun') { c.fillStyle = '#222'; c.fillRect(2.5, -11, 8, 1.8); c.fillStyle = '#5a3a1a'; c.fillRect(1, -10.6, 2.5, 2.2); }
  if (kind === 'guard') { c.strokeStyle = '#8a5a2a'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-1, -2); c.lineTo(6, -22); c.stroke(); }
  if (kind === 'shield') { const sg = c.createLinearGradient(4, -18, 8, 0); sg.addColorStop(0, '#d0d6e4'); sg.addColorStop(1, '#6a7080'); c.fillStyle = sg; c.beginPath(); c.roundRect(3.6, -18, 4.2, 16, 1.6); c.fill(); c.fillStyle = '#c8a050'; c.beginPath(); c.arc(5.7, -10, 1.2, 0, 7); c.fill(); }
  c.restore();
  if (slash) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.6; c.beginPath(); c.arc(x + 5 + face * 7, y + 6, 15, face > 0 ? -1.3 : 1.85, face > 0 ? 1.3 : 4.45); c.stroke(); c.strokeStyle = 'rgba(160,200,255,.5)'; c.lineWidth = 3; c.beginPath(); c.arc(x + 5 + face * 7, y + 6, 13, face > 0 ? -1 : 2.1, face > 0 ? 1 : 4.2); c.stroke(); }
}
// the ninja curled up tight in a somersault: knees tucked, arms wrapped, headband tails streaming; ang is the spin angle
// white speed arcs trailing the spin (drawn without an outline)
function spinArcs(c, x, y, face) {
  const cx = x + 5, cy = y + 10;
  // speed arcs trailing the spin
  c.strokeStyle = 'rgba(200,220,255,.35)'; c.lineWidth = 1.4; c.beginPath(); c.arc(cx, cy, 12, face > 0 ? Math.PI * 0.55 : -Math.PI * 0.45, face > 0 ? Math.PI * 1.25 : Math.PI * 0.25); c.stroke();
  c.strokeStyle = 'rgba(200,220,255,.18)'; c.lineWidth = 2.4; c.beginPath(); c.arc(cx, cy, 15, face > 0 ? Math.PI * 0.7 : -Math.PI * 0.3, face > 0 ? Math.PI * 1.1 : Math.PI * 0.1); c.stroke();
}
function ninjaBall(c, x, y, face, t, ang) {
  const o = OUTFIT.me, cx = x + 5, cy = y + 10;
  c.save(); c.translate(cx, cy); c.scale(face * 1.6, 1.6); c.rotate(ang);
  // headband tails flutter out behind the head
  c.fillStyle = o[2]; c.beginPath(); c.moveTo(-1.6, -4.6); c.lineTo(-7, -6.5 + Math.sin(t / 50) * 1.2); c.lineTo(-6.4, -4.4 + Math.sin(t / 50)); c.lineTo(-1.4, -3.4); c.fill();

  c.save(); c.rotate(-2.4); c.fillStyle = '#c8ccd8'; c.fillRect(-0.4, 2, 0.8, 8.5); c.fillStyle = '#3a2a1a'; c.fillRect(-0.6, -1.5, 1.2, 3.5); c.restore();

  const g = c.createRadialGradient(-1.5, -1.5, 0.5, 0, 0, 6); g.addColorStop(0, o[1]); g.addColorStop(1, o[0]);
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, 5.2, 0, 7); c.fill();
  c.fillStyle = o[2]; c.save(); c.rotate(0.9); c.fillRect(-5.2, -0.8, 10.4, 1.6); c.restore();
  // tucked legs: thigh to knee pulled up against the chest, shins folded under with black tabi
  c.fillStyle = o[1]; c.beginPath(); c.roundRect(0.5, -1, 5.6, 3, 1.4); c.fill();
  c.save(); c.translate(5.4, 0.4); c.rotate(2.2); c.beginPath(); c.roundRect(-1.4, 0, 2.8, 5, 1.3); c.fill(); c.fillStyle = '#111'; c.fillRect(-1.6, 3.8, 3.4, 1.5); c.restore();
  // arm hugging the knees
  c.fillStyle = o[1]; c.save(); c.translate(1.6, -2.6); c.rotate(1.1); c.beginPath(); c.roundRect(-1.1, 0, 2.2, 5.2, 1.1); c.fill(); c.fillStyle = '#e0b088'; c.beginPath(); c.arc(0, 5.2, 1, 0, 7); c.fill(); c.restore();
  // head tucked forward: hood, eye slit, headband
  c.fillStyle = o[1]; c.beginPath(); c.arc(1.8, -4.6, 2.9, 0, 7); c.fill();
  c.fillStyle = '#e0b088'; c.beginPath(); c.roundRect(2, -5.6, 2.6, 1.6, 0.7); c.fill(); c.fillStyle = '#111'; c.fillRect(3.4, -5.3, 0.8, 0.8);
  c.fillStyle = o[2]; c.save(); c.translate(1.8, -4.6); c.rotate(-0.5); c.fillRect(-2.9, -2.4, 5.8, 1); c.restore();
  c.restore();
}
