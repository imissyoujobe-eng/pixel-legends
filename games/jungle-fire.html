<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jungle Fire</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/plat.js"></script>
<script src="../lib/art.js"></script>
<script>
// Jungle Fire: run and gun through three stages. Aim in eight directions, grab weapon capsules and take down the fortress wall at the end of each stage.
K.theme({ bg: '#0c140a', ink: '#fffaf0', accent: '#ff5a36', accentInk: '#fff' });
// tall portrait view (ratio ~0.73) for phones held upright
const VW = 240, VH = 330, T = 16;
K.screen(VW, VH);
K.hud(['score', 'gun', 'lives']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'FIRE' }, { id: 'a', label: 'JUMP' }] });

const E = '................', G = '################';
// h = hidden soldier behind cover, g = gas can, K = parked tank
const CH = {
  start: [E, E, E, E, E, E, E, E, E, E, E, E, '.S..............', G, G],
  run: [E, E, E, E, E, E, E, E, E, '.........====...', E, '...s............', '.....h....s.....', G, G],
  ledges: [E, E, E, E, E, E, '..........n.....', '.........====...', E, '....====........', E, E, '.c.....h....s...', G, G],
  water: [E, E, E, E, E, E, E, E, E, E, '....g...........', '...===....===...', '.....s..........', '##~~~~~~~~~~~~##', '##~~~~~~~~~~~~##'],
  bunker: [E, E, E, E, E, E, E, '........HHHH....', '........t..H....', '...........H....', '.......n........', '.....====.......', '..s....h......s.', G, G],
  cliffs: [E, E, E, E, '.......n........', '......HHHH......', E, '...===..........', '...........c....', E, '....===...====..', E, '...h......s.....', G, G],
  depot: [E, E, E, E, E, E, E, E, E, E, '..........====..', E, '..K......h...g..', G, G],
  boss: ['........................', '........................', '........................', '........................', '................HHHHHHHH', '................HHHHHHHH', '................HHHHHHHH', '................HHHHHHHH', '................HHHHHHHH', '................HHHHHHHH', '................HHHHHHHH', '................HHHHHHHH', '..s.............HHHHHHHH', '########################', '########################']
};
const STAGES = [
  { n: 'Jungle', chunks: ['start', 'run', 'ledges', 'depot', 'water', 'run', 'bunker', 'ledges', 'boss'] },
  { n: 'Canyon Base', chunks: ['start', 'cliffs', 'run', 'depot', 'bunker', 'water', 'cliffs', 'bunker', 'boss'] },
  { n: 'Hive', chunks: ['start', 'depot', 'bunker', 'cliffs', 'ledges', 'water', 'depot', 'bunker', 'cliffs', 'run', 'boss'] }
];
const GUNS = { N: { n: 'RIFLE', rate: 0.22, spd: 260 }, R: { n: 'RAPID', rate: 0.09, spd: 300 }, S: { n: 'SPREAD', rate: 0.28, spd: 240 }, L: { n: 'LASER', rate: 0.35, spd: 400 } };
// characters are drawn 1.35x their hit boxes and the camera zooms in 2x on the narrow portrait view, so everyone is over 3x bigger on screen
const SC = 1.35, AIM_ERR = [0.38, 0.26, 0.16];
const ZRUN = 2.0, ZBOSS = 1.4;
let Z = ZRUN, ZW = VW / Z, ZH = VH / Z;
let state = 'title', si, w, p, cam, ents, shots, eshots, fx, caps, cans, tanks, ride, score, lives, gun, deadT, spawnT, boss, winT, msg, msgT, best = K.best('junglefire');
function newGame() { si = 0; score = 0; lives = 5; gun = 'N'; load(); state = 'play'; }
function title() { K.card({ title: 'JUNGLE FIRE', text: 'Hold FIRE to shoot. Hold up or down while firing to aim diagonally or straight up; press down on the ground to lie flat. Watch for helmets peeking out from behind rocks, logs and tall grass. Walk into a parked tank to drive it: FIRE blasts the cannon, JUMP hops, down + JUMP climbs out. Keep an eye on its fuel and armor!', best: best ? 'BEST ' + best : '', button: 'Lock and load', onStart: newGame }); }
function load() {
  const S = STAGES[si];
  w = P.world(P.join(S.chunks.map(k => CH[k])));
  P.SOLID = '#H'; P.ONEWAY = '=';
  ents = []; shots = []; eshots = []; fx = []; caps = []; cans = []; tanks = []; ride = null; Z = ZRUN; ZW = VW / Z; ZH = VH / Z; cam = { x: 0, y: w.py - ZH }; deadT = 0; winT = 0; spawnT = 2; msg = 'STAGE ' + (si + 1) + ': ' + S.n.toUpperCase(); msgT = 1.8;
  for (let y = 0; y < w.rows; y++) for (let x = 0; x < w.cols; x++) {
    const ch = w.g[y][x], X = x * T, Y = y * T;
    if (ch === 'S') { w.start = { x: X, y: Y }; w.g[y][x] = '.'; }
    if (ch === 's') { ents.push(P.walker(X, Y, { kind: 'soldier', h: 16, w: 10, vx: -46, hp: 1, smart: false })); w.g[y][x] = '.'; }
    if (ch === 'n') { ents.push({ kind: 'sniper', x: X, y: Y, w: 10, h: 16, hp: 2, t: K.rnd(0.5, 2), alive: true }); w.g[y][x] = '.'; }
    if (ch === 't') { ents.push({ kind: 'turret', x: X, y: Y, w: 16, h: 16, hp: 5, t: 1, alive: true }); w.g[y][x] = '.'; }
    if (ch === 'h') { ents.push({ kind: 'hider', x: X + 3, y: Y, w: 10, h: 16, hp: 1, alive: true, mode: 'hide', t: K.rnd(1, 2.5), cover: ['rock', 'log', 'grass'][(x * 7 + y + si) % 3], shots: 0 }); w.g[y][x] = '.'; }
    if (ch === 'g') { cans.push({ x: X + 3, y: Y + 4, alive: true }); w.g[y][x] = '.'; }
    if (ch === 'K') { tanks.push({ x: X, y: Y - 4, w: 34, h: 20, vx: 0, vy: 0, face: 1, fuel: 100, armor: 100, mode: 'parked', fireT: 0, burnT: 0, tread: 0 }); w.g[y][x] = '.'; }
    if (ch === 'c') { caps.push({ x: X, y: Y, trig: X - 140, on: false, alive: true, kind: ['R', 'S', 'L', 'S'][(x + si) % 4], ph: 0 }); w.g[y][x] = '.'; }
  }
  const bx = (w.cols - 8) * T; boss = { x: bx, hp: 40 + si * 15, core: { x: bx + 18, y: 7 * T, w: 20, h: 26 }, guns: [{ x: bx + 6, y: 5 * T + 4, t: 1 }, { x: bx + 6, y: 10 * T + 4, t: 1.6 }], open: false, dead: false };
  respawn(true);
}
function respawn(start) { p = P.player(start ? w.start.x : Math.max(cam ? cam.x + 30 : 30, 30), start ? w.start.y : 40, { h: 18, w: 10, run: 80, sprint: 80, autoRun: false, jump: 300 }); p.inv = start ? 0 : 2.5; deadT = 0; ride = null; hud(); }
function hud() { K.set('score', score); K.set('gun', ride ? 'TANK' : GUNS[gun].n); K.set('lives', '♥'.repeat(Math.max(0, lives))); }

function aimDir() {
  const up = K.down('up'), dn = K.down('down'), mv = K.down('left') || K.down('right');
  if (up && !mv) return [0, -1];
  if (up && mv) return [p.face * 0.707, -0.707];
  if (dn && mv && !p.ground) return [p.face * 0.707, 0.707];
  if (dn && !p.ground) return [0, 1];
  return [p.face, 0];
}
// what enemies shoot at: you, or the tank you are driving
function target() { return ride ? { x: ride.x + 17, y: ride.y + 8 } : { x: p.x + 5, y: p.y + 8 }; }
let fireT = 0;
function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  for (const f of fx) { f.l -= dt; if (f.vx != null) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += (f.smoke ? -20 : 200) * dt; } } fx = fx.filter(f => f.l > 0);
  if (deadT > 0) { deadT -= dt; p.vy += 600 * dt; p.y += p.vy * dt; p.x -= 40 * dt; if (deadT <= 0) { lives--; gun = 'N'; hud(); if (lives < 0) return over(); respawn(false); } moveCam(dt); return; }
  if (winT > 0) { winT -= dt; if (winT <= 0) { si++; if (si >= STAGES.length) return victory(); load(); } moveCam(dt); return; }
  if (ride) { driveTank(dt); if (state !== 'play' || deadT > 0) return; }
  else {
    const prone = p.ground && K.down('down') && !K.down('left') && !K.down('right');
    p.h = prone ? 8 : 18; if (prone && !p.wasProne) p.y += 10; if (!prone && p.wasProne) p.y -= 10; p.wasProne = prone; p.prone = prone;
    if (prone) { p.vx = 0; p.vy = Math.min(330, p.vy + 800 * dt); P.move(w, p, dt); }
    else P.control(w, p, dt, { down: false, run: false });
    // keep the screen scrolling forward only, like an arcade shooter
    p.x = Math.max(p.x, cam.x + 2);
    if (p.fell) { p.fell = false; return die(); }
    fireT -= dt;
    if (K.down('b') && fireT <= 0) {
      const g = GUNS[gun], d = prone ? [p.face, 0] : aimDir(), ox = p.x + p.w / 2 + d[0] * 10, oy = p.y + (prone ? 3 : 6) + d[1] * 10;
      const fire = (dx, dy) => shots.push({ x: ox, y: oy, vx: dx * g.spd, vy: dy * g.spd, l: 1.2, laser: gun === 'L', dmg: gun === 'L' ? 3 : 1 });
      if (gun === 'S') { const a = Math.atan2(d[1], d[0]); for (let k = -2; k <= 2; k++) fire(Math.cos(a + k * 0.16), Math.sin(a + k * 0.16)); } else fire(d[0], d[1]);
      fireT = g.rate; K.beep(gun === 'L' ? 1200 : 700, 0.05, { to: 200, vol: 0.03 }); fx.push({ flash: true, x: ox, y: oy, l: 0.05 });
    }
    // climb into a parked tank by walking into it
    for (const tk of tanks) if (tk.mode === 'parked' && P.overlap(p, tk)) { ride = tk; tk.mode = 'driving'; tk.face = p.face; K.tune([220, 330, 440], 0.07, { type: 'square' }); hud(); break; }
    // gas cans top up the most recent tank, or wait for you
  }
  const tg = target();
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.l -= dt; if (s.shell) s.vy += 160 * dt;
    if (P.isSolid(P.tile(w, s.x, s.y)) && !s.laser && (boss.dead || s.x < boss.x)) { if (s.shell) blast(s.x, s.y); s.l = 0; }
    if (!boss.dead && s.x > boss.x + 44) { if (s.shell) blast(s.x, s.y); s.l = 0; }
    if (s.x < cam.x - 10 || s.x > cam.x + ZW + 10 || s.y > w.py) s.l = 0;
    // bullets thud into cover when the soldier behind it is ducked down
    if (s.l > 0 && !s.shell) for (const e of ents) if (e.kind === 'hider' && e.mode !== 'up' && e.cover && P.overlap({ x: s.x - 2, y: s.y - 2, w: 4, h: 4 }, coverBox(e))) { s.l = 0; spark(s.x, s.y); break; }
  }
  // enemy soldiers keep coming from the right
  spawnT -= dt;
  if (spawnT <= 0 && !boss.open) { spawnT = K.rnd(1.2, 2.6) / (1 + si * 0.25); const x = cam.x + ZW + 10; let y = 0; for (let ty = 2; ty < 13; ty++) if (P.isSolid(P.tile(w, x, ty * T)) || P.tile(w, x, ty * T) === '=') { y = (ty - 1) * T; break; } if (y) ents.push(P.walker(x, y, { kind: 'soldier', h: 16, w: 10, vx: -50 - si * 6, hp: 1 })); }
  for (const e of ents) {
    if (!e.alive || e.x > cam.x + ZW + 30) continue;
    // enemies only open fire once they are actually on screen
    const vis = e.x + e.w > cam.x + 2 && e.x < cam.x + ZW - 4 && e.y + e.h > cam.y && e.y < cam.y + ZH;
    if (e.kind === 'soldier') { P.stepWalker(w, e, dt); e.vx = e.vx > 0 ? -Math.abs(e.vx) : e.vx; e.anim = (e.anim || 0) + dt; if (e.x < cam.x - 30) e.alive = false; if (vis && Math.random() < dt * 0.3 * (1 + si * 0.3)) eshot(e.x + 5, e.y + 6, 110); }
    else if (e.kind === 'hider') {
      // hide -> peek (a small tell) -> pop up and shoot -> duck again
      const near = vis && Math.abs(e.x - tg.x) < ZW * 0.9;
      e.t -= dt;
      if (e.mode === 'hide' && e.t <= 0 && near) { e.mode = 'peek'; e.t = 0.75; if (e.cover === 'grass') K.beep(160, 0.08, { type: 'triangle', vol: 0.02 }); }
      else if (e.mode === 'peek' && e.t <= 0) { e.mode = 'up'; e.t = 1.1; e.shots = 1 + (Math.random() < 0.5 ? 1 : 0); e.st = 0.25; }
      else if (e.mode === 'up') { e.st -= dt; if (e.st <= 0 && e.shots > 0) { e.shots--; e.st = 0.4; eshot(e.x + 2, e.y + 5, 125); } if (e.t <= 0) { e.mode = 'hide'; e.t = K.rnd(1.4, 3); } }
      else if (e.mode === 'hide' && e.t <= 0) e.t = 0.5;
    }
    else { e.t -= dt; if (e.t <= 0 && !vis) e.t = 0.4; if (e.t <= 0) { e.t = (e.kind === 'turret' ? 1.4 : 2) / (1 + si * 0.2); eshot(e.x + e.w / 2, e.y + 6, e.kind === 'turret' ? 120 : 140); } }
    const exposed = e.kind !== 'hider' || e.mode === 'up';
    for (const s of shots) if (s.l > 0 && exposed && P.overlap({ x: s.x - 2, y: s.y - 2, w: 4, h: 4 }, hitBox(e))) { if (s.shell) { blast(s.x, s.y); s.l = 0; break; } if (!s.laser) s.l = 0; e.hp -= s.dmg; if (e.hp <= 0) killEnt(e); else K.beep(300, 0.03, { vol: 0.03 }); }
    if (e.alive && exposed && !ride && p.inv <= 0 && P.overlap(p, hitBox(e))) return die();
    // the tank squashes soldiers it drives into
    if (e.alive && ride && e.kind !== 'turret' && e.kind !== 'sniper' && P.overlap(ride, e) && exposed) { killEnt(e); ride.armor -= 4; }
  }
  ents = ents.filter(e => e.alive);
  // weapon capsules fly across when you reach them
  for (const cp of caps) {
    if (!cp.alive) continue;
    if (!cp.on && tg.x > cp.trig) { cp.on = true; cp.x = cam.x - 10; cp.y0 = cam.y + 24; }
    if (cp.on && !cp.drop) { cp.ph += dt * 3; cp.x += 70 * dt; cp.y = cp.y0 + Math.sin(cp.ph) * 14; for (const s of shots) if (s.l > 0 && Math.abs(s.x - cp.x) < 10 && Math.abs(s.y - cp.y) < 8) { s.l = 0; cp.drop = true; cp.vy = -100; K.beep(600, 0.1, { vol: 0.05 }); } if (cp.x > cam.x + ZW + 20) cp.alive = false; }
    if (cp.drop) { cp.vy = Math.min(200, cp.vy + 400 * dt); cp.y += cp.vy * dt; if (P.isSolid(P.tile(w, cp.x, cp.y + 6)) || P.tile(w, cp.x, cp.y + 6) === '=') { cp.y = Math.floor((cp.y + 6) / T) * T - 6; cp.vy = 0; } const bx = ride ? ride : p; if (Math.abs(cp.x - (bx.x + bx.w / 2)) < bx.w / 2 + 7 && Math.abs(cp.y - (bx.y + bx.h / 2)) < 14) { cp.alive = false; gun = cp.kind; hud(); K.tune([523, 784, 1047], 0.06); } }
  }
  // enemy bullets
  for (const b of eshots) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt; if (P.isSolid(P.tile(w, b.x, b.y)) && b.l < 2.8) b.l = 0;
    if (ride && b.l > 0 && P.overlap({ x: b.x - 2, y: b.y - 2, w: 4, h: 4 }, ride)) { b.l = 0; spark(b.x, b.y); if (ride.mode === 'driving') { ride.armor -= 12; K.beep(180, 0.06, { type: 'square', vol: 0.05 }); } continue; }
    if (!ride && p.inv <= 0 && P.overlap({ x: b.x - 2, y: b.y - 2, w: 4, h: 4 }, p)) return die();
  }
  eshots = eshots.filter(b => b.l > 0); shots = shots.filter(s => s.l > 0);
  // boss wall: the camera pulls back so you can see the whole fortress
  if (!boss.open && !boss.dead && tg.x > boss.x - 200) { boss.open = true; msg = 'DESTROY THE CORE!'; msgT = 1.5; }
  if (!boss.dead && boss.open) {
    for (const g of boss.guns) { g.t -= dt; if (g.t <= 0 && g.x - 16 > cam.x + ZW) g.t = 0.3; if (g.t <= 0) { g.t = K.rnd(0.8, 1.6) / (1 + si * 0.2); eshot(g.x, g.y, 130 + si * 15); } }
    if (Math.random() < dt * 0.6) ents.push(P.walker(boss.x - 4, 12 * T, { kind: 'soldier', h: 16, w: 10, vx: -60, hp: 1 }));
    for (const s of shots) if (s.l > 0 && P.overlap({ x: s.x - 2, y: s.y - 2, w: 4, h: 4 }, boss.core)) { if (s.shell) { blast(s.x, s.y); s.l = 0; continue; } if (!s.laser) s.l = 0; hitBoss(s.dmg); }
    if (boss.hit > 0) boss.hit -= dt;
  }
  moveCam(dt);
}
function hitBoss(n) { if (boss.dead) return; boss.hp -= n; boss.hit = 0.06; K.beep(200, 0.03, { vol: 0.04 }); if (boss.hp <= 0) { boss.dead = true; score += 5000; hud(); for (let i = 0; i < 6; i++) setTimeout(() => boom(boss.x + K.rnd(0, 120), K.rnd(60, 200), 20), i * 150); winT = 3; msg = 'STAGE CLEAR!'; msgT = 3; K.tune([392, 523, 659, 784, 1047], 0.12); } }
function killEnt(e) { e.alive = false; score += e.kind === 'turret' ? 500 : e.kind === 'sniper' ? 300 : e.kind === 'hider' ? 250 : 100; hud(); boom(e.x + e.w / 2, e.y + e.h / 2, 10); if (Math.random() < 0.04) cans.push({ x: e.x, y: e.y + 4, alive: true, vy: -80 }); }
// a hider is only shootable from the chest up while popped out of cover
function hitBox(e) { return e.kind === 'hider' ? { x: e.x, y: e.y - 2, w: 10, h: 12 } : e; }
function coverBox(e) { return e.cover === 'grass' ? { x: e.x - 6, y: e.y + 2, w: 22, h: 14 } : e.cover === 'log' ? { x: e.x - 8, y: e.y + 6, w: 26, h: 10 } : { x: e.x - 6, y: e.y + 3, w: 22, h: 13 }; }

// ---- the tank ----
function driveTank(dt) {
  const tk = ride;
  tk.fireT -= dt;
  if (tk.mode === 'burning') {
    // on fire and stalled: a few seconds to jump out before it blows
    tk.burnT -= dt; tk.vx *= 0.9;
    if (Math.random() < 0.6) fx.push({ smoke: true, x: tk.x + K.rnd(6, 28), y: tk.y + K.rnd(0, 6), vx: K.rnd(-10, 10), vy: K.rnd(-40, -20), l: 1 });
    if (K.hit('a')) { ejectTank(true); return; }
    if (tk.burnT <= 0) { tk.mode = 'dead'; boom(tk.x + 17, tk.y + 10, 30); K.noise(0.8, 0.5); ride = null; p.x = tk.x + 12; p.y = tk.y; p.inv = 0; die(); return; }
  } else {
    const dir = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0);
    if (dir) { tk.face = dir; tk.vx += dir * 260 * dt; } else tk.vx *= Math.pow(0.02, dt);
    tk.vx = K.clamp(tk.vx, -75, 75);
    if (K.hit('a') && K.down('down')) { ejectTank(false); return; }
    if (K.hit('a') && tk.ground) { tk.vy = -270; K.beep(120, 0.12, { type: 'square', to: 220, vol: 0.05 }); }
    // cannon: forward, or 45 degrees up while holding up
    if (K.down('b') && tk.fireT <= 0) {
      const up = K.down('up'), a = up ? (tk.face > 0 ? -Math.PI / 4 : -Math.PI * 3 / 4) : (tk.face > 0 ? -0.04 : Math.PI + 0.04), bx = tk.x + 17 + Math.cos(a) * 18, by = tk.y + 4 + Math.sin(a) * 18;
      shots.push({ x: bx, y: by, vx: Math.cos(a) * 280, vy: Math.sin(a) * 280, l: 1.6, shell: true, dmg: 3 });
      tk.fireT = 0.55; tk.recoil = 0.12; tk.vx -= tk.face * 20; K.noise(0.25, 0.3); K.beep(90, 0.2, { type: 'sawtooth', vol: 0.06 });
      for (let i = 0; i < 6; i++) fx.push({ smoke: true, x: bx, y: by, vx: Math.cos(a) * 40 + K.rnd(-15, 15), vy: Math.sin(a) * 40 + K.rnd(-15, 15), l: 0.5 });
    }
    tk.fuel -= dt * (Math.abs(tk.vx) > 5 ? 3.6 : 1.4);
    if (tk.fuel <= 0) { tk.fuel = 0; ejectTank(false, true); return; }
    if (tk.armor <= 0) { tk.armor = 0; tk.mode = 'burning'; tk.burnT = 2.8; K.noise(0.5, 0.35); K.beep(70, 0.6, { type: 'sawtooth', to: 40, vol: 0.06 }); }
  }
  if (tk.recoil > 0) tk.recoil -= dt;
  tk.vy = Math.min(330, tk.vy + 820 * dt);
  // the tank fords water, so treat it as solid ground while it moves
  P.SOLID = '#H~'; P.move(w, tk, dt); P.SOLID = '#H';
  tk.x = Math.max(tk.x, cam.x + 2); tk.tread += tk.vx * dt;
  if (tk.y > w.py + 20) { ride = null; die(); return; }
  p.x = tk.x + 12; p.y = tk.y - 4; p.face = tk.face; p.vx = tk.vx; p.vy = 0;
  // drive over gas cans to refill
  for (const cn of cans) if (cn.alive && P.overlap(tk, { x: cn.x, y: cn.y, w: 10, h: 12 })) { cn.alive = false; tk.fuel = Math.min(100, tk.fuel + 55); K.tune([440, 660, 880], 0.06); }
}
function ejectTank(burning, empty) {
  const tk = ride; ride = null; tk.mode = empty ? 'empty' : burning ? 'burning' : 'parked';
  if (burning) { tk.mode = 'abandoned'; tk.burnT = 1; setTimeout(() => { boom(tk.x + 17, tk.y + 10, 28); K.noise(0.6, 0.4); tk.mode = 'dead'; }, 900); }
  p.x = tk.x + 12; p.y = tk.y - 20; p.vy = -220; p.vx = -tk.face * 40; p.inv = burning ? 1.2 : 0.4; p.ground = false; p.h = 18;
