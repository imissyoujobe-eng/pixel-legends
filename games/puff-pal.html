// ---------- state ----------
let state = 'title', li = 0, w, p, cam = { x: 0, y: 0, look: 16 }, ents = [], items = [], pshots = [], eshots = [], fx = [], cps = [], door = null, boss = null, roots = [];
let score = 0, lives = 3, best = K.best('puffpal'), msg = '', msgT = 0, deadT = 0, doorT = 0, gt = 0, shake = 0, checkpoint = null, layers = null, sndT = 0;

function hud() { K.set('score', '★ ' + score); K.set('level', li < 3 ? 'LEVEL ' + (li + 1) : 'BOSS'); K.set('lives', '♥ ' + Math.max(0, lives)); }
function title() {
  K.card({ title: 'PUFF PAL', text: 'Walk and JUMP; tap JUMP again in the air to puff up and float. Hold INHALE to suck in a critter, then press INHALE to spit it as a star or COPY to steal its power (COPY again drops it). Cross 3 lands and topple Old Grumbark!', best: best ? 'BEST ' + best : '', button: 'Play', onStart: newGame });
}
function newGame() { score = 0; lives = 3; loadLevel(0, null); state = 'play'; hud(); }

function loadLevel(i, power) {
  li = i; const L = LEVELS[i];
  P.SOLID = '#B'; P.ONEWAY = '=';
  w = P.world(P.join(L.chunks.map(k => norm(CH[k]))));
  ents = []; items = []; pshots = []; eshots = []; fx = []; cps = []; door = null; boss = null; roots = [];
  let start = { x: 40, y: 200 };
  for (let y = 0; y < w.rows; y++) for (let x = 0; x < w.cols; x++) {
    const ch = w.g[y][x], X = x * T, Y = y * T;
    if (ch === 'P') start = { x: X - 1, y: Y + 16 - 22 };
    else if (ch === 'c') cps.push({ x: X + 8, y: Y + 16, lit: false });
    else if (ch === 'G') door = { x: X - 4, y: Y + 16 };
    else if (ch === 'f') items.push({ type: 'food', x: X + 2, y: Y + 3, w: 12, h: 12, ph: Math.random() * 6 });
    else if (ch === '*') items.push({ type: 'bit', x: X + 4, y: Y + 4, w: 8, h: 8, ph: Math.random() * 6 });
    else if (EDEF[ch]) ents.push(makeEnemy(ch, X, Y));
    else continue;
    w.g[y][x] = '.';
  }
  checkpoint = start;
  if (L.boss) boss = makeBoss();
  spawnPlayer(power);
  cam.x = K.clamp(p.x - VW * 0.4, 0, w.px - VW); cam.y = K.clamp(p.y - VH * 0.55, 0, w.py - VH); cam.look = 16;
  msg = L.name; msgT = 2.4; deadT = 0; doorT = 0;
  layers = getLayers(L.th);
  hud();
}
function makeEnemy(ch, X, Y) {
  const d = EDEF[ch];
  return Object.assign({}, d, { x: X + (16 - d.w) / 2, y: Y + 16 - d.h, y0: Y + 16 - d.h, x0: X, vx: 0, vy: 0, dir: -1, flash: 0, cd: 1 + Math.random() * 1.5, ph: Math.random() * 6, anim: 0, tick: 0, sucked: 0, lunge: 0, zap: 0, hopT: 1, dead: false, slashId: -1 });
}
function spawnPlayer(power) {
  p = { x: checkpoint.x, y: checkpoint.y - 4, w: 18, h: 22, vx: 0, vy: 0, face: 1, ground: false, coyote: 0, jumping: false, floating: false, inhaling: false, full: null, power: power || null,
    hp: 6, inv: 1.2, sx: 1, sy: 1, blink: 2, blinkT: 0, atk: null, slashT: 0, slashId: 0, spin: false, fireCd: 0, transformT: 0, anim: 0, hurtT: 0, puffT: 0, inhT: 0, swallowT: 0 };
}

// ---------- player ----------
function mouth() { return { x: p.x + p.w / 2 + p.face * 10, y: p.y + p.h - 13 }; }
function updPlayer(dt) {
  const aHit = K.hit('a'), aDown = K.down('a'), bHit = K.hit('b'), bDown = K.down('b'), xHit = K.hit('x');
  let dir = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0);
  p.blink -= dt; if (p.blink < 0) { p.blinkT = 0.13; p.blink = 2 + Math.random() * 2.5; } p.blinkT -= dt;
  if (p.puffT > 0) p.puffT -= dt; if (p.hurtT > 0) p.hurtT -= dt; if (p.swallowT > 0) p.swallowT -= dt;
  if (p.inv > 0) p.inv -= dt;
  if (p.transformT > 0) { p.transformT -= dt; p.vx = 0; p.vy = 0; if (Math.random() < 0.6) fx.push({ k: 'sp', x: p.x + p.w / 2 + K.rnd(-16, 16), y: p.y + K.rnd(-10, 20), vx: 0, vy: -20, l: 0.5, m: 0.5, col: POW[p.power].hi }); return; }
  p.inhaling = false; p.atk = null;
  if (p.hurtT > 0.15) { /* stunned */ }
  else if (p.floating) { if (bHit || xHit) exhale(); }
  else if (p.full) { if (bHit) spitStar(); else if (xHit) swallow(); }
  else if (p.power) { if (xHit) dropPower(); else powerAttack(dt, bHit, bDown); }
  else if (bDown) p.inhaling = true;
  if (p.slashT > 0) { p.slashT -= dt; p.atk = 'blade'; }
  const locked = p.inhaling || ((p.atk === 'fire' || p.atk === 'frost') && p.ground) || (p.atk === 'blade' && p.ground && !p.spin);
  if (locked || p.hurtT > 0.15) dir = 0;
  if (dir && !p.inhaling && !(p.atk === 'fire' || p.atk === 'frost')) p.face = dir;
  const top = p.floating ? 58 : p.full ? 54 : p.atk === 'spark' ? 34 : 78;
  if (dir) { p.vx += dir * (p.ground ? 640 : 440) * dt * (Math.sign(p.vx) !== dir ? 1.8 : 1); if (Math.abs(p.vx) > top) p.vx = Math.sign(p.vx) * top; }
  else { const d = (p.ground ? 720 : 220) * dt; p.vx = Math.abs(p.vx) <= d ? 0 : p.vx - Math.sign(p.vx) * d; }
  p.coyote = p.ground ? 0.1 : p.coyote - dt;
  if (aHit && p.hurtT <= 0.15) {
    if (!p.floating && p.coyote > 0) { p.vy = -294; p.jumping = true; p.coyote = 0; p.sx = 0.78; p.sy = 1.25; S.jump(); dust(p.x + p.w / 2, p.y + p.h, 4); }
    else if (!p.full && !p.inhaling && !p.atk) {
      if (!p.floating) { p.floating = true; p.sx = 1.25; p.sy = 0.85; }
      p.vy = -140; p.jumping = false; p.puffT = 0.2; S.puff();
      for (let k = 0; k < 3; k++) fx.push({ k: 'p', x: p.x + p.w / 2 - p.face * 10, y: p.y + p.h - 4, vx: -p.face * K.rnd(10, 40), vy: K.rnd(10, 40), l: 0.4, m: 0.4, r: 2.5 });
    }
  }
  if (p.jumping && !aDown && p.vy < 0) { p.vy *= 0.5; p.jumping = false; }
  if (p.floating) p.vy = Math.min(40, p.vy + 520 * dt);
  else if (p.atk === 'fire' || p.atk === 'frost' || p.inhaling) p.vy = Math.min(p.ground ? 300 : 90, p.vy + 700 * dt);
  else p.vy = Math.min(300, p.vy + 780 * dt * (p.vy > 0 ? 1.12 : 1));
  const wasG = p.ground, vy0 = p.vy;
  P.move(w, p, dt);
  if (p.ground) { p.jumping = false; if (!wasG && vy0 > 110) { p.sx = 1.3; p.sy = 0.74; dust(p.x + p.w / 2, p.y + p.h, 5); K.beep(140, 0.05, { vol: 0.03 }); } }
  if (boss && !boss.dead && p.x + p.w > boss.x + 8) { p.x = boss.x + 8 - p.w; if (p.vx > 0) p.vx = 0; }
  p.sx += (1 - p.sx) * Math.min(1, dt * 11); p.sy += (1 - p.sy) * Math.min(1, dt * 11);
  p.anim += Math.abs(p.vx) * dt;
  if (P.touches(w, p, '^')) { hurtPlayer(1, -p.face); p.vy = -250; }
  if (p.y > w.py + 24) return fallPit();
  if (p.inhaling) doInhale(dt); else p.inhT = 0;
  if (p.atk === 'fire' || p.atk === 'frost') { sndT -= dt; if (sndT <= 0) { sndT = 0.12; K.noise(0.12, p.atk === 'fire' ? 0.06 : 0.04); } }
  if (p.atk === 'spark') { sndT -= dt; if (sndT <= 0) { sndT = 0.09; K.beep(K.rnd(900, 1800), 0.04, { type: 'sawtooth', vol: 0.015 }); } }
  // checkpoints, door, items
  for (const c of cps) if (!c.lit && Math.abs(p.x + p.w / 2 - c.x) < 10 && Math.abs(p.y + p.h - c.y) < 30) { c.lit = true; checkpoint = { x: c.x - 9, y: c.y - 22 }; msg = 'CHECKPOINT'; msgT = 1.2; K.tune([784, 988, 1175], 0.07, { type: 'triangle', vol: 0.05 }); for (let k = 0; k < 10; k++) fx.push({ k: 'sp', x: c.x, y: c.y - 26, vx: K.rnd(-40, 40), vy: K.rnd(-50, 10), l: 0.6, m: 0.6, col: '#a8ffd8' }); }
  if (door && doorT <= 0 && P.overlap(p, { x: door.x + 4, y: door.y - 30, w: 16, h: 30 })) { doorT = 1.2; p.vx = 0; p.floating = false; score += 1000; hud(); K.tune([523, 659, 784, 1047, 784, 1047, 1319], 0.09, { type: 'triangle', vol: 0.06 }); }
}
function doInhale(dt) {
  const m = mouth(); p.inhT += dt;
  sndT -= dt; if (sndT <= 0) { sndT = 0.11; K.noise(0.1, 0.035); }
  for (let k = 0; k < 2; k++) { const d = K.rnd(18, 64); fx.push({ k: 'wind', x: m.x + p.face * d, y: m.y + K.rnd(-1, 1) * (12 + d * 0.3), tx: m.x, ty: m.y, l: 0.3, m: 0.3 }); }
  const targets = ents.filter(e => !e.dead && e.kind !== 'boss').concat(items.filter(i => i.type === 'pstar' && !i.dead));
  for (const e of targets) {
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2, dx = (cx - m.x) * p.face, dy = cy - m.y;
    if (dx > -8 && dx < 66 && Math.abs(dy) < 16 + Math.max(0, dx) * 0.3) {
      e.sucked = 0.12; const d = Math.hypot(cx - m.x, cy - m.y) || 1, pull = 60 + (70 - Math.max(0, dx)) * 3.2;
      e.x -= (cx - m.x) / d * pull * dt; e.y -= (cy - m.y) / d * pull * dt;
      if (d < 11) capture(e);
    }
  }
}
function capture(e) {
  e.dead = true;
  if (e.type === 'pstar') p.full = { kind: 'pstar', power: e.power };
  else p.full = { kind: e.kind, power: e.kind === 'ice' ? e.frozen.power : e.power };
  p.inhaling = false; p.sx = 1.3; p.sy = 0.82; p.swallowT = 0.25; S.gulp();
}
function spitStar() {
  const m = mouth();
  pshots.push({ t: 'star', x: m.x - 5 + p.face * 4, y: m.y - 6, w: 11, h: 11, vx: p.face * 235, vy: 0, l: 0.9, rot: 0 });
  p.full = null; p.vx = -p.face * 50; p.sx = 0.8; p.sy = 1.15; S.spit();
}
function swallow() {

    else if (s.t === 'fire') { const k = 1 - s.l / s.m, r = 3 + k * 5; c.save(); c.globalCompositeOperation = 'lighter'; const g = c.createRadialGradient(x + 4, y + 4, 0, x + 4, y + 4, r); g.addColorStop(0, k < 0.3 ? 'rgba(255,255,200,.95)' : 'rgba(255,200,80,.9)'); g.addColorStop(0.5, 'rgba(255,110,30,' + (0.8 - k * 0.5) + ')'); g.addColorStop(1, 'rgba(220,40,20,0)'); c.fillStyle = g; c.beginPath(); c.arc(x + 4, y + 4, r, 0, TAU); c.fill(); c.restore(); }
    else if (s.t === 'frost') { const k = 1 - s.l / s.m, r = 2 + k * 4; c.fillStyle = 'rgba(200,240,255,' + (0.8 - k * 0.6) + ')'; c.beginPath(); c.arc(x + 4, y + 4, r, 0, TAU); c.fill(); c.strokeStyle = 'rgba(255,255,255,' + (1 - k) + ')'; c.lineWidth = 0.6; c.save(); c.translate(x + 4, y + 4); c.rotate(s.seed * 6 + k * 3); for (let q = 0; q < 3; q++) { c.rotate(Math.PI / 3); c.beginPath(); c.moveTo(-2.5, 0); c.lineTo(2.5, 0); c.stroke(); } c.restore(); }
  }
  for (const s of eshots) {
    const x = s.x - cam.x, y = s.y - cam.y;
    if (s.t === 'ember') { A.glow(c, x + 3, y + 3, 9, '255,120,40', 0.5); ballG(c, x + 3, y + 3, 2.6, '#fff6a0', '#ff8a2a', '#c0301a'); }
    else if (s.t === 'frostp') { c.fillStyle = 'rgba(220,245,255,.8)'; c.beginPath(); c.arc(x + 3.5, y + 3.5, 3 + (0.75 - s.l) * 3, 0, TAU); c.fill(); c.strokeStyle = 'rgba(120,190,255,.9)'; c.lineWidth = 0.6; c.stroke(); }
    else if (s.t === 'wind') { c.save(); c.translate(x + 7, y + 6); c.strokeStyle = INK; c.lineWidth = 2.6; c.lineCap = 'round'; const sp = ts * 12; for (const pass of [[INK, 2.6], ['#e8f8ff', 1.4]]) { c.strokeStyle = pass[0]; c.lineWidth = pass[1]; c.beginPath(); for (let a = 0; a < 9; a += 0.4) c.lineTo(Math.cos(a + sp) * a * 0.75, Math.sin(a + sp) * a * 0.6); c.stroke(); } c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1; for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(6 + k * 3, -4 + k * 4); c.lineTo(14 + k * 3, -4 + k * 4); c.stroke(); } c.restore(); }
  }
}
function drawFx(c) {
  for (const f of fx) {
    const x = f.x - cam.x, y = f.y - cam.y, a = Math.max(0, Math.min(1, f.l / f.m));
    if (f.k === 'p') { c.fillStyle = 'rgba(255,255,255,' + a * 0.85 + ')'; c.beginPath(); c.arc(x, y, (f.r || 2) * (1.6 - a * 0.6), 0, TAU); c.fill(); }
    else if (f.k === 'sp') { c.fillStyle = f.col || '#fff'; c.globalAlpha = a; star(c, x, y, 2.4 * a + 0.6, 1, 0); c.fill(); c.globalAlpha = 1; }
    else if (f.k === 'star') { c.globalAlpha = a; star(c, x, y, 3.2, 1.4, f.l * 10); c.fillStyle = f.col; c.fill(); c.globalAlpha = 1; }
    else if (f.k === 'txt') K.text(c, f.s, x, y, 7, f.col || '#fff27a');
    else if (f.k === 'wind') { const dx = f.tx - f.x, dy = f.ty - f.y, d = Math.hypot(dx, dy) || 1; c.strokeStyle = 'rgba(255,255,255,' + Math.min(0.9, a * 1.5) + ')'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y); c.lineTo(x - dx / d * 9, y - dy / d * 9); c.stroke(); }
    else if (f.k === 'shard') { c.save(); c.translate(x, y); c.rotate(f.rot + f.l * 8); c.fillStyle = 'rgba(200,240,255,' + a + ')'; c.beginPath(); c.moveTo(0, -3); c.lineTo(2, 2); c.lineTo(-2, 2); c.fill(); c.restore(); }
    else if (f.k === 'leaf') { c.save(); c.translate(x, y); c.rotate(f.rot); c.fillStyle = 'rgba(240,140,50,' + a + ')'; c.beginPath(); c.ellipse(0, 0, 3, 1.5, 0, 0, TAU); c.fill(); c.restore(); }
  }
}
function drawHUD(c, t) {
  const ts = t / 1000;
  // health puffs
  c.fillStyle = 'rgba(30,16,60,.45)'; rr(c, 3, 3, 70, 13, 6); c.fill();
  for (let i = 0; i < 6; i++) {
    const x = 10 + i * 11, y = 9.5, on = p && i < p.hp, bob = on && p.hp <= 2 ? Math.sin(ts * 10 + i) * 0.8 : 0;
    if (on) { ballG(c, x, y + bob, 4.2, '#e8fff6', '#8ee6c6', '#a48cec'); c.fillStyle = '#1a2244'; c.fillRect(x - 0.4, y - 1 + bob, 0.9, 1.6); c.fillRect(x + 1.6, y - 1 + bob, 0.9, 1.6); }
    else { c.fillStyle = INK; c.beginPath(); c.arc(x, y, 4.4, 0, TAU); c.fill(); c.fillStyle = '#4a3a6a'; c.beginPath(); c.arc(x, y, 3.6, 0, TAU); c.fill(); }
  }
  // power badge
  if (p) {
    const bx = VW - 15, by = 15, pw = p.power;
    c.fillStyle = INK; c.beginPath(); c.arc(bx, by, 12, 0, TAU); c.fill();
    const g = c.createRadialGradient(bx - 3, by - 4, 1, bx, by, 11); g.addColorStop(0, '#ffffff'); g.addColorStop(1, pw ? POW[pw].col : '#b8a8e0'); c.fillStyle = g; c.beginPath(); c.arc(bx, by, 11, 0, TAU); c.fill();
    if (pw) { c.strokeStyle = POW[pw].hi; c.lineWidth = 1; c.beginPath(); c.arc(bx, by, 9.6, ts * 3, ts * 3 + 4); c.stroke(); }
    drawIcon(c, pw, bx, by, 0.95, t);
    K.text(c, pw ? POW[pw].name : 'NORMAL', bx - 1, by + 17, 6, pw ? POW[pw].hi : '#e8dcff');
    let hint = '';
    if (p.full) hint = p.full.power ? 'INHALE: SPIT STAR · COPY: GET ' + POW[p.full.power].name : 'INHALE: SPIT STAR · COPY: GULP';
    else if (p.floating) hint = 'INHALE: STOP & PUFF';
    else if (pw) hint = POW[pw].act + ' · COPY: DROP';
    if (hint && deadT <= 0) { c.font = '6px Bungee, Impact, sans-serif'; const tw = Math.min(VW - 8, c.measureText(hint).width + 10); c.fillStyle = 'rgba(30,16,60,.55)'; rr(c, VW / 2 - tw / 2, VH - (boss ? 26 : 14), tw, 10, 5); c.fill(); K.text(c, hint, VW / 2, VH - (boss ? 21 : 9), 5.5, p.full ? '#fff27a' : '#e8fff6'); }
  }
  if (boss) {
    const bw = 104, bx = VW / 2 - bw / 2, by = VH - 12, k = boss.hp / boss.max;
    c.fillStyle = INK; rr(c, bx - 1, by - 1, bw + 2, 9, 4); c.fill(); c.fillStyle = '#3a1a2a'; rr(c, bx, by, bw, 7, 3.5); c.fill();
    if (k > 0) { const g = c.createLinearGradient(0, by, 0, by + 7); g.addColorStop(0, '#ffb06a'); g.addColorStop(1, '#d0402a'); c.fillStyle = g; rr(c, bx, by, Math.max(7, bw * k), 7, 3.5); c.fill(); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(bx + 3, by + 1, Math.max(0, bw * k - 6), 1.4); }
    K.text(c, 'OLD GRUMBARK', VW / 2, by + 3.6, 5, '#fff');
  }
  if (msgT > 0) {
    const a = Math.min(1, msgT * 2), y = 58;
    c.globalAlpha = a; c.fillStyle = 'rgba(40,20,80,.55)'; rr(c, 14, y - 11, VW - 28, 22, 11); c.fill(); c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 0.8; c.stroke();
    K.text(c, msg, VW / 2, y, msg.length > 12 ? 9 : 12, '#fff6c0'); c.globalAlpha = 1;
  }
}

// ---------- main draw ----------
function draw(c, t) {
  if (!w) return;
  const th = LEVELS[li].th, TH = THEMES[th];
  c.save();
  if (shake > 0) c.translate(K.rnd(-2, 2), K.rnd(-2, 2));
  A.sky(c, VW, VH, TH.sky, t);
  drawLayer(c, layers.far, 0.08, 0.12, t);
  drawLayer(c, layers.mid, 0.22, 0.28, t);
  drawLayer(c, layers.near, 0.45, 0.5, t);
  drawTiles(c);
  drawItems(c, t);
  if (boss) drawBoss(c, t);
  for (const e of ents) drawEnemy(c, e, t);
  drawShots(c, t);
  drawPlayer(c, t);
  drawFx(c);
  A.ambient(c, VW, VH, t, TH.amb, 14);
  A.vignette(c, VW, VH, 0.28);
  c.restore();
  if (state === 'play') drawHUD(c, t);
}

loadLevel(0, null);
title();
K.run(update, draw);
</script>
