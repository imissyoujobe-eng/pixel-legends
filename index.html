<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1626">
<title>Nine-10-Doe Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#0d1626; --panel:#16223f; --line:#26365e; --ink:#f3f0ff; --muted:#b4acd8;
  --shooter:#ff4f6d; --racing:#ffb02e; --sports:#2fd6a3; --arcade:#46a8ff; --puzzle:#c07bff;--pop:#ff7ad8;
  --display:'Bungee',Impact,system-ui,sans-serif; --body:'Rubik',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{padding:28px 16px 8px;max-width:1100px;margin:0 auto}
h1{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(34px,9vw,60px);line-height:1;letter-spacing:.01em}
h1 .n{color:var(--racing)}
.sub{margin:8px 0 0;color:var(--muted);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--display);font-size:13px;padding:10px 16px;min-height:44px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.tile:focus-visible,.close:focus-visible{outline:3px solid var(--racing);outline-offset:3px}
main{max-width:1100px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-align:left;min-height:150px;padding:14px;border-radius:18px;border:0;background:var(--panel);color:var(--ink);cursor:pointer;overflow:hidden;font:inherit}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:58%;background:var(--c);opacity:.9;clip-path:polygon(0 0,100% 0,100% 72%,0 100%)}
.tile .num{position:absolute;top:10px;right:12px;font-family:var(--display);font-size:13px;color:#0d1626;opacity:.75}
.tile .g{position:absolute;top:12px;left:14px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#120d26}
.tile .name{position:relative;font-family:var(--display);font-size:17px;line-height:1.1}
.tile .tag{position:relative;font-size:12.5px;line-height:1.3;color:var(--muted)}
.tile:active{transform:scale(.97)}
.tile.soon{cursor:default;background:transparent;border:2px dashed var(--line)}
.tile.soon::before{display:none}
.tile.soon .num{color:var(--muted)}
.tile.soon .name{color:var(--muted);font-size:15px}
.count{max-width:1100px;margin:0 auto;padding:0 16px 10px;color:var(--muted);font-size:13px}
#player{position:fixed;inset:0;background:#000;z-index:10;display:none}
#player.on{display:block}
#player iframe{width:100%;height:100%;border:0;display:block}
.close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(18,13,38,.55);color:#fff;font-family:var(--display);font-size:12px;cursor:pointer;opacity:.75;backdrop-filter:blur(4px)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 28px}
footer a{color:var(--muted)}
@media (orientation:landscape) and (max-height:560px){.close{left:calc(env(safe-area-inset-left,0px) + 12px);transform:none}}
/* My Scores: records kept on this phone */
.mys{margin-top:14px;font-family:var(--display);font-size:15px;padding:10px 18px;min-height:44px;border-radius:999px;border:0;background:var(--racing);color:#1a1200;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.mys:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#scores{position:fixed;inset:0;z-index:9;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#scores[hidden]{display:none}
.sc-in{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.sc-back{font-family:var(--display);font-size:13px;min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
#scores h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,9vw,52px);margin:18px 0 0;line-height:1}
#scores h2 .n{color:var(--racing)}
.sc-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.sc-sum div{background:var(--panel);border-radius:16px;padding:12px 12px 10px;min-width:0}
.sc-sum b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(17px,5.4vw,26px);line-height:1.15;overflow-wrap:anywhere}
.sc-sum span{color:var(--muted);font-size:12px}
.sc-h{font-family:var(--display);font-size:13px;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
.sc-row{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:0;border-radius:14px;padding:12px 14px 12px 0;margin:0 0 8px;color:var(--ink);cursor:pointer;font:inherit;overflow:hidden}
.sc-row i{align-self:stretch;background:var(--c);border-radius:0 4px 4px 0}
.sc-row .nm{display:block;font-family:var(--display);font-size:16px;line-height:1.15}
.sc-row .mt{display:block;color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.35}
.sc-row .bs{text-align:right;font-family:var(--display);font-size:19px;line-height:1.1;white-space:nowrap}
.sc-row .bs small{display:block;font-family:var(--body);font-size:10.5px;color:var(--muted);letter-spacing:.1em;font-weight:800;margin-bottom:2px}
.sc-row.none{background:transparent;border:2px dashed var(--line);padding:10px 12px 10px 0}
.sc-row.none .bs{color:var(--muted);font-size:14px}
.sc-row:active{transform:scale(.985)}
.sc-row:focus-visible,.sc-back:focus-visible,.mys:focus-visible{outline:3px solid var(--racing);outline-offset:3px}
.sc-empty{background:var(--panel);border-radius:16px;padding:20px;color:var(--muted);text-align:center;line-height:1.5;margin-top:18px}
</style>
</head>
<body>
<header>
  <h1>Nine-10-Doe <span class="n">Arcade</span></h1>
  <p class="sub">Big adventures in your pocket: platformers, quests, racers, sports and action. Tap a game to play.</p>
  <button class="mys" id="mys" type="button">★ My Scores</button>
</header>
<nav class="chips" id="chips" aria-label="Filter games"></nav>
<p class="count" id="count"></p>
<main id="grid"></main>
<footer>by James McGuire · <a href="privacy.html">Privacy policy</a></footer>

<div id="scores" role="dialog" aria-modal="true" aria-labelledby="sct" hidden>
  <div class="sc-in">
    <button class="sc-back" id="scback" type="button">◀ Games</button>
    <h2 id="sct">My <span class="n">Scores</span></h2>
    <p class="sub">Your records in every game, saved right here on this phone.</p>
    <div class="sc-sum" id="scsum"></div>
    <div id="sclist"></div>
  </div>
</div>

<div id="player" role="dialog" aria-label="Game">
  <iframe id="frame" title="Game" allow="autoplay; fullscreen"></iframe>
  <button class="close" id="close" aria-label="Back to the arcade">◀ ARCADE</button>
</div>

<script src="games.js"></script>
<script>
(function(){
  var COLORS={Platform:'var(--arcade)',Adventure:'var(--sports)',Racing:'var(--racing)',Action:'var(--shooter)',Sports:'var(--puzzle)',Puzzle:'var(--pop)'};
  var games=window.ARCADE_GAMES, total=window.ARCADE_TOTAL, filter='All';
  var grid=document.getElementById('grid'), chips=document.getElementById('chips');
  var genres=['All'].concat(Object.keys(COLORS).filter(function(g){return games.some(function(x){return x.genre===g})}));
  if (games.length < total) genres.push('Coming soon');
  genres.forEach(function(g){
    var b=document.createElement('button');b.className='chip';b.textContent=g;b.setAttribute('aria-pressed',g==='All');
    b.onclick=function(){filter=g;Array.prototype.forEach.call(chips.children,function(c){c.setAttribute('aria-pressed',c===b)});render()};
    chips.appendChild(b);
  });
  function pad(n){return (n<10?'0':'')+n}
  function render(){
    grid.innerHTML='';
    var shown=0;
    for(var i=0;i<total;i++){
      var g=games[i], el;
      if(g){
        if(filter!=='All'&&filter!==g.genre)continue;
        el=document.createElement('button');el.className='tile';el.style.setProperty('--c',COLORS[g.genre]);
        el.innerHTML='<span class="g"></span><span class="num"></span><span class="name"></span><span class="tag"></span>';
        el.querySelector('.g').textContent=g.genre;el.querySelector('.num').textContent=pad(i+1);
        el.querySelector('.name').textContent=g.name;el.querySelector('.tag').textContent=g.tag;
        el.onclick=(function(id,name){return function(){open(id,name)}})(g.id,g.name);
      }else{
        if(filter!=='All'&&filter!=='Coming soon')continue;
        el=document.createElement('div');el.className='tile soon';
        el.innerHTML='<span class="num"></span><span class="name">Coming soon</span><span class="tag">New game on the way</span>';
        el.querySelector('.num').textContent=pad(i+1);
      }
      grid.appendChild(el);shown++;
    }
    document.getElementById('count').textContent=games.length>=total?total+' games':games.length+' games ready · '+(total-games.length)+' more coming';
  }
  var player=document.getElementById('player'), frame=document.getElementById('frame');
  function open(id,name){
    go(frame,'games/'+id+'.html');frame.title=name;player.classList.add('on');
    history.pushState({game:id},'','#'+id);
    setTimeout(function(){try{frame.contentWindow.focus()}catch(e){}},300);
  }
  function shut(){player.classList.remove('on');go(frame,'about:blank')}
  // swap the game frame's page without adding a step to the phone's back-button history
  function go(f,url){try{f.contentWindow.location.replace(url)}catch(e){f.src=url}}
  document.getElementById('close').onclick=function(){history.state&&history.state.game?history.back():shut()};

  // ---- My Scores: best score, times played and last played for every game (all stored on this phone) ----
  var sc=document.getElementById('scores'), scBack=document.getElementById('scback');
  var LABEL={time:'BEST TIME',cs:'BEST TIME',mins:'FASTEST',par:'BEST ROUND',wins:'WINS',fights:'MOST WON',cup:'BEST CUP'};
  function store(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function fmt(v,kind){
    v=+v;
    if(kind==='time')return Math.floor(v/60)+':'+pad(Math.floor(v%60));
    if(kind==='cs'){var s=Math.floor(v/100);return Math.floor(s/60)+':'+pad(s%60)+'.'+pad(Math.floor(v%100))}
    if(kind==='mins')return v+' min';
    if(kind==='par'){var r=v-100;return r===0?'Even':r>0?'+'+r:'\u2212'+(-r)}
    if(kind==='wins')return v+(v===1?' win':' wins');
    if(kind==='fights')return v+(v===1?' fight':' fights');
    if(kind==='cup')return v+' pts';
    return v.toLocaleString();
  }
  function ago(t){
    var s=(Date.now()-t)/1000;
    if(s<90)return 'just now';
    if(s<3600)return Math.round(s/60)+' min ago';
    if(s<86400){var h=Math.round(s/3600);return h+(h===1?' hour ago':' hours ago')}
    if(s<172800)return 'yesterday';
    if(s<604800)return Math.floor(s/86400)+' days ago';
    return 'on '+new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }
  function renderScores(){
    var stats={};try{stats=JSON.parse(store('pa-stats')||'{}')||{}}catch(e){}
    var rows=games.map(function(g,i){var st=stats[g.key]||null,b=+store('pa-'+g.key)||0;return{g:g,i:i,st:st,best:b}});
    var played=rows.filter(function(r){return r.st||r.best}), fresh=rows.filter(function(r){return !(r.st||r.best)});
    played.sort(function(a,b){return((b.st&&b.st.at)||0)-((a.st&&a.st.at)||0)||a.i-b.i});
    var plays=0,fav=null;
    played.forEach(function(r){var n=r.st?r.st.n:0;plays+=n;if(n&&(!fav||n>fav.st.n))fav=r});
    var sum=document.getElementById('scsum');sum.innerHTML='';
    [[plays,plays===1?'game played':'games played'],[played.length+'/'+games.length,'games tried'],[fav?fav.g.name:'\u2014','most played']].forEach(function(x){
      var d=document.createElement('div'),b=document.createElement('b'),sp=document.createElement('span');b.textContent=x[0];sp.textContent=x[1];d.appendChild(b);d.appendChild(sp);sum.appendChild(d);
    });
    var list=document.getElementById('sclist');list.innerHTML='';
    function head(t){var h=document.createElement('div');h.className='sc-h';h.textContent=t;list.appendChild(h)}
    function row(r,none){
      var g=r.g,b=document.createElement('button');b.type='button';b.className='sc-row'+(none?' none':'');b.style.setProperty('--c',COLORS[g.genre]);
      b.innerHTML='<i></i><span><span class="nm"></span><span class="mt"></span></span><span class="bs"><small></small><span class="v"></span></span>';
      b.querySelector('.nm').textContent=g.name;
      var mt=[];
      if(none)mt.push(g.tag);
      else{
        if(r.st){mt.push('Played '+r.st.n+(r.st.n===1?' time':' times'));mt.push(ago(r.st.at))}
        else mt.push('Best from earlier games');
        if(r.st&&r.st.last!=null&&r.st.last!=='')mt.push(r.st.last==='W'?'won the last one':r.st.last==='L'?'lost the last one':'last '+fmt(r.st.last,g.kind));
      }
      b.querySelector('.mt').textContent=mt.join(' \u00b7 ');
      b.querySelector('small').textContent=none?'':(LABEL[g.kind]||'BEST');
      b.querySelector('.v').textContent=none?'Play \u25b6':r.best?fmt(r.best,g.kind):'\u2014';
      b.setAttribute('aria-label',g.name+(none?', not played yet':', '+b.querySelector('small').textContent.toLowerCase()+' '+b.querySelector('.v').textContent+'. '+mt.join(', ')));
      b.onclick=function(){open(g.id,g.name)};
      list.appendChild(b);
    }
    if(!played.length){var e=document.createElement('div');e.className='sc-empty';e.textContent='No scores yet. Play any game and your best score, how many times you played and when show up here.';list.appendChild(e)}
    else{head('YOUR GAMES');played.forEach(function(r){row(r,false)})}
    if(fresh.length){head('NOT PLAYED YET');fresh.forEach(function(r){row(r,true)})}
  }
  function showScores(push){renderScores();sc.hidden=false;document.body.style.overflow='hidden';if(push)history.pushState({scores:1},'','#scores');setTimeout(function(){scBack.focus()},60)}
  function hideScores(){sc.hidden=true;document.body.style.overflow=''}
  document.getElementById('mys').onclick=function(){showScores(true)};
  scBack.onclick=function(){history.state&&history.state.scores?history.back():hideScores()};
  addEventListener('keydown',function(e){if(e.key==='Escape'&&!sc.hidden&&!player.classList.contains('on'))scBack.click()});
  // the phone's back button steps out of a game (back to My Scores if you came from there), then out of My Scores
  window.addEventListener('popstate',function(){shut();if(history.state&&history.state.scores)showScores(false);else hideScores()});
  if(location.hash)history.replaceState(null,'',location.pathname);
  render();
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
